<script>
(()=>{
  function compactTopicEntry(){
    const grid=document.getElementById('topicGrid');
    if(!grid)return;
    const alreadyCompact=grid.querySelector('.list-card[onclick*="EPTopic.open"]');
    if(alreadyCompact)return;
    const hasLegacyCards=grid.querySelector('.feature-card');
    if(!hasLegacyCards)return;
    grid.className='list';
    grid.innerHTML='<div class="list-card" onclick="EPTopic.open()"><div class="row between"><div><b>🎯 Topic Practice</b><div class="muted">Choose a topic, mode and number of questions</div></div><span>›</span></div></div>';
    const h=grid.previousElementSibling;
    if(h&&h.classList.contains('section-title'))h.style.display='none';
  }
  function init(){
    compactTopicEntry();
    const grid=document.getElementById('topicGrid');
    if(!grid)return;
    let queued=false;
    new MutationObserver(()=>{
      if(queued)return;
      queued=true;
      queueMicrotask(()=>{queued=false;compactTopicEntry()});
    }).observe(grid,{childList:true});
  }
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let bankHub=null,savedHub=null,savedPending=null,lastProgress=null;
  function ensureFinalShells(){
    const main=$('main');if(!main)return;
    if(!$('bankCoverageView')){const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPFinalLearning.backBank()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional first-pass exposure. It never blocks Daily Practice.</p></div></div><div id="bankCoverageBody"></div>';main.appendChild(s)}
    if(!$('mySavedRevisionView')){const s=document.createElement('section');s.id='mySavedRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPFinalLearning.backSaved()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision · separate from Daily Practice.</p></div></div><div id="mySavedRevisionBody"></div>';main.appendChild(s)}
    if(!$('mySavedRevisionPicker')){const w=document.createElement('div');w.id='mySavedRevisionPicker';w.className='sheet-backdrop hidden';w.innerHTML='<div class="sheet"><h3 id="mySavedRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPFinalLearning.savedRunCount(10)">10</button><button onclick="EPFinalLearning.savedRunCount(20)">20</button><button onclick="EPFinalLearning.savedRunCount(50)">50</button><button onclick="EPFinalLearning.savedRunCount(100)">100</button></div><button class="btn ghost full" onclick="EPFinalLearning.savedClosePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('epFinalStyles')){const st=document.createElement('style');st.id='epFinalStyles';st.textContent='.epf-card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:13px}.epf-grid{display:grid;gap:9px}.epf-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.epf-actions .btn{min-height:39px;padding:6px 4px;font-size:11px}.epf-meta{font-size:11px;color:var(--muted);margin-top:4px}.epf-progress-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.epf-metric{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--card)}.epf-metric span{display:block;font-size:10px;color:var(--muted);font-weight:800}.epf-metric b{font-size:18px}.epf-category{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.epf-category .muted{font-size:11px}.epf-full{color:var(--ok);font-weight:900;font-size:11px}';document.head.appendChild(st)}
    injectBankEntry();
  }
  function showPage(id){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$(id)?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function injectBankEntry(){const grid=document.querySelector('#homeView .grid .grid');if(!grid||grid.querySelector('[data-bank-coverage]'))return;const b=document.createElement('button');b.className='btn ghost quick-btn';b.dataset.bankCoverage='1';b.onclick=()=>openBank();b.innerHTML='<span>⚡</span><span><b>Bank Coverage</b><small>Optional · unseen questions only</small></span>';const newBtn=[...grid.querySelectorAll('button')].find(x=>(x.textContent||'').includes('New Practice'));if(newBtn)newBtn.insertAdjacentElement('afterend',b);else grid.appendChild(b)}
  async function openBank(){ensureFinalShells();showPage('bankCoverageView');const el=$('bankCoverageBody');el.innerHTML='<div class="list-card"><div class="muted">Checking unseen questions…</div></div>';try{bankHub=await EPApp.call('getBankCoverageHub');renderBank()}catch(e){el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function renderBank(){const el=$('bankCoverageBody');if(!el||!bankHub)return;el.innerHTML=`<div class="epf-card" style="margin-bottom:12px"><div class="muted">BANK EXPOSED</div><b style="font-size:24px">${fmt(bankHub.percent)}%</b><div class="muted">${Number(bankHub.exposed||0)} / ${Number(bankHub.total||0)} unique questions exposed</div>${bankHub.fullyExposed?'<div class="epf-full">BANK FULLY EXPOSED ✅</div>':''}</div><div class="epf-grid">${(bankHub.categories||[]).map(c=>`<div class="epf-card"><div class="row between"><div><b>${esc(c.topic)}</b><div class="epf-meta">${Number(c.availableToday||0)} new · ${Number(c.exposed||0)} / ${Number(c.total||0)} exposed · ${fmt(c.coveragePercent)}%</div></div><button class="btn soft mini" ${Number(c.availableToday||0)?'':'disabled'} onclick='EPFinalLearning.startBank(${JSON.stringify(String(c.topic||''))})'>${Number(c.availableToday||0)?'Start':'Done'}</button></div>${!Number(c.unseen||0)?'<div class="epf-full">BANK FULLY EXPOSED ✅</div>':''}</div>`).join('')}</div>`}
  async function startBank(topic){try{const qs=await EPApp.call('getBankCoverageBatch',topic);if(!qs.length){EPApp.toast('No unseen Bank Coverage questions left for today.');bankHub=await EPApp.call('getBankCoverageHub');renderBank();return}document.body.classList.add('quiz-active');EPQuiz.start(qs,{mode:'bankCoverage',title:'Bank Coverage · '+topic,batchId:'bank-'+new Date().toISOString().slice(0,10)+'-'+topic,returnTab:'home'})}catch(e){EPApp.toast('Could not load Bank Coverage: '+(e.message||e))}}
  function backBank(){EPApp.showTab('home')}

  async function openSaved(){ensureFinalShells();showPage('mySavedRevisionView');const el=$('mySavedRevisionBody');el.innerHTML='<div class="list-card"><div class="muted">Preparing My Saved Words…</div></div>';try{savedHub=await EPApp.call('getMySavedRevisionHub');renderSaved()}catch(e){el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function savedActions(scope,st){const j=JSON.stringify(scope),focus=Number(st.focus||0),nw=Number(st.newCount||0),weak=Number(st.weak||0),diff=Number(st.difficult||0),master=Number(st.mastered||0);return `<div class="epf-actions"><button class="btn soft mini" ${Number(st.saved||0)?'':'disabled'} onclick='EPFinalLearning.savedView(${j},"all")'>View All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPFinalLearning.savedStart(${j},"all",0)'>Practice All</button><button class="btn soft mini" ${nw?'':'disabled'} onclick='EPFinalLearning.savedPick(${j},"new")'>Practice New</button><button class="btn soft mini" ${weak?'':'disabled'} onclick='EPFinalLearning.savedPick(${j},"weak")'>Weak</button><button class="btn soft mini" ${diff?'':'disabled'} onclick='EPFinalLearning.savedStart(${j},"difficult",0)'>Difficult</button><button class="btn soft mini" ${master?'':'disabled'} onclick='EPFinalLearning.savedView(${j},"mastered")'>Mastered</button></div>`}
  function renderSaved(){const el=$('mySavedRevisionBody');if(!el||!savedHub)return;const all={fromDay:1,toDay:999999};el.innerHTML=`<div class="epf-card" style="margin-bottom:12px"><b>All My Saved Words</b><div class="epf-meta">${Number(savedHub.stats.saved||0)} saved · ${Number(savedHub.stats.focus||0)} active · ${Number(savedHub.stats.difficult||0)} difficult</div>${savedActions(all,savedHub.stats)}</div><h3 class="section-title">Saved by Day</h3><div class="epf-grid">${(savedHub.groups||[]).map(g=>`<div class="epf-card"><b>${esc(g.label)}</b><div class="epf-meta">${Number(g.stats.saved||0)} saved · ${Number(g.stats.weak||0)} weak · ${Number(g.stats.difficult||0)} difficult</div>${savedActions({fromDay:g.day,toDay:g.day},g.stats)}</div>`).join('')||'<div class="empty card">No enriched saved words are ready for practice yet.</div>'}</div>`}
  function savedPick(scope,kind){savedPending={scope,kind};$('mySavedRevisionPickerTitle').textContent=kind==='new'?'Practice New Saved Words':'Weak Saved Words';$('mySavedRevisionPicker').classList.remove('hidden')}
  function savedClosePicker(){$('mySavedRevisionPicker')?.classList.add('hidden');savedPending=null}
  function savedRunCount(n){if(!savedPending)return;const p=savedPending;savedClosePicker();savedStart(p.scope,p.kind,n)}
  async function savedStart(scope,kind,count){try{const qs=await EPApp.call('getMySavedRevisionBatch',scope,kind,count||0);if(!qs.length){EPApp.toast('No eligible saved words in this range.');return}document.body.classList.add('quiz-active');EPQuiz.start(qs,{mode:'mySavedRevision',title:'My Saved Words',batchId:`saved-${scope.fromDay}-${scope.toDay}-${kind}-${count||0}`,returnTab:'revision'})}catch(e){EPApp.toast('Could not load My Saved Words: '+(e.message||e))}}
  async function savedView(scope,kind){const el=$('mySavedRevisionBody');el.innerHTML='<div class="list-card"><div class="muted">Preparing saved list…</div></div>';try{const rows=await EPApp.call('getMySavedRevisionItems',scope,kind);el.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPFinalLearning.openSaved()">← My Saved Words</button><h3>${kind==='mastered'?'Mastered Saved Words':'Saved Words'}</h3><div class="muted">${rows.length} questions</div></div><div class="epf-grid">${rows.map((x,i)=>`<div class="epf-card"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b><div class="muted">${esc(x.topic||'')} · ${esc(x.state||'')}</div></div>`).join('')}</div>`}catch(e){el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function backSaved(){EPApp.showTab('revision')}

  function fmt(v){const n=Number(v||0);return n.toFixed(n%1?1:0)}
  function latestProgress(){if(lastProgress)return lastProgress;try{const p=JSON.parse(localStorage.getItem('ep-progress-snapshot-v1')||'null');if(p&&Object.prototype.hasOwnProperty.call(p,'firstAttemptAccuracy'))return p}catch(e){}return null}
  function renderFinalProgress(){const p=latestProgress(),view=$('progressView');if(!p||!view||view.classList.contains('hidden'))return;const over=$('progressOverview'),sum=$('progressSummary'),list=$('progressList'),method=$('progressMethod');if(over)over.innerHTML=`<div><span>BANK EXPOSED</span><b>${fmt(p.bankExposedPercent)}%</b></div><div><span>FIRST ATTEMPT</span><b>${fmt(p.firstAttemptAccuracy)}%</b></div><div><span>RETENTION</span><b>${fmt(p.retentionAccuracy)}%</b></div><div><span>MASTERED</span><b>${Number(p.masteredCount||0)}</b></div>`;if(sum)sum.innerHTML=`<div class="epf-progress-grid"><div class="epf-metric"><span>WEAK CONCEPTS</span><b>${Number(p.weakConcepts||0)}</b></div><div class="epf-metric"><span>PERSISTENT WEAK</span><b>${Number(p.persistentWeak||0)}</b></div><div class="epf-metric"><span>AFTER-REVIEW ACCURACY</span><b>${fmt(p.afterReviewAccuracy)}%</b></div><div class="epf-metric"><span>FRAGILE</span><b>${Number(p.fragile||0)}</b></div></div><div class="progress-today" style="margin-top:10px">Retention requires at least ${Number(p.retentionMinHours||20)} hours between attempts.</div>`;if(method)method.textContent='Bank Exposed = unique genuinely attempted Question_IDs / eligible bank Question_IDs. First-Attempt Accuracy uses each question’s first genuine attempt. After-Review uses subsequent attempts before the retention spacing threshold. Retention Accuracy counts later attempts only after the genuine spacing threshold. Marked-only zero-attempt rows are excluded.';if(list)list.innerHTML=(p.categories||[]).map(c=>`<article class="epf-category"><div class="row between"><b>${esc(c.name||c.topic)}</b><strong>${Number(c.encountered||0)} / ${Number(c.total||0)}</strong></div><div class="muted">Coverage ${fmt(c.coveragePercent)}% · First ${fmt(c.firstAttemptAccuracy)}% · Retention ${fmt(c.retentionAccuracy)}%</div><div class="muted">Weak ${Number(c.weak||0)} · Persistent Weak ${Number(c.persistentWeak||0)}</div></article>`).join('')}

  function wire(){
    ensureFinalShells();
    if(typeof EPApp!=='undefined'&&!EPApp.__finalLearningCallWired){EPApp.__finalLearningCallWired=true;const call=EPApp.call.bind(EPApp);EPApp.call=function(fn,...args){let actual=fn;if(fn==='submitAnswer'){actual='submitAnswerV2';args[0]=Object.assign({},args[0]||{},{attemptId:(args[0]&&args[0].attemptId)||String(args[0]?.questionId||'Q')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)})}if(fn==='getEncounterProgress')actual='getFinalLearningProgress';if(fn==='setStarredRevisionDifficult')actual='setQuestionDifficult';const p=call(actual,...args);if(fn==='getEncounterProgress'&&p&&p.then)return p.then(x=>{lastProgress=x;setTimeout(renderFinalProgress,0);return x});return p};EPApp.openSaved=openSaved}
    if(typeof EPQuiz!=='undefined'&&!EPQuiz.__mySavedRevisionWired){EPQuiz.__mySavedRevisionWired=true;const start=EPQuiz.start;EPQuiz.start=function(qs,meta){const r=start.apply(this,arguments);if(meta&&meta.mode==='mySavedRevision')setTimeout(()=>window.EPStarredRevision?.setDifficultQuizContext(qs,true),0);return r}}
    const pv=$('progressView');if(pv)new MutationObserver(()=>setTimeout(renderFinalProgress,0)).observe(pv,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  }
  document.addEventListener('DOMContentLoaded',wire);
  window.EPFinalLearning={openBank,startBank,backBank,openSaved,backSaved,savedPick,savedClosePicker,savedRunCount,savedStart,savedView,renderFinalProgress};
})();
</script>
