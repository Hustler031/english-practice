<script>
(()=>{
  let sources=[],current=null;
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const icon=k=>k==='handwritten'?'✍️':k==='hindu'?'📰':k==='screenshot'?'🖼️':k==='pdf'?'📄':'📚';
  function ensure(){if(!$('sourceModeSheet')){const w=document.createElement('div');w.id='sourceModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeSheet()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="sourceModeTitle">Choose questions</h3><div id="sourceModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPSource.closeSheet()">Cancel</button></div>';document.body.appendChild(w)}}
  async function openSources(){ensure();EPApp.showTab('sources');const list=$('sourceList'),cached=window.EPFast&&EPFast.get('source:hub');if(cached){sources=cached;renderSources();return}list.innerHTML='<div class="list-card"><div class="muted">Preparing sources…</div></div>';try{sources=await EPApp.call('getSourceHub');if(window.EPFast)EPFast.set('source:hub',sources);renderSources()}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderSources(){const list=$('sourceList');list.innerHTML=sources.length?sources.map((s,i)=>`<div class="list-card" onclick="EPSource.openHub(${i})"><div class="row between"><div><b>${icon(s.kind)} ${esc(s.name)}</b><div class="muted">${s.count} questions${s.weak?` · ${s.weak} weak`:''}${s.kind==='hindu'&&s.children?.length?` · ${s.children.length} days`:''}</div></div><span>›</span></div></div>`).join(''):'<div class="empty card">No managed sources added yet.</div>'}
  function actionRow(s,key,name,weak,count){return `<div class="compact-actions four"><button class="btn soft mini" onclick='EPSource.viewAll(${JSON.stringify(key)},${JSON.stringify(name)})'>View All</button><button class="btn soft mini" onclick='EPSource.start(${JSON.stringify(key)},"all",0,${JSON.stringify(name)})'>Practice All</button><button class="btn soft mini" ${weak?'':'disabled'} onclick='EPSource.choose(${JSON.stringify(key)},"weak",${JSON.stringify(name)},${Number(weak||0)})'>Weak</button><button class="btn soft mini" onclick='EPSource.choose(${JSON.stringify(key)},"random",${JSON.stringify(name)},${Number(count||0)})'>Random</button></div>`}
  function openHub(i){current=sources[i];if(!current)return;const s=current,list=$('sourceList');const children=s.kind==='hindu'&&s.children?.length?`<h3 class="section-title">Daily Batches</h3><div class="list">${s.children.map(c=>`<div class="list-card"><div class="row between"><div><b>${esc(c.date)}</b><div class="muted">${c.count} words${c.weak?` · ${c.weak} weak`:''}</div></div></div>${actionRow(s,c.key,'The Hindu · '+c.date,c.weak,c.count)}</div>`).join('')}</div>`:'';list.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPSource.openSources()">← All Sources</button><h2 style="margin:14px 0 4px">${icon(s.kind)} ${esc(s.name)}</h2><div class="muted">${s.count} questions${s.weak?` · ${s.weak} weak`:''}</div>${actionRow(s,s.key,s.name,s.weak,s.count)}</div>${children}`;window.scrollTo({top:0,behavior:'smooth'})}
  function choose(key,kind,name,available){ensure();$('sourceModeTitle').textContent=`${name} · ${kind==='weak'?'Weak':'Random'}`;$('sourceModeBody').innerHTML=`<div class="muted">${available} available · choose questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button onclick='EPSource.start(${JSON.stringify(key)},${JSON.stringify(kind)},${n},${JSON.stringify(name)})'>${n}</button>`).join('')}</div>`;$('sourceModeSheet').classList.remove('hidden')}
  function closeSheet(){$('sourceModeSheet')?.classList.add('hidden')}
  async function start(key,kind,count,name){closeSheet();showLoad(`Loading ${name} Quiz…`);const opts={source:key,batchId:kind+(count?'-'+count:''),returnTab:'sources'};if(EPQuiz.hasSavedSessionFor('source')){if(EPQuiz.isSameRequested('source',opts)){hideLoad();EPQuiz.resumeOther();return}if(!confirm('A paused source practice set exists. Start this one and replace it?')){hideLoad();return}EPQuiz.replaceSavedFor('source')}
    try{const qs=await EPApp.call('getSourcePracticeBatch',key,kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible questions in this source.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'source',source:key,batchId:opts.batchId,title:name,returnTab:'sources'})}catch(e){hideLoad();EPApp.toast('Could not load source practice: '+e.message)}}
  async function viewAll(key,name){const ck='source:items:'+key,cached=window.EPFast&&EPFast.get(ck),list=$('sourceList');if(cached){renderItems(cached,name);return}list.innerHTML='<div class="list-card"><div class="muted">Preparing list…</div></div>';try{const items=await EPApp.call('getSourceItems',key);if(window.EPFast)EPFast.set(ck,items);renderItems(items,name)}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderItems(items,name){$('sourceList').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPSource.openSources()">← Sources</button><h2 style="margin:14px 0 4px">${esc(name)} · View All</h2><div class="muted">${items.length} items</div></div><div class="browse-list">${items.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.date?esc(x.date)+' · ':''}${x.weak?'Weak · ':''}${x.attempts?'Started':'New'}</div></div>`).join('')}</div>`}
  function showLoad(t){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=t;v.classList.remove('hidden')}
  function hideLoad(){$('compactQuizLoading')?.classList.add('hidden')}
  EPApp.openSources=openSources;EPApp.openSourceHub=openHub;EPApp.startSourceManaged=start;window.EPSource={openSources,openHub,choose,closeSheet,start,viewAll};
})();
</script>
