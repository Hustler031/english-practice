<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let lastScope={fromDay:1,toDay:999999},lastKind='all';
  function ensureStyle(){if($('srViewDetailStyles'))return;const st=document.createElement('style');st.id='srViewDetailStyles';st.textContent='.sr-browse-item.sr-openable{cursor:pointer}.sr-browse-item.sr-openable:active{transform:scale(.995)}.sr-detail-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;gap:12px}.sr-detail-question{font-size:19px;font-weight:850;line-height:1.45}.sr-detail-word{font-size:26px;font-weight:900}.sr-detail-options{display:grid;gap:8px}.sr-detail-option{border:1px solid var(--line);border-radius:11px;padding:10px 11px}.sr-detail-option.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card))}.sr-detail-block{border-top:1px solid var(--line);padding-top:10px}.sr-detail-block small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}';document.head.appendChild(st)}
  function block(label,value){if(!String(value||'').trim())return'';return `<div class="sr-detail-block"><small>${esc(label)}</small><div style="white-space:pre-wrap">${esc(value)}</div></div>`}
  async function view(scope,kind){ensureStyle();lastScope=scope||{fromDay:1,toDay:999999};lastKind=kind||'all';const body=$('starredRevisionBody');if(!body)return;body.innerHTML='<div class="list-card"><div class="muted">Preparing starred list…</div></div>';try{const rows=await EPApp.call('getStarredRevisionItems',lastScope,lastKind);body.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPStarredRevision.open()">← Starred Revision</button><h3 style="margin:14px 0 4px">${lastKind==='mastered'?'Mastered from Starred':'Starred Questions'}</h3><div class="muted">${rows.length} questions · tap any question to view answer</div></div><div class="sr-browse">${rows.map((x,i)=>`<div class="sr-browse-item sr-openable" onclick='EPStarredViewDetail.open(${JSON.stringify(String(x.id||''))})'><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">Day ${x.day}${x.mastered?' · Mastered':x.weak?' · Weak':' · Focus'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}catch(e){body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  async function open(id){ensureStyle();const body=$('starredRevisionBody');if(!body)return;body.innerHTML='<div class="list-card"><div class="muted">Opening question…</div></div>';try{const q=await EPApp.call('getStarredRevisionQuestionDetail',id),keys=['A','B','C','D'],opts=Array.isArray(q.options)?q.options:[],correct=String(q.correctKey||'').toUpperCase();body.innerHTML=`<div class="subhead"><button class="btn ghost" onclick="EPStarredViewDetail.backToList()">← View All</button><div><h2>Question Review</h2><p class="muted">View only · does not affect attempts or accuracy</p></div></div><div class="sr-detail-card">${q.word?`<div class="sr-detail-word">${esc(q.word)}</div>`:''}<div class="sr-detail-question">${esc(q.question||'')}</div><div class="sr-detail-options">${opts.map((o,i)=>`<div class="sr-detail-option ${String(o.key||keys[i]).toUpperCase()===correct?'correct':''}"><b>${esc(o.key||keys[i])}.</b> ${esc(o.text||'')}</div>`).join('')}</div>${block('Correct answer',correct)}${block('Explanation',q.explanation)}${block('Example',q.example)}${block('Usage',q.usageNote)}${block('Tip',q.tip)}${block('Remember',q.memoryAid)}${block('Related',q.related)}</div>`;window.scrollTo({top:0,behavior:'smooth'})}catch(e){body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function backToList(){view(lastScope,lastKind)}
  function install(){if(window.EPStarredRevision&&!EPStarredRevision.__viewDetail){EPStarredRevision.view=view;EPStarredRevision.__viewDetail=true}}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,0));
  window.EPStarredViewDetail={open,backToList,view,install};
})();
</script>
