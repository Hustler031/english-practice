<script>
const EPTopic=(()=>{
  let hub=[];
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function ensure(){
    const grid=$('topicGrid');if(grid){grid.className='list';grid.innerHTML='<div class="list-card" onclick="EPTopic.open()"><div class="row between"><div><b>🎯 Topic Practice</b><div class="muted">Choose a topic, mode and number of questions</div></div><span>›</span></div></div>';const h=grid.previousElementSibling;if(h&&h.classList.contains('section-title'))h.style.display='none'}
    if(!$('topicPracticeView')){const s=document.createElement('section');s.id='topicPracticeView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPApp.showTab(\'practice\')">← Back</button><div><h2>Topic Practice</h2><p class="muted">Choose one topic. Then choose how you want to practise it.</p></div></div><div id="topicPracticeList" class="list"></div>'; $('main').appendChild(s)}
    if(!$('topicModeSheet')){const w=document.createElement('div');w.id='topicModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeSheet()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="topicModeTitle">Practice</h3><div id="topicModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPTopic.closeSheet()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('topicUiStyle')){const st=document.createElement('style');st.id='topicUiStyle';st.textContent='.compact-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.compact-actions.four{grid-template-columns:repeat(4,minmax(0,1fr))}.compact-actions .btn{min-height:38px;padding:7px 5px;font-size:11px}.browse-list{display:grid;gap:8px;margin-top:12px}.browse-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card)}@media(max-width:420px){.compact-actions.four .btn{font-size:10px;padding:6px 3px}}';document.head.appendChild(st)}
  }
  function showOwn(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');$('topicPracticeView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  async function open(){ensure();showOwn();const list=$('topicPracticeList');const cached=window.EPFast&&EPFast.get('topic:hub');if(cached){hub=cached;render()}else list.innerHTML=skeleton();
    try{hub=await EPApp.call('getTopicPracticeHub');if(window.EPFast)EPFast.set('topic:hub',hub);render()}catch(e){if(!cached)list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function skeleton(){return '<div class="list-card"><div class="muted">Preparing topics…</div></div><div class="list-card"><div class="muted">&nbsp;</div></div>'}
  function render(){const list=$('topicPracticeList');list.innerHTML=hub.length?hub.map((t,i)=>`<div class="list-card" onclick="EPTopic.openTopic(${i})"><div class="row between"><div><b>${esc(t.name)}</b><div class="muted">${t.total} total · ${t.newCount} new · ${t.started} started${t.weak?` · ${t.weak} weak`:''}</div></div><span>›</span></div></div>`).join(''):'<div class="empty card">No topic questions available.</div>'}
  function openTopic(i){const t=hub[i];if(!t)return;const list=$('topicPracticeList');list.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPTopic.open()">← Topics</button><h2 style="margin:14px 0 4px">${esc(t.name)}</h2><div class="muted">${t.total} total · ${t.newCount} new · ${t.started} started${t.weak?` · ${t.weak} weak`:''}</div><div class="compact-actions" style="grid-template-columns:repeat(3,minmax(0,1fr))"><button class="btn soft mini" onclick="EPTopic.viewAll('${esc(t.id)}','${esc(t.name)}')">View All</button><button class="btn soft mini" onclick="EPTopic.start('${esc(t.id)}','all',0,'${esc(t.name)}')">Practice All</button><button class="btn soft mini" ${t.weak?'':'disabled'} onclick="EPTopic.chooseCount('${esc(t.id)}','weak','${esc(t.name)}',${t.weak})">Weak</button><button class="btn soft mini" ${t.started?'':'disabled'} onclick="EPTopic.chooseCount('${esc(t.id)}','started','${esc(t.name)}',${t.started})">Started</button><button class="btn soft mini" ${t.newCount?'':'disabled'} onclick="EPTopic.chooseCount('${esc(t.id)}','new','${esc(t.name)}',${t.newCount})">New</button><button class="btn soft mini" onclick="EPTopic.chooseCount('${esc(t.id)}','random','${esc(t.name)}',${t.total})">Random</button></div></div>`;window.scrollTo({top:0,behavior:'smooth'})}
  function chooseCount(id,kind,name,available){$('topicModeTitle').textContent=`${name} · ${kind[0].toUpperCase()+kind.slice(1)}`;$('topicModeBody').innerHTML=`<div class="muted">${available} available · choose questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button ${available<=0?'disabled':''} onclick="EPTopic.start('${esc(id)}','${esc(kind)}',${n},'${esc(name)}')">${n}</button>`).join('')}</div>`;$('topicModeSheet').classList.remove('hidden')}
  function closeSheet(){$('topicModeSheet')?.classList.add('hidden')}
  async function start(id,kind,count,name){closeSheet();showLoading(`Loading ${name} Quiz…`);try{const qs=await EPApp.call('getTopicPracticeBatch',id,kind,count||0);hideLoading();if(!qs.length){EPApp.toast('No eligible questions in this selection.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'topicManaged',category:id,batchId:kind+(count?'-'+count:''),title:name+' · '+kind,returnTab:'practice'})}catch(e){hideLoading();EPApp.toast('Could not load topic practice: '+e.message)}}
  async function viewAll(id,name){const key='topic:items:'+id,old=window.EPFast&&EPFast.get(key),list=$('topicPracticeList');if(old)renderItems(old,name,id);else list.innerHTML='<div class="list-card"><div class="muted">Preparing list…</div></div>';try{const items=await EPApp.call('getTopicPracticeItems',id);if(window.EPFast)EPFast.set(key,items);renderItems(items,name,id)}catch(e){if(!old)list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderItems(items,name,id){$('topicPracticeList').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPTopic.open()">← Topics</button><h2 style="margin:14px 0 4px">${esc(name)} · View All</h2><div class="muted">${items.length} questions</div></div><div class="browse-list">${items.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.weak?'Weak · ':''}${x.started?'Started':'New'}${x.subtopic?` · ${esc(x.subtopic)}`:''}</div></div>`).join('')}</div>`}
  function showLoading(text){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=text||'Loading Quiz…';v.classList.remove('hidden')}
  function hideLoading(){$('compactQuizLoading')?.classList.add('hidden')}
  function init(){ensure();if(typeof EPApp!=='undefined'&&!EPApp.__topicUiWired){EPApp.__topicUiWired=true;const os=EPApp.showTab;EPApp.showTab=function(name){if(name!=='topicPractice')$('topicPracticeView')?.classList.add('hidden');const r=os.apply(this,arguments);if(name==='practice')ensure();return r};EPApp.openTopicPractice=open}}
  document.addEventListener('DOMContentLoaded',init);
  return{open,openTopic,chooseCount,closeSheet,start,viewAll};
})();
</script>
