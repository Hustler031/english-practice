<script>
const EPApp=(()=>{
  let boot=null,pendingMode=null,pendingCategory=null;
  const $=id=>document.getElementById(id);
  const gas=(fn,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err.message||err)))[fn](...args));
  function initTheme(){const saved=localStorage.getItem('ep-theme')||'light';document.documentElement.dataset.theme=saved;$('themeBtn').textContent=saved==='dark'?'☀':'☾'}
  function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('ep-theme',next);$('themeBtn').textContent=next==='dark'?'☀':'☾'}
  function allViews(){return['home','practice','revision','library','hindu','sources','mastered']}
  function showTab(name){allViews().forEach(tab=>{const v=$(tab+'View');if(v)v.classList.toggle('hidden',tab!==name)});$('quizView').classList.add('hidden');document.body.classList.remove('quiz-active');$('bottomNav').classList.toggle('hidden',['hindu','sources','mastered'].includes(name));document.querySelectorAll('.bottom-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));window.scrollTo({top:0,behavior:'smooth'});if(name==='home')refreshResumeCard()}
  async function load(){initTheme();showTab('home');try{boot=await gas('getBootstrap');renderBootstrap();renderTopics();refreshResumeCard();gas('warmPracticeCache').catch(()=>{})}catch(e){toast('Could not load dashboard: '+e.message)}}
  function renderBootstrap(){const s=boot.stats,target=boot.dailyTarget||120,done=s.dailyCompleted||0,total=s.dailyTotal||0;$('dailyProgress').textContent=`${done} / ${total||target}`;$('dailyBar').style.width=`${Math.min(100,(done/Math.max(1,total||target))*100)}%`;$('dailyNote').textContent=total<target?`${total} unique active questions are currently available. Daily 120 will automatically expand as your database grows.`:'';$('hinduCount').textContent=s.hinduToday?`${s.hinduToday} words today`:'Today’s batch not added yet';$('recallCount').textContent=s.recall?`${s.recall} items waiting`:'Seen-before content';$('masteredCount').textContent=s.mastered?`${s.mastered} excluded items`:'Don’t repeat'}
  function renderTopics(){const grid=$('topicGrid');grid.innerHTML='';const icons={VOC:'Aa',IDIOM:'💬',PHRASAL:'↗',OWS:'1W',SYN_ANT:'⇄',CONFUSED:'≠',SPELLING:'✓',GRAMMAR:'G',ERROR:'!',SENT_IMP:'✎',FILL:'…',CLOZE:'▤',PARA:'↕',RC:'📖',MISC:'+'};(boot?.categories||[]).filter(c=>c.id!=='HINDU_VOCAB').forEach(c=>{const b=document.createElement('button'),count=Number(c.count||0);b.className='feature-card';if(count<=0){b.disabled=true;b.innerHTML=`<span>${icons[c.id]||'•'}</span><b>${esc(c.name)}</b><small>No questions added yet</small>`}else{b.innerHTML=`<span>${icons[c.id]||'•'}</span><b>${esc(c.name)}</b><small>${count} available · tap to start</small>`;b.onclick=()=>start('category',{count:Math.min(20,count),category:c.id,returnTab:'practice'})}grid.appendChild(b)})}
  function pickCount(mode,category){pendingMode=mode;pendingCategory=category||null;const wrap=$('countButtons');wrap.innerHTML='';(boot?.extraCounts||[10,20,30,50]).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>start(mode,{count:n,category:pendingCategory,returnTab:returnTabForMode(mode)});wrap.appendChild(b)});$('countSheet').classList.remove('hidden')}
  function closePicker(e){if(e&&e.target!==$('countSheet'))return;$('countSheet').classList.add('hidden')}
  async function startDirect(mode){return start(mode,{returnTab:returnTabForMode(mode)})}
  async function start(mode,opts={}){closePicker();if(EPQuiz.hasSavedSession()){if(EPQuiz.isSameRequested(mode,opts)){EPQuiz.resumeSaved();return}if(!confirm('A paused practice set exists. Start a new set and replace it?'))return}try{const qs=await gas('getPracticeBatch',mode,opts);if(!qs.length){toast(mode==='daily'?'Today’s eligible daily questions are already completed.':'No eligible questions in this section yet.');return}document.body.classList.add('quiz-active');$('bottomNav').classList.add('hidden');EPQuiz.start(qs,{mode,category:opts.category||'',source:opts.source||'',returnTab:opts.returnTab||returnTabForMode(mode)})}catch(e){toast('Could not load practice: '+e.message)}}
  async function openHindu(){showTab('hindu');$('hinduList').innerHTML='<div class="empty card">Loading today’s words…</div>';try{const words=await gas('getHinduToday');renderHindu(words)}catch(e){$('hinduList').innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderHindu(words){$('hinduActions').classList.toggle('hidden',!words.length);if(!words.length){$('hinduList').innerHTML='<div class="empty card">Today’s 10-word batch has not been added yet.</div>';return}$('hinduList').innerHTML=words.map((w,i)=>`<article class="word-card"><div class="row between"><div><span class="word-no">${i+1}</span><b class="word-title">${esc(w.word)}</b></div><span class="tag">${esc(w.pos||'')}</span></div><p class="meaning">${esc(w.meaning||'')}</p>${w.synonyms?`<p><b>Synonyms:</b> ${esc(w.synonyms)}</p>`:''}${w.antonyms?`<p><b>Antonyms:</b> ${esc(w.antonyms)}</p>`:''}${w.example?`<p><b>Example:</b> ${esc(w.example)}</p>`:''}${w.usage?`<p><b>Usage:</b> ${esc(w.usage)}</p>`:''}${w.tip?`<p class="tipbox"><b>Tip:</b> ${esc(w.tip)}</p>`:''}${w.memory?`<p><b>Remember:</b> ${esc(w.memory)}</p>`:''}<div class="muted source-line">${esc(w.sourceName||'')} ${w.date?'· '+esc(w.date):''}</div></article>`).join('')}
  async function startHinduQuiz(){try{const qs=await gas('getHinduQuiz');if(!qs.length){toast('Need at least two words for a quiz.');return}document.body.classList.add('quiz-active');$('bottomNav').classList.add('hidden');EPQuiz.start(qs,{mode:'hindu',returnTab:'hindu'})}catch(e){toast(e.message)}}
  async function openSources(){showTab('sources');$('sourceList').innerHTML='<div class="empty card">Loading sources…</div>';try{const rows=await gas('getSources');$('sourceList').innerHTML=rows.length?rows.map(s=>`<div class="list-card source-item" onclick='EPApp.startSource(${JSON.stringify(s.key)})'><div class="row between"><div><b>${esc(s.name)}</b><div class="muted">${s.count} questions${s.categorySummary?' · '+esc(s.categorySummary):''}</div></div><span>›</span></div></div>`).join(''):'<div class="empty card">No PDF/source metadata yet. Future uploads will appear here automatically.</div>'}catch(e){$('sourceList').innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function startSource(key){start('source',{source:key,count:20,returnTab:'sources'})}
  async function openMastered(){showTab('mastered');$('masteredList').innerHTML='<div class="empty card">Loading mastered questions…</div>';try{const rows=await gas('getMasteredItems');$('masteredList').innerHTML=rows.length?rows.map(x=>`<div class="list-card"><div class="row between"><div><b>${esc(x.word||x.id)}</b><div class="muted">${esc(x.topic||'')} ${x.source?'· '+esc(x.source):''}</div></div><button class="btn soft mini" onclick='event.stopPropagation();EPApp.restoreMastered(${JSON.stringify(x.id)})'>Restore</button></div></div>`).join(''):'<div class="empty card">Nothing is marked Mastered.</div>'}catch(e){$('masteredList').innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  async function restoreMastered(id){try{await gas('restoreMastered',id);toast('Restored to normal practice');boot=await gas('getBootstrap');renderBootstrap();renderTopics();openMastered()}catch(e){toast('Restore failed: '+e.message)}}
  function refreshResumeCard(){const r=EPQuiz.getResumeSummary(),card=$('resumeCard');if(!r){card.classList.add('hidden');return}card.classList.remove('hidden');$('resumeText').textContent=`${r.title} · ${r.index+1}/${r.total}`}
  function returnTabForMode(mode){if(mode==='category'||mode==='source')return'practice';if(['due','weak','recall'].includes(mode))return'revision';if(mode==='hindu')return'hindu';return'home'}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),2600)}
  function call(fn,...args){return gas(fn,...args)}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  document.addEventListener('DOMContentLoaded',load);
  return{toggleTheme,showTab,pickCount,closePicker,startDirect,start,openHindu,startHinduQuiz,openSources,startSource,openMastered,restoreMastered,toast,call,refreshResumeCard};
})();
</script>
