<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let words=[];
  function ensure(){
    let view=$('myWordsListView');if(!view){view=document.createElement('section');view.id='myWordsListView';view.className='app-page content hidden';document.getElementById('main')?.appendChild(view)}
    view.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMyWordsUX.back()">← Back</button><div><h2>My Words</h2><p class="muted">Every word you save appears here automatically.</p></div></div><div id="myWordsListBody" class="mywords-final-list"></div>';
    if(!$('myWordsFinalStyles')){const st=document.createElement('style');st.id='myWordsFinalStyles';st.textContent='.mywords-final-list{display:grid;gap:9px}.mywords-final-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.mywords-final-row b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mywords-final-status{font-size:11px;color:var(--muted);margin-top:3px}.mywords-final-row .btn{min-height:36px;padding:7px 12px;font-size:12px}.quick-word-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}@media(max-width:380px){.mywords-final-row b{font-size:15px}.mywords-final-row .btn{font-size:11px;padding:6px 9px}}';document.head.appendChild(st)}
    if(!$('quickWordSheet')){const w=document.createElement('div');w.id='quickWordSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeQuick()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3>＋ Add Word</h3><p class="muted">Save the word now. GPT enrichment and New Practice promotion happen automatically.</p><input id="quickWordInput" class="saved-input" autocomplete="off" placeholder="Enter word or phrase"><div class="quick-word-actions"><button class="btn ghost" onclick="EPMyWordsUX.closeQuick()">Cancel</button><button id="quickWordSaveBtn" class="btn primary" onclick="EPMyWordsUX.saveQuick()">Save</button></div></div>';document.body.appendChild(w)}
    if(!$('editWordSheet')){const w=document.createElement('div');w.id='editWordSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeEdit()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3>Edit Saved Word</h3><label class="muted" style="font-size:11px">Word / phrase</label><input id="editWordInput" class="saved-input" autocomplete="off"><label class="muted" style="display:block;font-size:11px;margin-top:10px">Context (optional)</label><textarea id="editWordContext" class="saved-input" style="min-height:80px"></textarea><input id="editWordId" type="hidden"><div class="quick-word-actions"><button class="btn ghost" onclick="EPMyWordsUX.closeEdit()">Cancel</button><button id="editWordSaveBtn" class="btn primary" onclick="EPMyWordsUX.saveEdit()">Save</button></div></div>';document.body.appendChild(w)}
  }
  function show(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('myWordsListView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function statusText(w){if(w.practiceQuestionId||String(w.status||'').toLowerCase()==='added')return 'In Practice';if(String(w.gptStatus||'').toLowerCase()==='ready')return 'Ready';return 'Pending enrichment'}
  function render(){const body=$('myWordsListBody');if(!body)return;body.innerHTML=words.length?words.map(w=>`<div class="mywords-final-row"><div><b>${esc(w.word)}</b><div class="mywords-final-status">${esc(statusText(w))}${w.created?` · ${esc(w.created)}`:''}</div></div><button class="btn ghost mini" onclick='EPMyWordsUX.edit(${JSON.stringify(String(w.id||''))})'>Edit</button></div>`).join(''):'<div class="empty card">No saved words yet.</div>'}
  async function open(){ensure();show();const cached=window.EPFast&&EPFast.get('saved:words');if(cached){words=cached;render();return}const body=$('myWordsListBody');if(body)body.innerHTML='<div class="list-card"><div class="muted">Preparing your words…</div></div>';try{words=await EPApp.call('getMyWords');if(window.EPFast)EPFast.set('saved:words',words);render()}catch(e){if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function back(){$('myWordsListView')?.classList.add('hidden');if(typeof EPApp!=='undefined'&&EPApp.openSaved)EPApp.openSaved();else EPApp.showTab('revision')}
  function quickAdd(){ensure();$('quickWordInput').value='';$('quickWordSheet').classList.remove('hidden');setTimeout(()=>$('quickWordInput')?.focus(),50)}
  function closeQuick(){$('quickWordSheet')?.classList.add('hidden')}
  function saveQuick(){const word=String($('quickWordInput')?.value||'').trim();if(!word){EPApp.toast('Enter a word first.');return}const btn=$('quickWordSaveBtn');if(btn){btn.disabled=true;btn.textContent='Saved ✓'}closeQuick();EPApp.toast('Saved to My Words · enrichment pending');EPApp.call('captureMyWord',{word,context:'',questionId:'',module:'Dashboard Quick Add',source:'Dashboard'}).then(()=>{if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub');EPFast.drop('new:hub')}if(btn){btn.disabled=false;btn.textContent='Save'}}).catch(e=>{if(btn){btn.disabled=false;btn.textContent='Save'}EPApp.toast('Could not save word: '+e.message)})}
  function edit(id){ensure();const w=words.find(x=>String(x.id)===String(id));if(!w)return;$('editWordId').value=String(w.id||'');$('editWordInput').value=String(w.word||'');$('editWordContext').value=String(w.context||'');$('editWordSheet').classList.remove('hidden');setTimeout(()=>$('editWordInput')?.focus(),50)}
  function closeEdit(){$('editWordSheet')?.classList.add('hidden')}
  async function saveEdit(){const id=String($('editWordId')?.value||''),word=String($('editWordInput')?.value||'').trim(),context=String($('editWordContext')?.value||'').trim();if(!id||!word){EPApp.toast('Word cannot be blank.');return}const btn=$('editWordSaveBtn');if(btn){btn.disabled=true;btn.textContent='Saving…'}try{await EPApp.call('updateMyWord',{id,word,context});const w=words.find(x=>String(x.id)===id);if(w){w.word=word;w.context=context}if(window.EPFast)EPFast.set('saved:words',words);closeEdit();render();EPApp.toast('Saved')}catch(e){EPApp.toast(e.message||e)}finally{if(btn){btn.disabled=false;btn.textContent='Save'}}}
  document.addEventListener('DOMContentLoaded',ensure);
  window.EPMyWordsUX={open,back,quickAdd,closeQuick,saveQuick,edit,closeEdit,saveEdit};
})();
</script>
