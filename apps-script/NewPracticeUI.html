<script>
const EPNew=(()=>{
  let hub=null,current=null,currentSource='ALL',lastRefresh=0,refreshing=false;
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
  const icons={VOC:'Aa',IDIOM:'💬',PHRASAL:'↗',OWS:'1W',SPELL:'✓',OTHER:'•••'};
  function ensure(){if(!$('newModeSheet')){const w=document.createElement('div');w.id='newModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeSheet()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="newModeTitle">Choose questions</h3><div id="newModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPNew.closeSheet()">Cancel</button></div>';document.body.appendChild(w)}if(!$('newPracticeActionStyles')){const st=document.createElement('style');st.id='newPracticeActionStyles';st.textContent='.new-bank-card{background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--primary) 7%,var(--card)));border:1px solid var(--line);border-radius:20px;padding:16px}.new-bank-head{display:flex;gap:12px;align-items:center}.new-bank-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 18%,var(--card));color:var(--primary);font-weight:900;font-size:18px}.new-six-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important;margin-top:14px}.new-six-actions .btn{font-size:11px;min-height:41px;padding:7px 5px;line-height:1.12}.new-type-card{padding:15px 16px!important;border-radius:18px!important}.new-source-filter{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:11px 12px;font-size:14px}@media(max-width:380px){.new-six-actions .btn{font-size:10px;padding:6px 3px}}';document.head.appendChild(st)}}
  function actionRow(id,name,total,weak,newCount,starred){return `<div class="new-six-actions"><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.viewAll(${JSON.stringify(id)},${JSON.stringify(name)})'>View All</button><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.start(${JSON.stringify(id)},"all",0,${JSON.stringify(name)})'>Practice All</button><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"new",${JSON.stringify(name)},${Number(total||0)})'>Practice New</button><button class="btn soft mini" ${weak?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"weak",${JSON.stringify(name)},${Number(weak||0)})'>Weak</button><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"random",${JSON.stringify(name)},${Number(total||0)})'>Random</button><button class="btn soft mini" ${starred?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"starred",${JSON.stringify(name)},${Number(starred||0)})'>Starred</button></div>`}
  async function refreshSilent(){if(refreshing||Date.now()-lastRefresh<60000)return;refreshing=true;try{const fresh=await EPApp.call('getNewPracticeHubLive');lastRefresh=Date.now();if(fresh){hub=fresh;if(window.EPFast)EPFast.set('new:hub',fresh);const view=$('newView');if(view&&!view.classList.contains('hidden')&&!current)render()}}catch(e){}finally{refreshing=false}}
  async function open(){ensure();current=null;currentSource='ALL';EPApp.showTab('new');const list=$('newPracticeList'),cached=window.EPFast&&EPFast.get('new:hub');if(cached){hub=cached;render();refreshSilent();return}list.innerHTML='<div class="list-card"><div class="muted">Preparing New Practice…</div></div>';try{hub=await EPApp.call('getNewPracticeHubLive');lastRefresh=Date.now();if(window.EPFast)EPFast.set('new:hub',hub);render()}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function render(){if(!hub)return;const list=$('newPracticeList');$('newPracticeNote').textContent=`Added-content bank · ${Number(hub.total||0)} unique questions`;list.innerHTML=`<div class="new-bank-card"><div class="new-bank-head"><div class="new-bank-icon">✨</div><div style="min-width:0;flex:1"><b style="font-size:20px">All New Practice</b><div class="muted">${Number(hub.total||0)} questions${hub.weak?` · ${hub.weak} weak`:''}${hub.starred?` · ${hub.starred} starred`:''}</div></div></div>${actionRow('ALL','All New Practice',hub.total,hub.weak,hub.newCount,hub.starred)}</div><h3 class="section-title">Practice by type</h3>${(hub.categories||[]).map((c,i)=>`<div class="list-card new-type-card" onclick="EPNew.openCategory(${i})"><div class="row between"><div class="new-bank-head"><div class="new-bank-icon">${esc(icons[c.id]||'•')}</div><div><b>${esc(c.name)}</b><div class="muted">${c.total} questions${c.weak?` · ${c.weak} weak`:''}${c.starred?` · ${c.starred} starred`:''}</div></div></div><span>›</span></div></div>`).join('')}`}
  function openCategory(i){current=hub&&hub.categories&&hub.categories[i];if(!current)return;currentSource='ALL';renderCategory();window.scrollTo({top:0,behavior:'smooth'})}
  function sourceStats(){if(!current||currentSource==='ALL')return current||{};return (current.sources||[]).find(x=>x.name===currentSource)||{total:0,weak:0,newCount:0,starred:0}}
  function renderCategory(){const c=current;if(!c)return;const stats=sourceStats(),sources=c.sources||[];$('newPracticeList').innerHTML=`<div class="new-bank-card"><button class="btn ghost mini" onclick="EPNew.open()">← Practice types</button><div class="new-bank-head" style="margin-top:14px"><div class="new-bank-icon">${esc(icons[c.id]||'•')}</div><div><h2 style="margin:0 0 4px">${esc(c.name)}</h2><div class="muted">${stats.total||0} questions${stats.weak?` · ${stats.weak} weak`:''}${stats.starred?` · ${stats.starred} starred`:''}</div></div></div>${sources.length>1?`<select class="new-source-filter" onchange="EPNew.setSource(this.value)"><option value="ALL">All Sources</option>${sources.map(s=>`<option value="${esc(s.name)}" ${s.name===currentSource?'selected':''}>${esc(s.name)} · ${s.total}</option>`).join('')}</select>`:''}${actionRow(c.id,c.name,stats.total,stats.weak,stats.newCount,stats.starred)}</div>`}
  function setSource(v){currentSource=String(v||'ALL');renderCategory()}
  function choose(id,kind,name,available){ensure();const labels={weak:'Weak',random:'Random',new:'Practice New',starred:'Starred'};$('newModeTitle').textContent=`${name} · ${labels[kind]||kind}`;$('newModeBody').innerHTML=`<div class="muted">Choose number of questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button onclick='EPNew.start(${JSON.stringify(id)},${JSON.stringify(kind)},${n},${JSON.stringify(name)})'>${n}</button>`).join('')}</div>${kind==='new'?'<div class="muted" style="margin-top:10px">Priority: newest unseen → other unseen → weak/recently attempted → other recently attempted.</div>':''}`;$('newModeSheet').classList.remove('hidden')}
  function closeSheet(){$('newModeSheet')?.classList.add('hidden')}
  async function start(id,kind,count,name){closeSheet();showLoad(`Loading ${name} Quiz…`);const opts={category:id,batchId:kind+(count?'-'+count:'')+'-'+currentSource,returnTab:'new'};if(EPQuiz.hasSavedSessionFor('new')){if(EPQuiz.isSameRequested('new',opts)){hideLoad();EPQuiz.resumeOther();return}if(!confirm('A paused new-content set exists. Replace it?')){hideLoad();return}EPQuiz.replaceSavedFor('new')}
    try{const qs=await EPApp.call('getNewPracticeBatchLive',id,kind,count||0,currentSource);hideLoad();if(!qs.length){EPApp.toast('No eligible questions in this selection.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');const label=kind==='new'?'Practice New':kind==='starred'?'Starred':kind;EPQuiz.start(qs,{mode:'new',category:id,batchId:opts.batchId,title:name+' · '+label,returnTab:'new'})}catch(e){hideLoad();EPApp.toast('Could not load New Practice: '+e.message)}}
  async function viewAll(id,name){const list=$('newPracticeList');list.innerHTML='<div class="list-card"><div class="muted">Preparing list…</div></div>';try{const items=await EPApp.call('getNewPracticeItemsLive',id,currentSource);renderItems(items,name)}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderItems(items,name){$('newPracticeList').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="${current?'EPNew.openCategory('+hub.categories.indexOf(current)+')':'EPNew.open()'}">← Back</button><h2 style="margin:14px 0 4px">${esc(name)} · View All</h2><div class="muted">${items.length} questions${currentSource!=='ALL'?` · ${esc(currentSource)}`:''}</div></div><div class="browse-list">${items.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.starred?'⭐ Starred · ':''}${x.weak?'Weak · ':''}${x.attempts?x.attempts+' attempts':'Unseen'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}
  function showLoad(t){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=t;v.classList.remove('hidden')}
  function hideLoad(){$('compactQuizLoading')?.classList.add('hidden')}
  function init(){if(typeof EPApp!=='undefined'){EPApp.openNewPractice=open;EPApp.startNewPractice=start}}
  document.addEventListener('DOMContentLoaded',init);
  return{open,openCategory,setSource,choose,closeSheet,start,viewAll};
})();
</script>
