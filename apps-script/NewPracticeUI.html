<script>
const EPNew=(()=>{
  let hub=null,current=null;
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function ensure(){if(!$('newModeSheet')){const w=document.createElement('div');w.id='newModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeSheet()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="newModeTitle">Choose questions</h3><div id="newModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPNew.closeSheet()">Cancel</button></div>';document.body.appendChild(w)}}
  function actionRow(id,name,total,weak){return `<div class="compact-actions four"><button class="btn soft mini" onclick='EPNew.viewAll(${JSON.stringify(id)},${JSON.stringify(name)})'>View All</button><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.start(${JSON.stringify(id)},"all",0,${JSON.stringify(name)})'>Practice All</button><button class="btn soft mini" ${weak?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"weak",${JSON.stringify(name)},${Number(weak||0)})'>Weak</button><button class="btn soft mini" ${total?'':'disabled'} onclick='EPNew.choose(${JSON.stringify(id)},"random",${JSON.stringify(name)},${Number(total||0)})'>Random</button></div>`}
  async function open(){ensure();EPApp.showTab('new');const list=$('newPracticeList'),cached=window.EPFast&&EPFast.get('new:hub');if(cached){hub=cached;render();return}list.innerHTML='<div class="list-card"><div class="muted">Preparing new practice…</div></div>';try{hub=await EPApp.call('getNewPracticeHub');if(window.EPFast)EPFast.set('new:hub',hub);render()}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function render(){if(!hub)return;const list=$('newPracticeList');$('newPracticeNote').textContent=`Recently added content · ${Number(hub.total||0)} unique questions`;list.innerHTML=`<div class="card"><div><b>All New Practice</b><div class="muted">${Number(hub.total||0)} questions${hub.weak?` · ${hub.weak} weak`:''}</div></div>${actionRow('ALL','All New Practice',hub.total,hub.weak)}</div><h3 class="section-title">Categories</h3>${hub.categories.length?hub.categories.map((c,i)=>`<div class="list-card" onclick="EPNew.openCategory(${i})"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${c.total} questions${c.weak?` · ${c.weak} weak`:''}</div></div><span>›</span></div></div>`).join(''):'<div class="empty card">No recently added content yet.</div>'}`}
  function openCategory(i){current=hub&&hub.categories&&hub.categories[i];if(!current)return;const c=current;$('newPracticeList').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPNew.open()">← Categories</button><h2 style="margin:14px 0 4px">${esc(c.name)}</h2><div class="muted">${c.total} questions${c.weak?` · ${c.weak} weak`:''}</div>${actionRow(c.id,c.name,c.total,c.weak)}</div>`;window.scrollTo({top:0,behavior:'smooth'})}
  function choose(id,kind,name,available){ensure();$('newModeTitle').textContent=`${name} · ${kind==='weak'?'Weak':'Random'}`;$('newModeBody').innerHTML=`<div class="muted">${available} available · choose questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button onclick='EPNew.start(${JSON.stringify(id)},${JSON.stringify(kind)},${n},${JSON.stringify(name)})'>${n}</button>`).join('')}</div>`;$('newModeSheet').classList.remove('hidden')}
  function closeSheet(){$('newModeSheet')?.classList.add('hidden')}
  async function start(id,kind,count,name){closeSheet();showLoad(`Loading ${name} Quiz…`);const opts={category:id,batchId:kind+(count?'-'+count:''),returnTab:'new'};if(EPQuiz.hasSavedSessionFor('new')){if(EPQuiz.isSameRequested('new',opts)){hideLoad();EPQuiz.resumeOther();return}if(!confirm('A paused new-content set exists. Replace it?')){hideLoad();return}EPQuiz.replaceSavedFor('new')}
    try{const qs=await EPApp.call('getNewPracticeBatch',id,kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible questions in this selection.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'new',category:id,batchId:opts.batchId,title:name+' · '+kind,returnTab:'new'})}catch(e){hideLoad();EPApp.toast('Could not load New Practice: '+e.message)}}
  async function viewAll(id,name){const key='new:items:'+id,cached=window.EPFast&&EPFast.get(key),list=$('newPracticeList');if(cached){renderItems(cached,name);return}list.innerHTML='<div class="list-card"><div class="muted">Preparing list…</div></div>';try{const items=await EPApp.call('getNewPracticeItems',id);if(window.EPFast)EPFast.set(key,items);renderItems(items,name)}catch(e){list.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderItems(items,name){$('newPracticeList').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPNew.open()">← New Practice</button><h2 style="margin:14px 0 4px">${esc(name)} · View All</h2><div class="muted">${items.length} questions</div></div><div class="browse-list">${items.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.weak?'Weak · ':''}${x.attempts?x.attempts+' attempts':'New'}${x.added?` · ${esc(x.added)}`:''}</div></div>`).join('')}</div>`}
  function showLoad(t){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=t;v.classList.remove('hidden')}
  function hideLoad(){$('compactQuizLoading')?.classList.add('hidden')}
  function init(){if(typeof EPApp!=='undefined'){EPApp.openNewPractice=open;EPApp.startNewPractice=start}}
  document.addEventListener('DOMContentLoaded',init);
  return{open,openCategory,choose,closeSheet,start,viewAll};
})();
</script>
