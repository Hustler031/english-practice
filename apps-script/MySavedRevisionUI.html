<script>
const EPMySavedRevision=(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let hub=null,pending=null;
  function ensure(){
    if(!$('mySavedRevisionView')){const s=document.createElement('section');s.id='mySavedRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision. Separate from Daily Practice.</p></div></div><div id="mySavedRevisionBody"></div>';document.getElementById('main')?.appendChild(s)}
    if(!$('mySavedRevisionPicker')){const w=document.createElement('div');w.id='mySavedRevisionPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="mySavedRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPMySavedRevision.runCount(10)">10</button><button onclick="EPMySavedRevision.runCount(20)">20</button><button onclick="EPMySavedRevision.runCount(50)">50</button><button onclick="EPMySavedRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPMySavedRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('mySavedRevisionStyles')){const st=document.createElement('style');st.id='mySavedRevisionStyles';st.textContent='.msr-summary,.msr-day{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:13px}.msr-summary{margin-bottom:13px}.msr-days{display:grid;gap:9px}.msr-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:11px}.msr-actions .btn{min-height:39px;font-size:11px;padding:6px 4px}.msr-meta{font-size:11px;color:var(--muted);margin-top:4px}.msr-browse{display:grid;gap:8px}.msr-item{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--card)}';document.head.appendChild(st)}
  }
  function show(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('mySavedRevisionView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function actions(scope,st){const j=JSON.stringify(scope),focus=Number(st.focus||0),nw=Number(st.newCount||0),weak=Number(st.weak||0),diff=Number(st.difficult||0),master=Number(st.mastered||0);return `<div class="msr-actions"><button class="btn soft mini" ${Number(st.saved||0)?'':'disabled'} onclick='EPMySavedRevision.view(${j},"all")'>View All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPMySavedRevision.start(${j},"all",0)'>Practice All</button><button class="btn soft mini" ${nw?'':'disabled'} onclick='EPMySavedRevision.pick(${j},"new")'>Practice New</button><button class="btn soft mini" ${weak?'':'disabled'} onclick='EPMySavedRevision.pick(${j},"weak")'>Weak</button><button class="btn soft mini" ${diff?'':'disabled'} onclick='EPMySavedRevision.start(${j},"difficult",0)'>Difficult</button><button class="btn soft mini" ${master?'':'disabled'} onclick='EPMySavedRevision.view(${j},"mastered")'>Mastered</button></div>`}
  function render(){const el=$('mySavedRevisionBody');if(!el||!hub)return;const all={fromDay:1,toDay:999999};el.innerHTML=`<div class="msr-summary"><b>All My Saved Words</b><div class="msr-meta">${Number(hub.stats.saved||0)} saved · ${Number(hub.stats.focus||0)} active · ${Number(hub.stats.difficult||0)} difficult</div>${actions(all,hub.stats)}</div><h3 class="section-title">Saved by Day</h3><div class="msr-days">${(hub.groups||[]).map(g=>`<div class="msr-day"><b>${esc(g.label)}</b><div class="msr-meta">${Number(g.stats.saved||0)} saved · ${Number(g.stats.weak||0)} weak · ${Number(g.stats.difficult||0)} difficult</div>${actions({fromDay:g.day,toDay:g.day},g.stats)}</div>`).join('')||'<div class="empty card">No enriched saved words are ready for practice yet.</div>'}</div>`}
  async function open(){ensure();show();const el=$('mySavedRevisionBody');if(el)el.innerHTML='<div class="list-card"><div class="muted">Preparing My Saved Words…</div></div>';try{hub=await EPApp.call('getMySavedRevisionHub');render()}catch(e){if(el)el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function back(){EPApp.showTab('revision')}
  function pick(scope,kind){pending={scope,kind};$('mySavedRevisionPickerTitle').textContent=kind==='new'?'Practice New Saved Words':'Weak Saved Words';$('mySavedRevisionPicker').classList.remove('hidden')}
  function closePicker(){$('mySavedRevisionPicker')?.classList.add('hidden');pending=null}
  function runCount(n){if(!pending)return;const p=pending;closePicker();start(p.scope,p.kind,n)}
  async function start(scope,kind,count){try{const qs=await EPApp.call('getMySavedRevisionBatch',scope,kind,count||0);if(!qs.length){EPApp.toast('No eligible saved words in this range.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'mySavedRevision',title:'My Saved Words',batchId:`saved-${scope.fromDay}-${scope.toDay}-${kind}-${count||0}`,returnTab:'revision'})}catch(e){EPApp.toast('Could not load My Saved Words: '+(e.message||e))}}
  async function view(scope,kind){const el=$('mySavedRevisionBody');if(el)el.innerHTML='<div class="list-card"><div class="muted">Preparing saved list…</div></div>';try{const rows=await EPApp.call('getMySavedRevisionItems',scope,kind);el.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPMySavedRevision.open()">← My Saved Words</button><h3>${kind==='mastered'?'Mastered Saved Words':'Saved Words'}</h3><div class="muted">${rows.length} questions</div></div><div class="msr-browse">${rows.map((x,i)=>`<div class="msr-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b><div class="muted">${esc(x.topic||'')} · ${esc(x.state||'')}</div></div>`).join('')}</div>`}catch(e){if(el)el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  document.addEventListener('DOMContentLoaded',ensure);return{open,back,pick,closePicker,runCount,start,view};
})();
</script>
