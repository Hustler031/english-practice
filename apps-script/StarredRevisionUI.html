<script>
const EPStarredRevision=(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let hub=null,pending=null;
  function ensure(){
    if(!$('starredRevisionView')){const s=document.createElement('section');s.id='starredRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPStarredRevision.back()">← Back</button><div><h2>⭐ Starred Revision</h2><p class="muted">Focused revision of questions you starred across every quiz.</p></div></div><div id="starredRevisionBody"></div>';document.getElementById('main')?.appendChild(s)}
    if(!$('starredRevisionPicker')){const w=document.createElement('div');w.id='starredRevisionPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="starredRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPStarredRevision.runCount(10)">10</button><button onclick="EPStarredRevision.runCount(20)">20</button><button onclick="EPStarredRevision.runCount(50)">50</button><button onclick="EPStarredRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPStarredRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('starredRevisionStyles')){const st=document.createElement('style');st.id='starredRevisionStyles';st.textContent='.sr-summary{padding:14px 15px;background:linear-gradient(135deg,color-mix(in srgb,var(--warnbg) 88%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--warn) 22%,var(--line));border-radius:17px}.sr-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12px}.sr-stats b{font-size:13px}.sr-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.sr-actions .btn{min-height:39px;padding:7px 4px;font-size:11px}.sr-group{margin-top:10px;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden}.sr-group-head{padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.sr-group-head .muted{font-size:11px}.sr-group-actions{padding:0 12px 12px}.sr-chevron{font-size:20px;color:var(--muted)}.sr-days{padding:0 10px 10px;display:grid;gap:7px}.sr-day{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}.sr-browse{display:grid;gap:8px;margin-top:10px}.sr-browse-item{padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card)}@media(max-width:380px){.sr-actions .btn{font-size:10px}}';document.head.appendChild(st)}
  }
  function show(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('starredRevisionView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function statsLine(st){return `<span><b>${Number(st?.starred||0)}</b> Starred</span><span><b>${Number(st?.mastered||0)}</b> Mastered</span><span><b>${Number(st?.focus||0)}</b> Focus</span>`}
  function actionGrid(scope,st){const focus=Number(st?.focus||0),mastered=Number(st?.mastered||0),json=JSON.stringify(scope);return `<div class="sr-actions"><button class="btn soft mini" ${focus||mastered?'':'disabled'} onclick='EPStarredRevision.view(${json},"all")'>View All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPStarredRevision.start(${json},"all",0)'>Practice All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPStarredRevision.pick(${json},"new")'>Practice New</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPStarredRevision.pick(${json},"weak")'>Weak</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='EPStarredRevision.pick(${json},"random")'>Random</button><button class="btn soft mini" ${mastered?'':'disabled'} onclick='EPStarredRevision.view(${json},"mastered")'>Mastered</button></div>`}
  function render(){const body=$('starredRevisionBody');if(!body||!hub)return;const allScope={fromDay:1,toDay:999999};body.innerHTML=`<div class="sr-summary"><b>All Starred Revision</b><div class="sr-stats">${statsLine(hub.stats)}</div>${actionGrid(allScope,hub.stats)}</div><h3 class="section-title">Day-wise Focus</h3>${hub.groups.length?hub.groups.map(groupCard).join(''):'<div class="empty card">No starred questions yet. Star a difficult question in any quiz and it will appear here.</div>'}`}
  function groupCard(g){const scope={fromDay:g.fromDay,toDay:g.toDay},expand=g.type!=='day';return `<section class="sr-group"><div class="sr-group-head" ${expand?`onclick='EPStarredRevision.toggleGroup(this,${JSON.stringify(scope)})'`:''}><div><b>${esc(g.label)}</b><div class="muted">${statsLine(g.stats)}</div></div>${expand?'<span class="sr-chevron">›</span>':''}</div><div class="sr-group-actions">${actionGrid(scope,g.stats)}</div>${expand?'<div class="sr-days hidden"></div>':''}</section>`}
  async function open(){ensure();show();const body=$('starredRevisionBody');if(body)body.innerHTML='<div class="list-card"><div class="muted">Preparing starred revision…</div></div>';try{hub=await EPApp.call('getStarredRevisionHub');render()}catch(e){if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function back(){$('starredRevisionView')?.classList.add('hidden');EPApp.showTab('home')}
  async function toggleGroup(head,scope){const wrap=head.parentElement?.querySelector('.sr-days'),chev=head.querySelector('.sr-chevron');if(!wrap)return;if(!wrap.classList.contains('hidden')){wrap.classList.add('hidden');if(chev)chev.textContent='›';return}wrap.classList.remove('hidden');if(chev)chev.textContent='⌄';if(wrap.dataset.loaded)return;wrap.innerHTML='<div class="muted" style="padding:8px">Loading days…</div>';try{const r=await EPApp.call('getStarredRevisionGroup',scope.fromDay,scope.toDay);wrap.dataset.loaded='1';wrap.innerHTML=r.days.map(d=>`<div class="sr-day"><b>${esc(d.label)}</b><div class="sr-stats">${statsLine(d.stats)}</div>${actionGrid({fromDay:d.fromDay,toDay:d.toDay},d.stats)}</div>`).join('')||'<div class="muted" style="padding:8px">No starred questions in this range.</div>'}catch(e){wrap.innerHTML=`<div class="muted" style="padding:8px">${esc(e.message||e)}</div>`}}
  function pick(scope,kind){pending={scope,kind};$('starredRevisionPickerTitle').textContent=kind==='new'?'Practice New Starred':kind==='weak'?'Weak Starred':'Random Starred';$('starredRevisionPicker').classList.remove('hidden')}
  function closePicker(){$('starredRevisionPicker')?.classList.add('hidden');pending=null}
  function runCount(n){if(!pending)return;const p=pending;closePicker();start(p.scope,p.kind,n)}
  async function start(scope,kind,count){showLoad();try{const qs=await EPApp.call('getStarredRevisionBatch',scope,kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible starred questions in this range.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'starredRevision',title:'Starred Revision',batchId:`${scope.fromDay}-${scope.toDay}-${kind}-${count||0}`,returnTab:'home'})}catch(e){hideLoad();EPApp.toast('Could not load Starred Revision: '+e.message)}}
  async function view(scope,kind){const body=$('starredRevisionBody');if(body)body.innerHTML='<div class="list-card"><div class="muted">Preparing starred list…</div></div>';try{const rows=await EPApp.call('getStarredRevisionItems',scope,kind);body.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPStarredRevision.open()">← Starred Revision</button><h3 style="margin:14px 0 4px">${kind==='mastered'?'Mastered from Starred':'Starred Questions'}</h3><div class="muted">${rows.length} questions</div></div><div class="sr-browse">${rows.map((x,i)=>`<div class="sr-browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">Day ${x.day}${x.mastered?' · Mastered':x.weak?' · Weak':' · Focus'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}catch(e){if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function showLoad(){let v=$('starredRevisionLoading');if(!v){v=document.createElement('div');v.id='starredRevisionLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:epLoadSpin .75s linear infinite"></div><b>Loading Starred Revision…</b></div>';document.body.appendChild(v)}v.classList.remove('hidden')}
  function hideLoad(){$('starredRevisionLoading')?.classList.add('hidden')}
  document.addEventListener('DOMContentLoaded',ensure);
  return{open,back,toggleGroup,pick,closePicker,runCount,start,view};
})();
</script>
