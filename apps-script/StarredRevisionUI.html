<script>
const EPStarredRevision=(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
  const CACHE_KEY='starred:hub',DIFF_CACHE_KEY='starred:difficult:v1';
  let hub=null,pending=null,lastRefresh=0,refreshing=false,difficultQuiz=false,difficultMap={},masteredHere={};
  function ensure(){
    if(!$('starredRevisionView')){const s=document.createElement('section');s.id='starredRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPStarredRevision.back()">← Back</button><div><h2>⭐ Starred Revision</h2><p class="muted">Focused revision of questions you starred across every quiz.</p></div></div><div id="starredRevisionBody"></div>';document.getElementById('main')?.appendChild(s)}
    if(!$('starredRevisionPicker')){const w=document.createElement('div');w.id='starredRevisionPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="starredRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPStarredRevision.runCount(10)">10</button><button onclick="EPStarredRevision.runCount(20)">20</button><button onclick="EPStarredRevision.runCount(50)">50</button><button onclick="EPStarredRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPStarredRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('starredDifficultBtn')){const capture=$('wordCaptureBtn')||$('markBtn');if(capture){const b=document.createElement('button');b.id='starredDifficultBtn';b.className='btn ghost hidden';b.textContent='⚡ Difficult';b.onclick=toggleDifficult;capture.insertAdjacentElement('afterend',b)}}
    if(!$('starredMasteredWrap')){const ex=$('explanation');if(ex){const w=document.createElement('div');w.id='starredMasteredWrap';w.className='sr-mastered-wrap hidden';w.innerHTML='<button id="starredMasteredMini" class="sr-mastered-mini" type="button" aria-label="Mark as mastered">✓</button><div id="starredMasteredConfirm" class="sr-mastered-confirm hidden"><span>Sure?</span><button id="starredMasteredCancel" class="btn ghost mini" type="button">Cancel</button><button id="starredMasteredYes" class="btn soft mini" type="button">✓</button></div>';ex.insertAdjacentElement('afterend',w);$('starredMasteredMini').onclick=askMastered;$('starredMasteredCancel').onclick=cancelMastered;$('starredMasteredYes').onclick=confirmMastered}}
    if(!$('starredRevisionStyles')){const st=document.createElement('style');st.id='starredRevisionStyles';st.textContent='.sr-summary{padding:14px 15px;background:linear-gradient(135deg,color-mix(in srgb,var(--warnbg) 88%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--warn) 22%,var(--line));border-radius:17px}.sr-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12px}.sr-stats b{font-size:13px}.sr-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.sr-actions .btn{min-height:39px;padding:7px 4px;font-size:11px}.sr-group{margin-top:9px;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden}.sr-group-head{padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer}.sr-group-head:active{background:color-mix(in srgb,var(--primary) 5%,var(--card))}.sr-group-head .muted{font-size:11px}.sr-group-panel{padding:0 12px 12px;border-top:1px solid var(--line)}.sr-group-panel .sr-actions{margin-top:10px}.sr-chevron{font-size:20px;color:var(--muted);transition:transform .15s ease}.sr-days{padding-top:10px;display:grid;gap:7px}.sr-day{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}.sr-day-head{padding:10px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer}.sr-day-panel{padding:0 10px 10px;border-top:1px solid var(--line)}.sr-day-panel .sr-actions{margin-top:9px}.sr-browse{display:grid;gap:8px;margin-top:10px}.sr-browse-item{padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card)}.sr-mastered-wrap{display:flex;align-items:center;gap:6px;margin:8px 0 2px;min-height:29px}.sr-mastered-wrap.hidden{display:none}.sr-mastered-mini{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font-weight:900;font-size:14px;cursor:pointer}.sr-mastered-mini:active{transform:scale(.96)}.sr-mastered-confirm{display:flex;align-items:center;gap:5px;padding:3px 5px;border:1px solid var(--line);border-radius:9px;background:var(--card)}.sr-mastered-confirm.hidden{display:none}.sr-mastered-confirm span{font-size:11px;font-weight:800;color:var(--muted);padding:0 2px}.sr-mastered-confirm .btn{min-height:25px;padding:2px 7px;font-size:10px;border-radius:7px}@media(max-width:380px){.sr-actions .btn{font-size:10px}}';document.head.appendChild(st)}
  }
  function show(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('starredRevisionView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function statsLine(st){return `<span><b>${Number(st?.starred||0)}</b> Starred</span><span><b>${Number(st?.mastered||0)}</b> Mastered</span><span><b>${Number(st?.focus||0)}</b> Focus</span>`}
  function actionGrid(scope,st){const focus=Number(st?.focus||0),mastered=Number(st?.mastered||0),difficult=Number(st?.difficult||0),json=JSON.stringify(scope);return `<div class="sr-actions"><button class="btn soft mini" ${focus||mastered?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.view(${json},"all")'>View All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.start(${json},"all",0)'>Practice All</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.pick(${json},"new")'>Practice New</button><button class="btn soft mini" ${focus?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.pick(${json},"weak")'>Weak</button><button class="btn soft mini" ${difficult?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.start(${json},"difficult",0)'>Difficult</button><button class="btn soft mini" ${mastered?'':'disabled'} onclick='event.stopPropagation();EPStarredRevision.view(${json},"mastered")'>Mastered</button></div>`}
  async function refreshSilent(force){if(refreshing||(!force&&Date.now()-lastRefresh<60000))return;refreshing=true;try{const fresh=await EPApp.call('getStarredRevisionHub');lastRefresh=Date.now();if(fresh){hub=fresh;if(window.EPFast)EPFast.set(CACHE_KEY,fresh);const view=$('starredRevisionView'),body=$('starredRevisionBody');if(view&&!view.classList.contains('hidden')&&body?.querySelector('.sr-summary'))render()}}catch(e){}finally{refreshing=false}}
  function render(){const body=$('starredRevisionBody');if(!body||!hub)return;const allScope={fromDay:1,toDay:999999};body.innerHTML=`<div class="sr-summary"><b>All Starred Revision</b><div class="sr-stats">${statsLine(hub.stats)}</div>${actionGrid(allScope,hub.stats)}</div><h3 class="section-title">Day-wise Focus</h3>${hub.groups.length?hub.groups.map(groupCard).join(''):'<div class="empty card">No starred questions yet. Star a difficult question in any quiz and it will appear here.</div>'}`}
  function groupCard(g){const scope={fromDay:g.fromDay,toDay:g.toDay},isDay=g.type==='day';return `<section class="sr-group"><div class="sr-group-head" onclick='EPStarredRevision.toggleGroup(this,${JSON.stringify(scope)},${isDay?'true':'false'})'><div><b>${esc(g.label)}</b><div class="muted"><span class="sr-stats">${statsLine(g.stats)}</span></div></div><span class="sr-chevron">›</span></div><div class="sr-group-panel hidden">${actionGrid(scope,g.stats)}${isDay?'':'<div class="sr-days"></div>'}</div></section>`}
  async function open(){ensure();show();const body=$('starredRevisionBody'),cached=(window.EPFast&&EPFast.get(CACHE_KEY))||hub;if(cached){hub=cached;render();refreshSilent(false);return}if(body)body.innerHTML='<div class="list-card"><div class="muted">Preparing starred revision…</div></div>';try{hub=await EPApp.call('getStarredRevisionHub');lastRefresh=Date.now();if(window.EPFast)EPFast.set(CACHE_KEY,hub);render()}catch(e){if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function back(){$('starredRevisionView')?.classList.add('hidden');EPApp.showTab('home')}
  async function toggleGroup(head,scope,isDay){const panel=head.parentElement?.querySelector('.sr-group-panel'),chev=head.querySelector('.sr-chevron');if(!panel)return;if(!panel.classList.contains('hidden')){panel.classList.add('hidden');if(chev)chev.textContent='›';return}panel.classList.remove('hidden');if(chev)chev.textContent='⌄';if(isDay)return;const wrap=panel.querySelector('.sr-days');if(!wrap||wrap.dataset.loaded)return;wrap.innerHTML='<div class="muted" style="padding:8px 0">Loading days…</div>';try{const r=await EPApp.call('getStarredRevisionGroup',scope.fromDay,scope.toDay);wrap.dataset.loaded='1';wrap.innerHTML=r.days.map(d=>`<div class="sr-day"><div class="sr-day-head" onclick="EPStarredRevision.toggleDay(this)"><div><b>${esc(d.label)}</b><div class="sr-stats">${statsLine(d.stats)}</div></div><span class="sr-chevron">›</span></div><div class="sr-day-panel hidden">${actionGrid({fromDay:d.fromDay,toDay:d.toDay},d.stats)}</div></div>`).join('')||'<div class="muted" style="padding:8px 0">No starred questions in this range.</div>'}catch(e){wrap.innerHTML=`<div class="muted" style="padding:8px 0">${esc(e.message||e)}</div>`}}
  function toggleDay(head){const panel=head.parentElement?.querySelector('.sr-day-panel'),chev=head.querySelector('.sr-chevron');if(!panel)return;const opening=panel.classList.contains('hidden');panel.classList.toggle('hidden',!opening);if(chev)chev.textContent=opening?'⌄':'›'}
  function pick(scope,kind){pending={scope,kind};$('starredRevisionPickerTitle').textContent=kind==='new'?'Practice New Starred':kind==='weak'?'Weak Starred':'Random Starred';$('starredRevisionPicker').classList.remove('hidden')}
  function closePicker(){$('starredRevisionPicker')?.classList.add('hidden');pending=null}
  function runCount(n){if(!pending)return;const p=pending;closePicker();start(p.scope,p.kind,n)}
  async function start(scope,kind,count){showLoad();try{const qs=await EPApp.call('getStarredRevisionBatch',scope,kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible starred questions in this range.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'starredRevision',title:'Starred Revision',batchId:`${scope.fromDay}-${scope.toDay}-${kind}-${count||0}`,returnTab:'home'})}catch(e){hideLoad();EPApp.toast('Could not load Starred Revision: '+e.message)}}
  async function view(scope,kind){const body=$('starredRevisionBody');if(body)body.innerHTML='<div class="list-card"><div class="muted">Preparing starred list…</div></div>';try{const rows=await EPApp.call('getStarredRevisionItems',scope,kind);body.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPStarredRevision.open()">← Starred Revision</button><h3 style="margin:14px 0 4px">${kind==='mastered'?'Mastered from Starred':'Starred Questions'}</h3><div class="muted">${rows.length} questions</div></div><div class="sr-browse">${rows.map((x,i)=>`<div class="sr-browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">Day ${x.day}${x.mastered?' · Mastered':x.weak?' · Weak':' · Focus'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}catch(e){if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function loadDiffCache(){try{return JSON.parse(localStorage.getItem(DIFF_CACHE_KEY)||'{}')||{}}catch(e){return {}}}
  function saveDiffCache(map){try{localStorage.setItem(DIFF_CACHE_KEY,JSON.stringify(map||{}))}catch(e){}}
  function setDifficultQuizContext(questions,active){
    difficultQuiz=!!active;difficultMap={};masteredHere={};
    if(difficultQuiz){const local=loadDiffCache();(questions||[]).forEach(q=>{const id=String(q?.id||'').trim();if(!id)return;difficultMap[id]=Object.prototype.hasOwnProperty.call(local,id)?!!local[id]:!!q.difficult;});}
    syncDifficultButton();
  }
  function restoreDifficultQuizContext(){
    try{const s=JSON.parse(localStorage.getItem('ep-quiz-other-v4')||'null');if(s&&s.meta&&s.meta.mode==='starredRevision'&&Array.isArray(s.questions)){setDifficultQuizContext(s.questions,true);return}}catch(e){}
    setDifficultQuizContext([],false);
  }
  function syncDifficultButton(){
    ensure();const b=$('starredDifficultBtn'),master=$('masteredBtn'),wrap=$('starredMasteredWrap'),mini=$('starredMasteredMini'),confirm=$('starredMasteredConfirm');
    if(b)b.classList.toggle('hidden',!difficultQuiz);
    if(!difficultQuiz){if(wrap)wrap.classList.add('hidden');if(confirm)confirm.classList.add('hidden');return}
    if(master)master.classList.add('hidden');
    const id=String($('qId')?.textContent||'').trim(),on=!!difficultMap[id],answered=!!$('explanation')&&!$('explanation').classList.contains('hidden'),done=!!masteredHere[id];
    if(b){b.textContent=on?'⚡ Difficult ✓':'⚡ Difficult';b.classList.toggle('state-marked',on)}
    if(wrap)wrap.classList.toggle('hidden',!answered||done);
    if(mini)mini.classList.toggle('hidden',!answered||done||!(confirm?.classList.contains('hidden')));
    if(confirm&&(!answered||done))confirm.classList.add('hidden');
  }
  function toggleDifficult(){
    if(!difficultQuiz)return;const id=String($('qId')?.textContent||'').trim();if(!id)return;
    const before=!!difficultMap[id],after=!before,local=loadDiffCache(),had=Object.prototype.hasOwnProperty.call(local,id),old=local[id];
    difficultMap[id]=after;local[id]=after;saveDiffCache(local);syncDifficultButton();
    EPApp.call('setStarredRevisionDifficult',id,after).then(r=>{if(!r||!r.ok)throw new Error('Not an active starred question');refreshSilent(true)}).catch(e=>{difficultMap[id]=before;if(had)local[id]=old;else delete local[id];saveDiffCache(local);syncDifficultButton();EPApp.toast('Could not update Difficult: '+(e.message||e))});
  }
  function askMastered(){if(!difficultQuiz)return;const id=String($('qId')?.textContent||'').trim();if(!id||masteredHere[id])return;const mini=$('starredMasteredMini'),confirm=$('starredMasteredConfirm');if(mini)mini.classList.add('hidden');if(confirm)confirm.classList.remove('hidden')}
  function cancelMastered(){const confirm=$('starredMasteredConfirm');if(confirm)confirm.classList.add('hidden');syncDifficultButton()}
  function confirmMastered(){
    if(!difficultQuiz)return;const id=String($('qId')?.textContent||'').trim();if(!id||masteredHere[id])return;const yes=$('starredMasteredYes');if(yes)yes.disabled=true;
    EPApp.call('markMastered',id).then(()=>{masteredHere[id]=true;if(yes)yes.disabled=false;$('starredMasteredConfirm')?.classList.add('hidden');syncDifficultButton();refreshSilent(true);EPApp.toast('Removed')}).catch(e=>{if(yes)yes.disabled=false;cancelMastered();EPApp.toast('Could not remove: '+(e.message||e))});
  }
  function ensureSpin(){if($('epLoadSpinStyle'))return;const st=document.createElement('style');st.id='epLoadSpinStyle';st.textContent='@keyframes epLoadSpin{to{transform:rotate(360deg)}}';document.head.appendChild(st)}
  function showLoad(){ensureSpin();let v=$('starredRevisionLoading');if(!v){v=document.createElement('div');v.id='starredRevisionLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:epLoadSpin .75s linear infinite"></div><b>Loading Starred Revision…</b></div>';document.body.appendChild(v)}v.classList.remove('hidden')}
  function hideLoad(){$('starredRevisionLoading')?.classList.add('hidden')}
  function prefetch(){if((window.EPFast&&EPFast.get(CACHE_KEY))||hub)return;refreshSilent(true)}
  document.addEventListener('DOMContentLoaded',()=>{ensure();const q=$('qId'),ex=$('explanation');if(q)new MutationObserver(syncDifficultButton).observe(q,{childList:true,subtree:true});if(ex)new MutationObserver(syncDifficultButton).observe(ex,{attributes:true,attributeFilter:['class']});setTimeout(prefetch,2200)});
  return{open,back,toggleGroup,toggleDay,pick,closePicker,runCount,start,view,refreshSilent,setDifficultQuizContext,restoreDifficultQuizContext,syncDifficultButton};
})();
</script>
<script>
(()=>{
  if(typeof EPQuiz==='undefined'||EPQuiz.__starredRevisionWrapped)return;
  const originalToggleMark=EPQuiz.toggleMark,originalStart=EPQuiz.start,originalResumeOther=EPQuiz.resumeOther;
  EPQuiz.toggleMark=function(){
    const id=String(document.getElementById('qId')?.textContent||'').trim();
    originalToggleMark.apply(EPQuiz,arguments);
    const expected=!!document.getElementById('markBtn')?.classList.contains('state-marked');
    if(id)setTimeout(()=>{
      const current=!!document.getElementById('markBtn')?.classList.contains('state-marked');
      if(current!==expected)return;
      if(typeof EPApp!=='undefined'&&EPApp.call)EPApp.call('logStarredRevisionFromUi',id,expected).then(()=>EPStarredRevision.refreshSilent(true)).catch(()=>{});
    },900);
  };
  EPQuiz.start=function(questions,meta){EPStarredRevision.setDifficultQuizContext(questions,!!(meta&&meta.mode==='starredRevision'));return originalStart.apply(EPQuiz,arguments)};
  EPQuiz.resumeOther=function(){EPStarredRevision.restoreDifficultQuizContext();return originalResumeOther.apply(EPQuiz,arguments)};
  EPQuiz.__starredRevisionWrapped=true;
})();
</script>
