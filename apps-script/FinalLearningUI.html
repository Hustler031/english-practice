<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let currentMode='',currentTitle='',activeMs=0,visibleAt=0,timerQ='';
  const difficultModes=new Set(['starredRevision','mySavedRevision','bankCoverage','difficult']);

  function stopTimer(){if(visibleAt){activeMs+=Math.max(0,Date.now()-visibleAt);visibleAt=0}}
  function resetTimer(){activeMs=0;timerQ=String($('qId')?.textContent||'').trim();visibleAt=document.hidden?0:Date.now()}
  function activeSeconds(){const ms=activeMs+(visibleAt?Math.max(0,Date.now()-visibleAt):0);return Math.min(600,Math.max(0,ms/1000))}
  function applyTitle(){if(currentTitle&&$('quizMode'))$('quizMode').textContent=currentTitle}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimer();else if($('quizView')&&!$('quizView').classList.contains('hidden'))visibleAt=Date.now()});

  if(typeof EPApp!=='undefined'&&EPApp.call&&!EPApp.__finalLearningCallWired){
    EPApp.__finalLearningCallWired=true;const raw=EPApp.call.bind(EPApp);
    EPApp.call=function(fn,...args){
      const original=fn;let mapped=fn;
      if(fn==='getBootstrapV2')mapped='getBootstrapV3';
      else if(fn==='getDailyBatchV2')mapped='getDailyBatchV3';
      else if(fn==='getEncounterProgress')mapped='getLearningProgressSnapshot';
      else if(fn==='submitAnswer')mapped='submitAnswerV2';
      else if(fn==='setMarked')mapped='setMarkedV2';
      else if(fn==='setHinduMarked')mapped='setHinduMarkedV2';
      else if(fn==='markMastered')mapped='markMasteredV2';
      else if(fn==='setStarredRevisionDifficult')mapped='setCentralDifficult';
      if(original==='submitAnswer'&&args[0]){args[0]=Object.assign({},args[0],{module:currentMode||'practice',timeSeconds:activeSeconds(),attemptId:String(args[0].attemptId||'')||String(args[0].questionId||'Q')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)});}
      const p=raw(mapped,...args);if(original==='getBootstrapV2'&&p&&typeof p.then==='function')return p.then(r=>{window.EPLearningBootstrap=r;setTimeout(syncAdaptiveNote,0);return r});return p;
    };
  }

  if(typeof EPQuiz!=='undefined'&&!EPQuiz.__finalLearningWired){
    EPQuiz.__finalLearningWired=true;const priorStart=EPQuiz.start,priorResumeOther=EPQuiz.resumeOther,priorResumeDaily=EPQuiz.resumeDaily,priorResumeHindu=EPQuiz.resumeHindu;
    EPQuiz.start=function(questions,meta){currentMode=String(meta?.mode||'practice');currentTitle=String(meta?.title||titleForMode(currentMode));const r=priorStart.apply(EPQuiz,arguments);resetTimer();applyTitle();if(difficultModes.has(currentMode)&&window.EPStarredRevision)EPStarredRevision.setDifficultQuizContext(questions,true);return r};
    EPQuiz.resumeOther=function(){let s=null;try{s=JSON.parse(localStorage.getItem('ep-quiz-other-v4')||'null')}catch(e){}currentMode=String(s?.meta?.mode||'practice');currentTitle=String(s?.meta?.title||titleForMode(currentMode));const r=priorResumeOther.apply(EPQuiz,arguments);resetTimer();applyTitle();if(difficultModes.has(currentMode)&&window.EPStarredRevision)EPStarredRevision.setDifficultQuizContext(s?.questions||[],true);return r};
    EPQuiz.resumeDaily=function(){currentMode='daily';currentTitle='Daily Practice';const r=priorResumeDaily.apply(EPQuiz,arguments);resetTimer();return r};
    EPQuiz.resumeHindu=function(){currentMode='hindu';currentTitle='The Hindu – Today';const r=priorResumeHindu.apply(EPQuiz,arguments);resetTimer();return r};
    EPQuiz.mastered=function(){const id=String($('qId')?.textContent||'').trim();if(!id)return;if(!confirm('Mark Mastered only after spaced retention is proven?'))return;EPApp.call('markMasteredV2',id).then(()=>{EPApp.toast('✓ Mastered');EPQuiz.next()}).catch(e=>EPApp.toast(e.message||'Retention not proven yet'))};
  }
  function titleForMode(m){return {daily:'Daily Practice',bankCoverage:'Bank Coverage',mySavedRevision:'My Saved Words',difficult:'Difficult Revision',starredRevision:'Starred Revision'}[m]||''}
  function syncAdaptiveNote(){const b=window.EPLearningBootstrap,di=b?.dailyInfo,n=$('dailyNote');if(!n||!di?.adaptive)return;n.textContent=`Adaptive mix: ${Number(di.persistentWeakCount||0)} persistent weak · ${Number(di.weakCount||0)} weak · ${Number(di.fragileCount||0)} fragile · ${Number(di.dueCount||0)} due · ${Number(di.freshCount||0)} controlled new.`}

  function ensureStyles(){if($('finalLearningStyles'))return;const st=document.createElement('style');st.id='finalLearningStyles';st.textContent='.learning-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.learning-stat{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:10px 7px;text-align:center}.learning-stat span{display:block;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase}.learning-stat b{display:block;font-size:16px;margin-top:3px}.bank-row,.msr-day{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:13px;margin-top:9px}.bank-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:8px}.mini-meter{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.mini-meter i{display:block;height:100%;background:var(--ok)}.msr-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.msr-actions .btn{font-size:10px;min-height:38px;padding:6px 3px}.learning-category{border:1px solid var(--line);border-radius:15px;padding:12px;background:var(--card);margin-top:8px}.learning-category .metrics{font-size:10px;color:var(--muted);line-height:1.55;margin-top:6px}.progress-overview.learning-v2{grid-template-columns:repeat(3,1fr)!important}.learning-after{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}@media(max-width:380px){.learning-summary{gap:4px}.learning-stat{padding:8px 4px}.learning-stat b{font-size:14px}}';document.head.appendChild(st)}

  const Bank=(()=>{
    function ensure(){if($('bankCoverageView'))return;const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverage.back()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional first-pass exposure. Up to 10 genuinely unseen questions per category each day.</p></div></div><div id="bankCoverageBody"></div>';$('main')?.appendChild(s)}
    function injectHome(){if($('bankCoverageQuick'))return;const target=[...document.querySelectorAll('#homeView .quick-btn')].find(b=>(b.textContent||'').includes('New Practice'));if(!target)return;const b=document.createElement('button');b.id='bankCoverageQuick';b.className='btn ghost quick-btn';b.innerHTML='<span>◫</span><span><b>Bank Coverage</b><small>Optional unseen-bank exposure</small></span>';b.onclick=open;target.insertAdjacentElement('afterend',b)}
    function show(){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('bankCoverageView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
    async function open(){show();const body=$('bankCoverageBody');body.innerHTML='<div class="list-card"><div class="muted">Checking unseen bank…</div></div>';try{render(await EPApp.call('getBankCoverageHub'))}catch(e){body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
    function render(h){const body=$('bankCoverageBody');body.innerHTML=`<div class="card"><div class="row between"><b>BANK EXPOSED</b><strong>${Number(h.coverage||0).toFixed(1)}%</strong></div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(h.coverage||0))}%"></i></div><div class="muted" style="margin-top:7px">${h.exposed} / ${h.total} unique questions exposed${h.complete?' · BANK FULLY EXPOSED ✅':''}</div></div>${(h.categories||[]).map(c=>`<div class="bank-row"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${c.exposed} / ${c.total} exposed · ${Number(c.coverage||0).toFixed(1)}% coverage</div></div><span class="tag">${c.complete?'DONE':c.available+' new'}</span></div><div class="bank-actions"><button class="btn soft mini" ${c.available?'':'disabled'} onclick='EPBankCoverage.start(${JSON.stringify(c.id)},${JSON.stringify(c.name)},${JSON.stringify(h.date)})'>${c.complete?'Fully Exposed':'Start '+c.available}</button><div class="mini-meter"><i style="width:${Math.min(100,Number(c.coverage||0))}%"></i></div></div></div>`).join('')}`}
    async function start(cat,name,date){const opts={category:cat,batchId:`${date}-${cat}`};if(EPQuiz.hasSavedSessionFor('bankCoverage')){if(EPQuiz.isSameRequested('bankCoverage',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start Bank Coverage and replace it?'))return;EPQuiz.replaceSavedFor('bankCoverage')}try{const qs=await EPApp.call('getBankCoverageBatch',cat);if(!qs.length){EPApp.toast('No unseen Bank Coverage questions available now.');open();return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'bankCoverage',category:cat,batchId:`${date}-${cat}`,title:`Bank Coverage · ${name}`,returnTab:'home'})}catch(e){EPApp.toast('Could not load Bank Coverage: '+(e.message||e))}}
    function back(){$('bankCoverageView')?.classList.add('hidden');EPApp.showTab('home')}
    return {open,start,back,injectHome};
  })();window.EPBankCoverage=Bank;

  const MySaved=(()=>{
    let hub=null,pending=null;
    function ensure(){if(!$('mySavedRevisionView')){const s=document.createElement('section');s.id='mySavedRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision, organised by the day you saved each item.</p></div></div><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost mini" onclick="EPMyWordsUX.open()">Manage Saved Words</button></div><div id="mySavedRevisionBody"></div>';$('main')?.appendChild(s)}if(!$('mySavedRevisionPicker')){const w=document.createElement('div');w.id='mySavedRevisionPicker';w.className='sheet-backdrop hidden';w.innerHTML='<div class="sheet"><h3 id="mySavedRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPMySavedRevision.runCount(10)">10</button><button onclick="EPMySavedRevision.runCount(20)">20</button><button onclick="EPMySavedRevision.runCount(50)">50</button><button onclick="EPMySavedRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPMySavedRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}}
    function injectRevision(){const card=[...document.querySelectorAll('#revisionView .list-card')].find(x=>(x.textContent||'').includes('My Saved'));if(card){card.onclick=open;card.innerHTML='<b>🔖 My Saved Words</b><div class="muted">Day-wise personal revision · central Starred + Difficult</div>'}if(typeof EPApp!=='undefined')EPApp.openSaved=open}
    function show(){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('mySavedRevisionView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
    async function open(){show();const body=$('mySavedRevisionBody');body.innerHTML='<div class="list-card"><div class="muted">Preparing saved-word revision…</div></div>';try{hub=await EPApp.call('getMySavedRevisionHub');render()}catch(e){body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
    function stats(st){return `${Number(st?.focus||0)} active · ${Number(st?.newCount||0)} new · ${Number(st?.weak||0)} weak · ${Number(st?.difficult||0)} difficult`}
    function actions(scope,st){const j=JSON.stringify(scope);return `<div class="msr-actions"><button class="btn soft mini" ${st.saved?'':'disabled'} onclick='EPMySavedRevision.view(${j},"all")'>View All</button><button class="btn soft mini" ${st.focus?'':'disabled'} onclick='EPMySavedRevision.start(${j},"all",0)'>Practice All</button><button class="btn soft mini" ${st.newCount?'':'disabled'} onclick='EPMySavedRevision.pick(${j},"new")'>Practice New</button><button class="btn soft mini" ${st.weak?'':'disabled'} onclick='EPMySavedRevision.pick(${j},"weak")'>Weak</button><button class="btn soft mini" ${st.difficult?'':'disabled'} onclick='EPMySavedRevision.start(${j},"difficult",0)'>Difficult</button><button class="btn soft mini" ${st.mastered?'':'disabled'} onclick='EPMySavedRevision.view(${j},"mastered")'>Mastered</button></div>`}
    function render(){const body=$('mySavedRevisionBody'),all={fromDay:1,toDay:999999};body.innerHTML=`<div class="card"><b>All My Saved Words</b><div class="muted" style="margin-top:4px">${stats(hub.stats)}</div>${actions(all,hub.stats)}</div><h3 class="section-title">Day-wise</h3>${(hub.days||[]).map(d=>`<div class="msr-day"><b>${esc(d.label)}</b><div class="muted">${stats(d.stats)}</div>${actions({fromDay:d.day,toDay:d.day},d.stats)}</div>`).join('')||'<div class="empty card">No enriched saved words are in practice yet.</div>'}`}
    function pick(scope,kind){pending={scope,kind};$('mySavedRevisionPickerTitle').textContent=kind==='new'?'Practice New Saved Words':'Weak Saved Words';$('mySavedRevisionPicker').classList.remove('hidden')}
    function closePicker(){$('mySavedRevisionPicker')?.classList.add('hidden');pending=null}
    function runCount(n){if(!pending)return;const p=pending;closePicker();start(p.scope,p.kind,n)}
    async function start(scope,kind,count){const opts={batchId:`${scope.fromDay}-${scope.toDay}-${kind}-${count||0}`};if(EPQuiz.hasSavedSessionFor('mySavedRevision')){if(EPQuiz.isSameRequested('mySavedRevision',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start this My Saved set and replace it?'))return;EPQuiz.replaceSavedFor('mySavedRevision')}try{const qs=await EPApp.call('getMySavedRevisionBatch',scope,kind,count||0);if(!qs.length){EPApp.toast('No eligible saved-word questions in this range.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'mySavedRevision',batchId:opts.batchId,title:'My Saved Words',returnTab:'revision'})}catch(e){EPApp.toast('Could not load My Saved Words: '+(e.message||e))}}
    async function view(scope,kind){const body=$('mySavedRevisionBody');body.innerHTML='<div class="list-card"><div class="muted">Preparing list…</div></div>';try{const rows=await EPApp.call('getMySavedRevisionItems',scope,kind);body.innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPMySavedRevision.open()">← My Saved Words</button><h3>${kind==='mastered'?'Mastered Saved Words':'Saved Words'}</h3><div class="muted">${rows.length} questions</div></div>${rows.map((x,i)=>`<div class="bank-row"><b>${i+1}. ${esc(x.word||x.id)}</b><div class="muted">Day ${x.day} · ${esc(x.state||'Learning')}${x.starred?' · ⭐ Starred':''}${x.difficult?' · ⚡ Difficult':''}</div></div>`).join('')}` }catch(e){body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
    function back(){$('mySavedRevisionView')?.classList.add('hidden');EPApp.showTab('revision')}
    return {open,back,pick,closePicker,runCount,start,view,injectRevision};
  })();window.EPMySavedRevision=MySaved;

  const Revision=(()=>{function inject(){if($('centralDifficultCard'))return;const weak=[...document.querySelectorAll('#revisionView .list-card')].find(x=>(x.textContent||'').includes('Weak / Wrong'));if(!weak)return;const c=document.createElement('div');c.id='centralDifficultCard';c.className='list-card';c.innerHTML='<b>⚡ Difficult</b><div class="muted">Questions you manually marked difficult anywhere</div>';c.onclick=start;weak.insertAdjacentElement('afterend',c)}async function start(){if(EPQuiz.hasSavedSessionFor('difficult')){const opts={batchId:'central-all'};if(EPQuiz.isSameRequested('difficult',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start Difficult Revision and replace it?'))return;EPQuiz.replaceSavedFor('difficult')}try{const qs=await EPApp.call('getCentralDifficultBatch');if(!qs.length){EPApp.toast('No difficult questions marked yet.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'difficult',batchId:'central-all',title:'Difficult Revision',returnTab:'revision'})}catch(e){EPApp.toast('Could not load Difficult Revision: '+(e.message||e))}}return{inject,start}})();window.EPLearningRevision=Revision;

  function renderLearningProgress(){const view=$('progressView');if(!view)return;let p=null;try{p=JSON.parse(localStorage.getItem('ep-progress-snapshot-v1')||'null')}catch(e){}if(!p||Number(p.schemaVersion||0)<2)return;const overview=$('progressOverview'),summary=$('progressSummary'),list=$('progressList'),method=$('progressMethod');if(!summary||summary.querySelector('[data-learning-summary]'))return;if(overview){overview.classList.add('learning-v2');overview.innerHTML=`<div><span>Bank Exposed</span><b>${Number(p.bankExposed||0).toFixed(1)}%</b></div><div><span>First Attempt</span><b>${Number(p.firstAttemptAccuracy||0).toFixed(1)}%</b></div><div><span>Retention</span><b>${Number(p.retentionAccuracy||0).toFixed(1)}%</b></div><div><span>Weak</span><b>${Number(p.weakCount||0)}</b></div><div><span>Persistent Weak</span><b>${Number(p.persistentWeakCount||0)}</b></div><div><span>Mastered</span><b>${Number(p.masteredCount||0)}</b></div>`}summary.innerHTML=`<div data-learning-summary="1"><div class="learning-after">After-review accuracy: <b>${Number(p.afterReviewAccuracy||0).toFixed(1)}%</b> · immediate retries are excluded from retention</div><div class="progress-today" style="margin-top:8px">${Number(p.exposed||0)} / ${Number(p.total||0)} genuine bank questions exposed · ${Number(p.left||0)} unseen</div></div>`;if(method)method.textContent='Bank Exposed = unique genuine bank Question_IDs attempted at least once. First-Attempt Accuracy uses only the first genuine attempt per Question_ID. After-Review Accuracy uses follow-up attempts inside 24 hours. Retention Accuracy uses attempts separated from the immediately previous attempt by at least 24 hours. Persistent Weak = 3+ lifetime wrong answers or 2+ wrong spaced recalls. Mastered here means retention-proven, not merely an immediate correction.';if(list)list.innerHTML=(p.categories||[]).map(c=>`<article class="learning-category"><div class="row between"><b>${esc(c.name)}</b><strong>${c.exposed} / ${c.total}</strong></div><div class="mini-meter" style="margin-top:8px"><i style="width:${Math.min(100,Number(c.coveragePercent||0))}%"></i></div><div class="metrics">Coverage ${Number(c.coveragePercent||0).toFixed(1)}% · First ${Number(c.firstAttemptAccuracy||0).toFixed(1)}% · Retention ${Number(c.retentionAccuracy||0).toFixed(1)}%<br>Weak ${Number(c.weak||0)} · Persistent Weak ${Number(c.persistentWeak||0)} · Mastered ${Number(c.mastered||0)}</div></article>`).join('')}

  function init(){ensureStyles();Bank.ensure?.();Bank.injectHome();MySaved.injectRevision();Revision.inject();const q=$('qId');if(q)new MutationObserver(()=>{const id=String(q.textContent||'').trim();if(id!==timerQ)resetTimer();applyTitle();setTimeout(()=>{if(difficultModes.has(currentMode)&&window.EPStarredRevision)EPStarredRevision.syncDifficultButton()},0)}).observe(q,{childList:true,subtree:true});const note=$('dailyNote');if(note)new MutationObserver(syncAdaptiveNote).observe(note,{childList:true,characterData:true,subtree:true});const progress=$('progressView');if(progress)new MutationObserver(()=>setTimeout(renderLearningProgress,0)).observe(progress,{childList:true,subtree:true});setTimeout(()=>{syncAdaptiveNote();renderLearningProgress()},500)}
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
