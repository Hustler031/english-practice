<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let smart=null,history=null,pendingMode='smart',legacy=null;
  function ensure(){
    let view=$('mySavedRevisionView');if(!view){view=document.createElement('section');view.id='mySavedRevisionView';view.className='app-page content hidden';$('main')?.appendChild(view)}
    view.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision powered by your central learning history.</p></div></div><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost mini" onclick="EPMyWordsUX.open()">Manage Saved Words</button></div><div id="mySavedRevisionBody"></div>';
    if(!$('smartMySavedPicker')){const w=document.createElement('div');w.id='smartMySavedPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="smartMySavedPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPSmartMySaved.run(10)">10</button><button onclick="EPSmartMySaved.run(20)">20</button><button onclick="EPSmartMySaved.run(30)">30</button><button onclick="EPSmartMySaved.run(50)">50</button></div><button class="btn ghost full" style="margin-top:12px" onclick="EPSmartMySaved.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('smartMySavedStyles')){const st=document.createElement('style');st.id='smartMySavedStyles';st.textContent='.sms-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.sms-metric{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 5px;text-align:center}.sms-metric b{display:block;font-size:16px}.sms-metric small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.sms-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0 14px}.sms-actions .btn{min-height:42px;padding:7px 4px;font-size:10px}.sms-history{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin-top:8px}.sms-history-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}@media(max-width:380px){.sms-metrics{grid-template-columns:repeat(2,1fr)}.sms-actions{gap:5px}.sms-actions .btn{font-size:9px}}';document.head.appendChild(st)}
  }
  function show(){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$('mySavedRevisionView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function metric(label,value){return `<div class="sms-metric"><b>${Number(value||0)}</b><small>${esc(label)}</small></div>`}
  function action(icon,label,mode,available,all){const n=Number(available||0);return `<button class="btn soft mini" ${n?'':'disabled'} onclick="EPSmartMySaved.${all?`startAll('${mode}')`:`pick('${mode}')`}">${icon}<br>${esc(label)}${n?` <small>(${n})</small>`:''}</button>`}
  function groupStats(st){return `${Number(st?.saved||0)} saved · ${Number(st?.focus||0)} active · ${Number(st?.weak||0)} weak · ${Number(st?.mastered||0)} mastered`}
  function historyRows(){const groups=history?.groups||history?.days||[];if(!groups.length)return'<div class="empty card">No enriched saved words are in practice yet.</div>';return groups.map(g=>{const scope={fromDay:Number(g.fromDay||g.day||1),toDay:Number(g.toDay||g.day||1)},j=JSON.stringify(scope),st=g.stats||{};return `<div class="sms-history"><div class="row between"><div><b>${esc(g.label||('Day '+scope.fromDay))}</b><div class="muted">${esc(groupStats(st))}</div></div><span>›</span></div><div class="sms-history-actions"><button class="btn ghost mini" onclick='EPMySavedRevision.view(${j},"all")'>View</button><button class="btn soft mini" ${Number(st.focus||0)?'':'disabled'} onclick='EPMySavedRevision.start(${j},"all",0)'>Practice</button><button class="btn soft mini" ${Number(st.weak||0)?'':'disabled'} onclick='EPMySavedRevision.start(${j},"weak",20)'>Weak</button></div></div>`}).join('')}
  function render(){const b=$('mySavedRevisionBody');if(!b||!smart)return;const s=smart.stats||{},a=smart.available||{};b.innerHTML=`<div class="card"><div class="row between"><div><b>🧠 Smart My Saved</b><div class="muted">Central intelligence + stronger coverage rotation for words you personally saved.</div></div><span class="tag">${Number(s.eligible||0)} active</span></div><div class="sms-metrics">${metric('Saved',s.saved)}${metric('Never Revised',s.neverRevised)}${metric('Due',s.due)}${metric('Mastered',s.mastered)}</div><div class="sms-actions">${action('🧠','Smart Revision','smart',a.smart,false)}${action('🔥','Weak','weak',a.weak,false)}${action('⚡','Difficult','difficult',a.difficult,false)}${action('⭐','Starred','starred',a.starred,false)}${action('🎲','Random','random',a.random,false)}${action('▶','Practice All','all',a.all,true)}</div></div><h3 class="section-title">Saved History</h3>${historyRows()}`}
  async function open(){show();const b=$('mySavedRevisionBody');if(b)b.innerHTML='<div class="list-card"><div class="muted">Preparing Smart My Saved…</div></div>';try{[smart,history]=await Promise.all([EPApp.call('getSmartMySavedHubV1'),EPApp.call('getMySavedRevisionHub')]);render()}catch(e){if(b)b.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function pick(mode){pendingMode=String(mode||'smart');$('smartMySavedPickerTitle').textContent=pendingMode==='smart'?'Smart Revision':pendingMode.charAt(0).toUpperCase()+pendingMode.slice(1)+' · choose questions';$('smartMySavedPicker')?.classList.remove('hidden')}
  function closePicker(){$('smartMySavedPicker')?.classList.add('hidden')}
  function run(n){closePicker();start(pendingMode,n)}
  function startAll(){start('all',0)}
  async function start(mode,count){const batchId=`smart-my-saved-${mode}-${count||'all'}`,opts={batchId};if(EPQuiz.hasSavedSessionFor('mySavedRevision')){if(EPQuiz.isSameRequested('mySavedRevision',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start this My Saved set and replace it?'))return;EPQuiz.replaceSavedFor('mySavedRevision')}try{const qs=await EPApp.call('getSmartMySavedBatchV1',mode,count||20);if(!qs.length){EPApp.toast('No eligible saved-word questions in this mode.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'mySavedRevision',batchId,title:mode==='smart'?'My Saved · Smart Revision':'My Saved · '+mode.replace(/^./,x=>x.toUpperCase()),returnTab:'revision'})}catch(e){EPApp.toast('Could not load My Saved revision: '+(e.message||e))}}
  function back(){$('mySavedRevisionView')?.classList.add('hidden');EPApp.showTab('revision')}
  function install(){legacy=window.EPMySavedRevision||{};legacy.open=open;legacy.back=back;window.EPMySavedRevision=legacy;if(typeof EPApp!=='undefined')EPApp.openSaved=open;const card=[...document.querySelectorAll('#revisionView .list-card')].find(x=>(x.textContent||'').includes('My Saved'));if(card){card.onclick=()=>EPApp.openSaved();card.innerHTML='<b>🔖 My Saved Words</b><div class="muted">Smart Revision · Weak · Difficult · Starred · Random · Practice All</div>'}}
  window.EPSmartMySaved={open,pick,closePicker,run,start,startAll,back};
  install();
})();
</script>
