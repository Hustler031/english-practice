<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const CACHE_KEY='smartMySaved:snapshot:v2',DIRTY_KEY='ep:smartMySaved:dirty:v2',TTL=60000;
  let snapshot=null,pendingMode='smart',legacy=null,refreshing=false,starting=false;
  const readCache=()=>{const r=window.EPFast?.get?.(CACHE_KEY);return r&&r.data?{data:r.data,ts:Number(r.ts||0)}:null};
  const writeCache=data=>{snapshot=data;window.EPFast?.set?.(CACHE_KEY,{data,ts:Date.now()});try{localStorage.removeItem(DIRTY_KEY)}catch(e){}return data};
  const isDirty=()=>{try{return localStorage.getItem(DIRTY_KEY)==='1'}catch(e){return false}};
  function markDirty(){try{localStorage.setItem(DIRTY_KEY,'1')}catch(e){}}
  function ensure(){
    let view=$('mySavedRevisionView');if(!view){view=document.createElement('section');view.id='mySavedRevisionView';view.className='app-page content hidden';$('main')?.appendChild(view)}
    if(view.dataset.smartMySavedShell!=='1'){view.dataset.smartMySavedShell='1';view.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision powered by your central learning history.</p></div></div><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button id="smartManageSavedWords" class="btn ghost mini" onclick="EPSmartMySaved.manage()">Manage Saved Words</button></div><div id="mySavedRevisionBody"></div>'}
    if(!$('smartMySavedPicker')){const w=document.createElement('div');w.id='smartMySavedPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="smartMySavedPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPSmartMySaved.run(10)">10</button><button onclick="EPSmartMySaved.run(20)">20</button><button onclick="EPSmartMySaved.run(30)">30</button><button onclick="EPSmartMySaved.run(50)">50</button></div><button class="btn ghost full" style="margin-top:12px" onclick="EPSmartMySaved.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('smartMySavedStyles')){const st=document.createElement('style');st.id='smartMySavedStyles';st.textContent='.sms-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.sms-metric{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 5px;text-align:center}.sms-metric b{display:block;font-size:16px}.sms-metric small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.sms-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0 14px}.sms-actions .btn{min-height:42px;padding:7px 4px;font-size:10px}.sms-history{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin-top:8px}.sms-history-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sms-cache-note{font-size:10px;color:var(--muted);margin-top:7px}@media(max-width:380px){.sms-metrics{grid-template-columns:repeat(2,1fr)}.sms-actions{gap:5px}.sms-actions .btn{font-size:9px}}';document.head.appendChild(st)}
  }
  function show(){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$('mySavedRevisionView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function metric(label,value){return `<div class="sms-metric"><b>${Number(value||0)}</b><small>${esc(label)}</small></div>`}
  function action(icon,label,mode,available,all){const n=Number(available||0);return `<button class="btn soft mini" ${n?'':'disabled'} onclick="EPSmartMySaved.${all?`startAll('${mode}')`:`pick('${mode}')`}">${icon}<br>${esc(label)}${n?` <small>(${n})</small>`:''}</button>`}
  function groupStats(st){return `${Number(st?.saved||0)} saved · ${Number(st?.focus||0)} active · ${Number(st?.weak||0)} weak · ${Number(st?.mastered||0)} mastered`}
  function historyRows(){const groups=snapshot?.history?.groups||[];if(!groups.length)return'<div class="empty card">No enriched saved words are in practice yet.</div>';return groups.map(g=>{const scope={fromDay:Number(g.fromDay||1),toDay:Number(g.toDay||g.fromDay||1)},j=JSON.stringify(scope),st=g.stats||{};return `<div class="sms-history" data-saved-history-type="${esc(g.type||'day')}"><div class="row between"><div><b>${esc(g.label||('Day '+scope.fromDay))}</b><div class="muted">${esc(groupStats(st))}</div></div><span>›</span></div><div class="sms-history-actions"><button class="btn ghost mini" onclick='EPSmartMySaved.viewHistory(${j},"all")'>View</button><button class="btn soft mini" ${Number(st.focus||0)?'':'disabled'} onclick='EPSmartMySaved.startHistory(${j},"all",0,${JSON.stringify(String(g.label||'Saved History'))})'>Practice</button><button class="btn soft mini" ${Number(st.weak||0)?'':'disabled'} onclick='EPSmartMySaved.startHistory(${j},"weak",20,${JSON.stringify(String(g.label||'Saved History'))})'>Weak</button></div></div>`}).join('')}
  function render(data){snapshot=data||snapshot;const b=$('mySavedRevisionBody');if(!b||!snapshot)return;const s=snapshot.stats||{},a=snapshot.available||{};b.innerHTML=`<div class="card"><div class="row between"><div><b>🧠 Smart Revision</b><div class="muted">Central intelligence + stronger coverage rotation for words you personally saved.</div></div><span class="tag">${Number(s.eligible||0)} active</span></div><div class="sms-metrics">${metric('Saved',s.saved)}${metric('Never Revised',s.neverRevised)}${metric('Due',s.due)}${metric('Mastered',s.mastered)}</div><div class="sms-actions">${action('🧠','Smart Revision','smart',a.smart,false)}${action('🔥','Weak','weak',a.weak,false)}${action('⚡','Difficult','difficult',a.difficult,false)}${action('⭐','Starred','starred',a.starred,false)}${action('🎲','Random','random',a.random,false)}${action('▶','Practice All','all',a.all,true)}</div><div class="sms-cache-note">Cached first · refreshes silently in background</div></div><h3 class="section-title">Saved History</h3>${historyRows()}`}
  async function refresh(force=false){const cached=readCache();if(refreshing||(!force&&!isDirty()&&cached&&Date.now()-cached.ts<TTL))return cached?.data||snapshot;refreshing=true;try{const fresh=await EPApp.call('getSmartMySavedSnapshotV2');writeCache(fresh);if($('mySavedRevisionView')&&!$('mySavedRevisionView').classList.contains('hidden'))render(fresh);return fresh}catch(e){if(!cached?.data&&!snapshot&&$('mySavedRevisionView')&&!$('mySavedRevisionView').classList.contains('hidden'))$('mySavedRevisionBody').innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`;return cached?.data||snapshot}finally{refreshing=false}}
  function open(){show();const cached=readCache();if(cached?.data){render(cached.data);setTimeout(()=>refresh(false),0)}else{const b=$('mySavedRevisionBody');if(b&&!String(b.innerHTML||'').trim())b.innerHTML='<div class="list-card"><div class="muted">Preparing Smart My Saved for first use…</div></div>';setTimeout(()=>refresh(true),0)}}
  function pick(mode){pendingMode=String(mode||'smart');$('smartMySavedPickerTitle').textContent=pendingMode==='smart'?'Smart Revision':pendingMode.charAt(0).toUpperCase()+pendingMode.slice(1)+' · choose questions';$('smartMySavedPicker')?.classList.remove('hidden')}
  function closePicker(){$('smartMySavedPicker')?.classList.add('hidden')}
  function run(n){closePicker();start(pendingMode,n)}
  function startAll(){start('all',0)}
  function manage(){if(window.EPMyWordsUX?.open)EPMyWordsUX.open()}
  function viewHistory(scope,kind){if(legacy?.view)return legacy.view(scope,kind);EPApp.toast('Saved-word list is unavailable right now.')}
  function prepareSession(batchId){const opts={batchId};if(!EPQuiz.hasSavedSessionFor('mySavedRevision'))return true;if(EPQuiz.isSameRequested('mySavedRevision',opts)){EPQuiz.resumeOther();return false}if(!confirm('A paused extra practice set exists. Start this My Saved set and replace it?'))return false;EPQuiz.replaceSavedFor('mySavedRevision');return true}
  async function launchBatch(fetcher,batchId,title,label){
    if(starting||!prepareSession(batchId))return;
    starting=true;
    EPApp.showPracticeLoading?.(label||'Preparing Smart Revision…');
    // Let the loading overlay paint before the Apps Script call starts; otherwise a slow
    // Smart-universe calculation looks like a frozen button.
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    try{const qs=await fetcher();if(!qs.length){EPApp.toast('No eligible saved-word questions in this section.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'mySavedRevision',batchId,title,returnTab:'revision'})}catch(e){EPApp.toast('Could not load My Saved revision: '+(e.message||e))}finally{EPApp.hidePracticeLoading?.();starting=false;}
  }
  async function start(mode,count){const batchId=`smart-my-saved-${mode}-${count||'all'}`;return launchBatch(()=>EPApp.call('getSmartMySavedBatchV1',mode,count||20),batchId,mode==='smart'?'My Saved · Smart Revision':'My Saved · '+mode.replace(/^./,x=>x.toUpperCase()),mode==='weak'?'Starting Weak Saved Words…':mode==='difficult'?'Starting Difficult Saved Words…':mode==='starred'?'Starting Starred Saved Words…':mode==='random'?'Starting Random Saved Words…':'Starting My Saved Practice…')}
  async function startHistory(scope,kind,count,label){scope=scope||{};const from=Math.max(1,Number(scope.fromDay||1)),to=Math.max(from,Number(scope.toDay||from)),mode=String(kind||'all'),batchId=`saved-history-${from}-${to}-${mode}-${count||0}`;return launchBatch(()=>EPApp.call('getMySavedRevisionBatch',{fromDay:from,toDay:to},mode,count||0),batchId,'My Saved · '+String(label||`Days ${from}–${to}`),mode==='weak'?'Starting Weak Saved History…':'Starting Saved History…')}
  function back(){$('mySavedRevisionView')?.classList.add('hidden');EPApp.showTab('revision')}
  function install(){legacy=window.EPMySavedRevision||{};legacy.open=open;legacy.back=back;window.EPMySavedRevision=legacy;if(typeof EPApp!=='undefined')EPApp.openSaved=open;const card=[...document.querySelectorAll('#revisionView .list-card')].find(x=>(x.textContent||'').includes('My Saved'));if(card){card.onclick=()=>EPApp.openSaved();card.innerHTML='<b>🔖 My Saved Words</b><div class="muted">Smart Revision · Weak · Difficult · Starred · Random · Practice All</div>'}}
  window.EPSmartMySaved={open,pick,closePicker,run,start,startAll,startHistory,viewHistory,manage,back,refresh,markDirty,render};
  install();
  document.addEventListener('DOMContentLoaded',()=>EPApp.deferAfterHome?.(()=>refresh(false)));
})();
</script>
