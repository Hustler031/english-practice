<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const HUB_KEY='phrasal:hub:v2',TODAY_KEY='phrasal:today:v2',DIRTY_KEY='ep:phrasal:dirty:v2',TTL=60000;
  let hub=null,pendingMode='smart',origin='home',refreshing=false,prefetching=false;
  function localDateKey(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
  const readHub=()=>{const r=window.EPFast?.get?.(HUB_KEY);return r&&r.data?{data:r.data,ts:Number(r.ts||0)}:null};
  const readToday=()=>{const r=window.EPFast?.get?.(TODAY_KEY);return r&&r.date?{date:String(r.date),questions:Array.isArray(r.questions)?r.questions:[],ts:Number(r.ts||0)}:null};
  function writeHub(data){hub=data;window.EPFast?.set?.(HUB_KEY,{data,ts:Date.now()});try{localStorage.removeItem(DIRTY_KEY)}catch(e){}return data}
  function writeToday(date,questions){window.EPFast?.set?.(TODAY_KEY,{date:String(date||''),questions:Array.isArray(questions)?questions:[],ts:Date.now()})}
  const isDirty=()=>{try{return localStorage.getItem(DIRTY_KEY)==='1'}catch(e){return false}};
  function markDirty(){try{localStorage.setItem(DIRTY_KEY,'1')}catch(e){}}
  function ensure(){
    if(!$('phrasalMasteryView')){const s=document.createElement('section');s.id='phrasalMasteryView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPPhrasalMastery.back()">← Back</button><div><h2>Phrasal Verb</h2><p class="muted">Concept-first learning and revision through the central intelligence system.</p></div></div><div id="phrasalMasteryBody"></div>';$('main')?.appendChild(s)}
    if(!$('phrasalMasteryPicker')){const w=document.createElement('div');w.id='phrasalMasteryPicker';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closePicker()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="phrasalMasteryPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPPhrasalMastery.run(10)">10</button><button onclick="EPPhrasalMastery.run(20)">20</button><button onclick="EPPhrasalMastery.run(30)">30</button><button onclick="EPPhrasalMastery.run(50)">50</button></div><button class="btn ghost full" style="margin-top:12px" onclick="EPPhrasalMastery.closePicker()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('phrasalMasteryStyles')){const st=document.createElement('style');st.id='phrasalMasteryStyles';st.textContent='.pv-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.pv-metric{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 5px;text-align:center}.pv-metric b{display:block;font-size:15px}.pv-metric small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.pv-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.pv-actions .btn{min-height:42px;padding:7px 4px;font-size:10px}.pv-today{border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--primary) 5%,var(--card));padding:14px;margin-top:13px}.pv-history{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin-top:8px}.pv-history-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}.pv-history-actions .btn{min-width:88px}.pv-cache-note{font-size:10px;color:var(--muted);margin-top:7px}@media(max-width:380px){.pv-metrics{grid-template-columns:repeat(2,1fr)}.pv-actions{gap:5px}.pv-actions .btn{font-size:9px}.pv-history-actions .btn{min-width:76px}}';document.head.appendChild(st)}
  }
  function show(){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$('phrasalMasteryView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function metric(label,value){return `<div class="pv-metric"><b>${esc(value)}</b><small>${esc(label)}</small></div>`}
  function action(icon,label,mode,available,all){const n=Number(available||0);return `<button class="btn soft mini" ${n?'':'disabled'} onclick="EPPhrasalMastery.${all?`startAll('${mode}')`:`pick('${mode}')`}">${icon}<br>${esc(label)}${n?` <small>(${n})</small>`:''}</button>`}
  function historyHtml(){const rows=hub?.history||[];return rows.length?rows.map(x=>{const tag=x.date?`<span class="tag">${esc(x.date)}</span>`:`<span class="tag">${esc(x.type||'history')}</span>`;return `<div class="pv-history"><div class="row between"><div><b>${esc(x.label||'Batch')}</b><div class="muted">${Number(x.generated||0)} generated · ${Number(x.practised||0)} practised</div></div>${tag}</div><div class="pv-history-actions"><button class="btn soft mini" ${Number(x.generated||0)?'':'disabled'} onclick='EPPhrasalMastery.startHistory(${Number(x.fromDay||1)},${Number(x.toDay||x.fromDay||1)},${JSON.stringify(String(x.label||'Phrasal History'))})'>Practice</button></div></div>`}).join(''):'<div class="empty card">Daily Phrasal history will appear after the first permanent batch is added.</div>'}
  function render(data){hub=data||hub;const b=$('phrasalMasteryBody');if(!b||!hub)return;const s=hub.stats||{},a=hub.available||{},raw=hub.today||{},todayIsCurrent=String(raw.date||'')===localDateKey(),t=todayIsCurrent?raw:{date:localDateKey(),count:0,ready:false};b.innerHTML=`<div class="card"><div class="row between"><div><b>🧠 Smart Revision</b><div class="muted">One concept per slot · central Weak/Due/Starred/Difficult signals.</div></div><span class="tag">${Number(s.totalConcepts||0)} concepts</span></div><div class="pv-metrics">${metric('Bank Exposure',`${Number(s.exposed||0)} / ${Number(s.totalConcepts||0)}`)}${metric('Due',s.due||0)}${metric('Weak',s.weak||0)}${metric('Mastered',s.mastered||0)}</div><div class="pv-actions">${action('🧠','Smart Revision','smart',a.smart,false)}${action('🔥','Weak','weak',a.weak,false)}${action('⚡','Difficult','difficult',a.difficult,false)}${action('⭐','Starred','starred',a.starred,false)}${action('🎲','Random','random',a.random,false)}${action('▶','Practice All','all',a.all,true)}</div><div class="pv-cache-note">Cached first · refreshes silently in background</div></div><div class="pv-today"><div class="row between"><div><b>Today's 15</b><div class="muted">${todayIsCurrent?(t.ready?`${Number(t.count||0)} permanent questions · ${esc(t.date||'')}`:'Today’s permanent batch has not been added yet.'):'Checking today’s permanent batch…'}</div></div><span class="tag">${todayIsCurrent?(t.ready?'READY':'PENDING'):'REFRESHING'}</span></div><button class="btn primary full" style="margin-top:10px" ${todayIsCurrent&&t.ready?'':'disabled'} onclick="EPPhrasalMastery.startToday()">Practice Today's 15</button></div><h3 class="section-title">Phrasal Daily History</h3>${historyHtml()}`}
  async function prefetchToday(date,force=false){const d=String(date||'');if(!d||d!==localDateKey()||prefetching)return;const cached=readToday();if(!force&&cached&&cached.date===d&&Date.now()-cached.ts<TTL)return;prefetching=true;try{const qs=await EPApp.call('getPhrasalTodayBatchV1');writeToday(d,qs)}catch(e){}finally{prefetching=false}}
  async function refresh(force=false){const cached=readHub(),current=cached?.data&&String(cached.data.today?.date||'')===localDateKey();if(refreshing||(!force&&!isDirty()&&cached&&current&&Date.now()-cached.ts<TTL))return cached?.data||hub;refreshing=true;try{const fresh=await EPApp.call('getPhrasalMasteryHubV1');writeHub(fresh);if($('phrasalMasteryView')&&!$('phrasalMasteryView').classList.contains('hidden'))render(fresh);if(fresh?.today?.ready)setTimeout(()=>prefetchToday(fresh.today.date,true),0);return fresh}catch(e){if(!cached?.data&&!hub&&$('phrasalMasteryView')&&!$('phrasalMasteryView').classList.contains('hidden'))$('phrasalMasteryBody').innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`;return cached?.data||hub}finally{refreshing=false}}
  function open(from){origin=from||origin||'home';show();const cached=readHub();if(cached?.data){render(cached.data);if(String(cached.data.today?.date||'')===localDateKey()&&cached.data.today?.ready)setTimeout(()=>prefetchToday(cached.data.today.date,false),0);setTimeout(()=>refresh(false),0)}else{const b=$('phrasalMasteryBody');if(b&&!String(b.innerHTML||'').trim())b.innerHTML='<div class="list-card"><div class="muted">Preparing Phrasal Verb mastery for first use…</div></div>';setTimeout(()=>refresh(true),0)}}
  function pick(mode){pendingMode=String(mode||'smart');$('phrasalMasteryPickerTitle').textContent=pendingMode==='smart'?'Smart Revision':pendingMode.charAt(0).toUpperCase()+pendingMode.slice(1)+' · choose questions';$('phrasalMasteryPicker')?.classList.remove('hidden')}
  function closePicker(){$('phrasalMasteryPicker')?.classList.add('hidden')}
  function run(n){closePicker();start(pendingMode,n)}
  function startAll(){start('all',0)}
  async function launch(qs,meta){if(!qs.length){EPApp.toast('No eligible Phrasal Verb questions in this mode.');return false}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,meta);return true}
  function prepareRevisionSession(batchId){const opts={batchId};if(!EPQuiz.hasSavedSessionFor('phrasalRevision'))return true;if(EPQuiz.isSameRequested('phrasalRevision',opts)){EPQuiz.resumeOther();return false}if(!confirm('A paused extra practice set exists. Start this Phrasal set and replace it?'))return false;EPQuiz.replaceSavedFor('phrasalRevision');return true}
  async function start(mode,count){const batchId=`phrasal-${mode}-${count||'all'}`;if(!prepareRevisionSession(batchId))return;EPApp.showPracticeLoading?.(mode==='weak'?'Starting Weak Phrasal Revision…':mode==='difficult'?'Starting Difficult Phrasal Revision…':mode==='starred'?'Starting Starred Phrasal Revision…':mode==='random'?'Starting Random Phrasal Revision…':'Starting Phrasal Revision…');try{const qs=await EPApp.call('getPhrasalMasteryBatchV1',mode,count||20);if(!qs.length){EPApp.hidePracticeLoading?.();EPApp.toast('No eligible Phrasal Verb questions in this mode.');return}EPApp.hidePracticeLoading?.();await launch(qs,{mode:'phrasalRevision',batchId,title:mode==='smart'?'Phrasal Verb · Smart Revision':'Phrasal Verb · '+mode.replace(/^./,x=>x.toUpperCase()),returnTab:'home'})}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Phrasal Revision: '+(e.message||e))}}
  async function startHistory(fromDay,toDay,label){const from=Math.max(1,Number(fromDay||1)),to=Math.max(from,Number(toDay||from)),batchId=`phrasal-history-${from}-${to}`;if(!prepareRevisionSession(batchId))return;EPApp.showPracticeLoading?.('Starting Phrasal History…');try{const qs=await EPApp.call('getPhrasalHistoryBatchV1',from,to);if(!qs.length){EPApp.hidePracticeLoading?.();EPApp.toast('No eligible Phrasal history questions in this range.');return}EPApp.hidePracticeLoading?.();await launch(qs,{mode:'phrasalRevision',batchId,title:'Phrasal Verb · '+String(label||`Days ${from}–${to}`),returnTab:'phrasalMastery',phrasalHistory:true})}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Phrasal history: '+(e.message||e))}}
  async function startToday(){const date=localDateKey(),batchId='phrasal-today-'+date,opts={batchId};if(EPQuiz.hasSavedSessionFor('phrasalDaily')){if(EPQuiz.isSameRequested('phrasalDaily',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start Today’s 15 and replace it?'))return;EPQuiz.replaceSavedFor('phrasalDaily')}EPApp.showPracticeLoading?.("Starting Today's 15 Phrasal Verbs…");try{let qs=[],cached=readToday();if(cached&&cached.date===date&&cached.questions.length)qs=cached.questions;else{qs=await EPApp.call('getPhrasalTodayBatchV1');writeToday(date,qs)}if(!qs.length){EPApp.hidePracticeLoading?.();EPApp.toast('Today’s permanent Phrasal batch is not available.');return}EPApp.hidePracticeLoading?.();await launch(qs,{mode:'phrasalDaily',batchId,title:"Phrasal Verb · Today's 15",returnTab:'home'})}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Today’s 15: '+(e.message||e))}}
  function back(){$('phrasalMasteryView')?.classList.add('hidden');EPApp.showTab(origin==='library'?'library':'home');origin='home'}
  window.EPPhrasalMastery={open,back,pick,closePicker,run,start,startAll,startToday,startHistory,refresh,prefetchToday,markDirty,render};
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>refresh(false),1600));
})();
</script>
