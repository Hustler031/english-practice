<script>
(()=>{
  const HUB_KEY='ep:bankCoverage:hub:v3',DETAIL_PREFIX='ep:bankCoverage:category:v1:',OUTBOX_KEY='ep-answer-outbox-v3',TTL=60000;
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let hubRefreshing=false,detailRefreshing={},currentCat='',currentName='',currentDetail=null,counts={},openFolds=new Set(),mixedStarting=false;
  const readRaw=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},writeRaw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const readSnap=k=>{const v=readRaw(k);if(!v)return null;return v&&v.data?{data:v.data,ts:Number(v.ts||0)}:{data:v,ts:0}},writeSnap=(k,data)=>writeRaw(k,{data,ts:Date.now()});
  const detailKey=cat=>DETAIL_PREFIX+String(cat||'').trim(),localDateKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
  function ensureStyles(){if($('bankCoverageUxStyles'))return;const s=document.createElement('style');s.id='bankCoverageUxStyles';s.textContent=`
    .bc-cat-row{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:13px;margin-top:9px;cursor:pointer}.bc-cat-row:active{transform:scale(.995)}
    .bc-mixed{padding:12px 2px 3px}.bc-mixed-label{font-size:12px;font-weight:900;margin-bottom:8px}.bc-mixed-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bc-mixed-counts button{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-weight:800;cursor:pointer}.bc-mixed-counts button:active{transform:scale(.98)}
    .bc-detail-top{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px}.bc-today-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bc-chip{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;text-align:center}.bc-chip b{display:block;font-size:16px}.bc-chip small{color:var(--muted);font-size:10px}.bc-chip.clickable{cursor:pointer}
    .bc-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0 10px}.bc-counts button{min-height:40px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-weight:800;color:var(--text)}.bc-counts button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .bc-fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;overflow:hidden}.bc-fold-head{padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer}.bc-fold-body{border-top:1px solid var(--line);padding:11px 12px}.bc-fold-body.hidden{display:none}.bc-review-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.bc-review-actions .btn{font-size:10px;min-height:38px;padding:6px 4px}
    .bc-attempt{border-top:1px solid var(--line);padding:10px 0}.bc-attempt:first-of-type{border-top:0}.bc-result{font-size:11px;font-weight:900}.bc-answer{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.bc-answer strong{color:var(--text)}.bc-flags{font-size:11px;white-space:nowrap}.bc-cache-note{font-size:10px;color:var(--muted);margin-top:7px}.bc-section-label{font-size:12px;font-weight:900;margin-top:14px}.bc-stale{opacity:.74}
    @media(max-width:380px){.bc-today-strip{gap:5px}.bc-counts,.bc-mixed-counts{gap:4px}.bc-review-actions{gap:4px}.bc-review-actions .btn{font-size:9px}}
  `;document.head.appendChild(s)}
  function ensureViews(){
    if(!$('bankCoverageView')){const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverage.back()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional unseen-bank exposure.</p></div></div><div id="bankCoverageBody"></div>';$('main')?.appendChild(s)}
    if(!$('bankCoverageCategoryView')){const s=document.createElement('section');s.id='bankCoverageCategoryView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverageUX.backToHub()">← Bank Coverage</button><div><h2 id="bankCoverageCategoryTitle">Bank Coverage</h2><p class="muted">New exposure + same-day consolidation.</p></div></div><div id="bankCoverageCategoryBody"></div>';$('main')?.appendChild(s)}
  }
  function showPage(id){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$(id)?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function hubCategory(cat){const h=readSnap(HUB_KEY)?.data;return (h?.categories||[]).find(c=>String(c.id)===String(cat))||null}
  function cleanHubHeader(){const p=$('bankCoverageView')?.querySelector('.subhead .muted');if(p)p.textContent='Use Mixed Unseen Practice or choose a category below.'}
  function renderHub(h){if(!h)return;ensureViews();cleanHubHeader();const body=$('bankCoverageBody');if(!body)return;const stale=String(h.date||'')!==localDateKey();body.innerHTML=`<div class="card ${stale?'bc-stale':''}"><div class="row between"><b>BANK EXPOSED</b><strong>${Number(h.coverage||0).toFixed(1)}%</strong></div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(h.coverage||0))}%"></i></div><div class="muted" style="margin-top:7px">${Number(h.exposed||0)} / ${Number(h.total||0)} exposed · ${Number(h.left||0)} left${h.complete?' · BANK FULLY EXPOSED ✅':''}</div><div class="bc-cache-note">${stale?'Showing last coverage snapshot · updating silently':'Cached · refreshes silently in background'}</div></div><div class="bc-mixed"><div class="bc-mixed-label">Mixed Unseen Practice</div><div class="bc-mixed-counts">${[10,20,30,50].map(n=>`<button onclick="EPBankCoverageUX.startMixed(${n})">${n}</button>`).join('')}</div></div>${(h.categories||[]).map(c=>{const left=Number(c.left??c.unseen??0);return `<div class="bc-cat-row ${stale?'bc-stale':''}" onclick='EPBankCoverageUX.openCategory(${JSON.stringify(c.id)},${JSON.stringify(c.name)})'><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${Number(c.exposed||0)} / ${Number(c.total||0)} exposed · ${Number(c.coverage||0).toFixed(1)}%</div></div><span class="tag">${c.complete?'DONE':left+' left'}</span></div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(c.coverage||0))}%"></i></div></div>`}).join('')}`}
  async function refreshHub(){if(hubRefreshing)return;hubRefreshing=true;try{const h=await EPApp.call('getBankCoverageHub');writeSnap(HUB_KEY,h);if($('bankCoverageView')&&!$('bankCoverageView').classList.contains('hidden'))renderHub(h);if(currentCat&&$('bankCoverageCategoryView')&&!$('bankCoverageCategoryView').classList.contains('hidden')&&!readSnap(detailKey(currentCat)))renderProvisional(hubCategory(currentCat))}catch(e){}finally{hubRefreshing=false}}
  function openHub(){ensureStyles();ensureViews();currentCat='';currentDetail=null;showPage('bankCoverageView');const snap=readSnap(HUB_KEY);if(snap?.data)renderHub(snap.data);else $('bankCoverageBody').innerHTML='<div class="list-card"><div class="muted">Preparing Bank Coverage for first use…</div></div>';setTimeout(refreshHub,0)}
  function provisionalFrom(c){if(!c)return null;const h=readSnap(HUB_KEY)?.data,fresh=String(h?.date||'')===localDateKey();return Object.assign({},c,{date:String(h?.date||''),newToday:fresh?Number(c.newToday||0):0,attemptedToday:fresh?Number(c.attemptedToday||0):0,todayCorrect:fresh?Number(c.todayCorrect||0):0,todayWrong:fresh?Number(c.todayWrong||0):0,todayDifficult:fresh?Number(c.todayDifficult||0):0,today:{attempted:fresh?Number(c.attemptedToday||0):0,correct:fresh?Number(c.todayCorrect||0):0,wrong:fresh?Number(c.todayWrong||0):0,difficult:fresh?Number(c.todayDifficult||0):0,items:[]},provisional:true})}
  function renderProvisional(c){const p=provisionalFrom(c);if(p){currentDetail=p;renderDetail(p)}}
  function foldKey(kind){return `${currentCat}:${kind}`}
  function fold(kind,title,subtitle,body){const key=foldKey(kind),open=openFolds.has(key);return `<div class="bc-fold"><div class="bc-fold-head" onclick='EPBankCoverageUX.toggleFold(${JSON.stringify(kind)})'><div><b>${esc(title)}</b><div class="muted">${esc(subtitle||'')}</div></div><span>${open?'⌄':'›'}</span></div><div id="bcFold-${esc(kind)}" class="bc-fold-body ${open?'':'hidden'}">${body}</div></div>`}
  function reviewItem(x){const result=x.correct?'✓ Correct':'✕ Wrong',flags=`${x.starred?'⭐ ':''}${x.difficult?'⚡ ':''}`.trim();return `<div class="bc-attempt"><div class="row between"><div class="bc-result">${result}</div><div class="bc-flags">${flags}</div></div><div style="margin-top:4px"><b>${esc(x.word||x.id)}</b>${x.question?`<div class="muted" style="margin-top:3px">${esc(x.question)}</div>`:''}</div><details style="margin-top:6px"><summary class="muted" style="cursor:pointer">View answer</summary><div class="bc-answer">Your answer: <strong>${esc(x.selectedKey)}${x.selectedText?' · '+esc(x.selectedText):''}</strong><br>Correct: <strong>${esc(x.correctKey)}${x.correctText?' · '+esc(x.correctText):''}</strong>${x.explanation?`<div style="margin-top:6px">${esc(x.explanation)}</div>`:''}</div></details></div>`}
  function renderDetail(d){
    if(!d)return;currentDetail=d;const body=$('bankCoverageCategoryBody');if(!body)return;const stale=String(d.date||'')!==localDateKey(),today=stale?{attempted:0,correct:0,wrong:0,difficult:0,items:[]}:Object.assign({attempted:Number(d.attemptedToday||0),correct:Number(d.todayCorrect||0),wrong:Number(d.todayWrong||0),difficult:Number(d.todayDifficult||0),items:[]},d.today||{}),left=Number(d.left??d.unseen??0),seen=Math.max(0,Number(d.exposed||0)),selected=counts[currentCat]||10,startCount=left>0?Math.min(selected,left):Math.min(selected,seen),newToday=stale?0:Number(d.newToday||0),attempted=Number(today.attempted||0);
    $('bankCoverageCategoryTitle').textContent=d.name||currentName||'Bank Coverage';currentName=d.name||currentName;
    const reviewBody=`<div class="bc-review-actions"><button class="btn soft mini" ${attempted?'':'disabled'} onclick='EPBankCoverageUX.startReview("all")'>Practice All Again</button><button class="btn soft mini" ${Number(today.wrong||0)?'':'disabled'} onclick='EPBankCoverageUX.startReview("wrong")'>Wrong Only</button><button class="btn soft mini" ${Number(today.difficult||0)?'':'disabled'} onclick='EPBankCoverageUX.startReview("difficult")'>Difficult Only</button></div>${d.provisional?'<div class="muted">Loading today’s question list silently…</div>':((today.items||[]).length?(today.items||[]).map(reviewItem).join(''):'<div class="muted">No Bank Coverage questions attempted in this category today.</div>')}`;
    const last=d.lastSession,lastBody=last?`<div class="row between"><b>${Number(last.attempted||0)} attempted</b><span>${Number(last.correct||0)} ✓ · ${Number(last.wrong||0)} ✕</span></div><div class="muted" style="margin-top:5px">${esc(last.label||last.date||'')}</div>`:'<div class="muted">No previous Bank Coverage session in this category yet.</div>';
    body.innerHTML=`<div class="bc-detail-top ${stale?'bc-stale':''}"><div class="row between"><div><b>${Number(d.total||0)} total · ${seen} exposed · ${left} left</b><div class="muted" style="margin-top:3px">${Number(d.coverage||0).toFixed(1)}% bank coverage</div></div>${d.complete?'<span class="tag">FULLY EXPOSED</span>':''}</div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(d.coverage||0))}%"></i></div><div class="bc-today-strip"><div class="bc-chip"><b>🆕 ${newToday}</b><small>New Today</small></div><div class="bc-chip clickable" onclick="EPBankCoverageUX.openTodayReview()"><b>↻ ${attempted}</b><small>Attempted Today ›</small></div></div><div class="bc-section-label">${left>0?'How many new questions?':'Bank fully exposed · choose seen questions'}</div><div class="bc-counts">${[10,20,50,100].map(n=>`<button class="${selected===n?'active':''}" onclick="EPBankCoverageUX.setCount(${n})">${n}</button>`).join('')}</div><button class="btn primary full" ${startCount?'':'disabled'} onclick="EPBankCoverageUX.startPrimary()">${left>0?`Start ${startCount}`:`Practice ${startCount||''} Seen Questions`.trim()}</button><div class="bc-cache-note">${stale?'Today reset locally · refreshing silently':d.provisional?'Coverage cache shown instantly · details refreshing silently':'Cached category snapshot · refreshes silently in background'}</div></div>${fold('today','Today’s Review',`${attempted} attempted · ${Number(today.correct||0)} correct · ${Number(today.wrong||0)} wrong · ${Number(today.difficult||0)} difficult`,reviewBody)}${fold('last','Last Session',last?`${Number(last.attempted||0)} attempted · ${Number(last.correct||0)} correct · ${Number(last.wrong||0)} wrong`:'No previous session',lastBody)}`;
  }
  async function refreshDetail(cat){cat=String(cat||'').trim();if(!cat||detailRefreshing[cat])return;detailRefreshing[cat]=true;try{const d=await EPApp.call('getBankCoverageCategoryDetail',cat);writeSnap(detailKey(cat),d);if(currentCat===cat&&$('bankCoverageCategoryView')&&!$('bankCoverageCategoryView').classList.contains('hidden'))renderDetail(d)}catch(e){}finally{detailRefreshing[cat]=false}}
  function openCategory(cat,name){ensureStyles();ensureViews();currentCat=String(cat||'').trim();currentName=String(name||'');counts[currentCat]=counts[currentCat]||10;showPage('bankCoverageCategoryView');const snap=readSnap(detailKey(currentCat));if(snap?.data)renderDetail(snap.data);else renderProvisional(hubCategory(currentCat)||{id:currentCat,name:currentName,total:0,exposed:0,left:0,coverage:0});setTimeout(()=>refreshDetail(currentCat),0)}
  function setCount(n){if(!currentCat)return;counts[currentCat]=Number(n)||10;renderDetail(currentDetail)}
  function toggleFold(kind){const key=foldKey(kind);if(openFolds.has(key))openFolds.delete(key);else openFolds.add(key);renderDetail(currentDetail)}
  function openTodayReview(){if(!currentCat)return;openFolds.add(foldKey('today'));renderDetail(currentDetail);setTimeout(()=>$('bcFold-today')?.scrollIntoView({behavior:'smooth',block:'nearest'}),0)}
  function pendingOutboxQuestionIds(){try{const q=JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]');return [...new Set((Array.isArray(q)?q:[]).map(x=>String(x&&x.payload&&x.payload.questionId||'').trim()).filter(Boolean))]}catch(e){return[]}}
  function prepareStart(mode,batchId,title,categoryOverride){const category=categoryOverride===undefined?currentCat:String(categoryOverride||''),opts={category,batchId};if(EPQuiz.hasSavedSessionFor('bankCoverage')){if(EPQuiz.isSameRequested('bankCoverage',opts)){EPQuiz.resumeOther();return false}if(!confirm('A paused Bank Coverage set exists. Start this set and replace it?'))return false;EPQuiz.replaceSavedFor('bankCoverage')}EPApp.showPracticeLoading?.(title||'Starting Bank Coverage…');return true}
  function launchQuestions(qs,batchId,title,categoryOverride){const category=categoryOverride===undefined?currentCat:String(categoryOverride||'');EPApp.hidePracticeLoading?.();if(!qs||!qs.length){EPApp.toast('No eligible Bank Coverage questions available for this action.');setTimeout(()=>category==='__mixed__'?refreshHub():refreshDetail(currentCat),0);return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'bankCoverage',category,batchId,title,returnTab:'home'})}
  async function startMixed(count){const n=Number(count);if(![10,20,30,50].includes(n)||mixedStarting)return;const category='__mixed__',batchId=`${localDateKey()}-bankCoverage-mixed-${n}`;if(!prepareStart('bankCoverage',batchId,'Starting Mixed Unseen Practice…',category))return;mixedStarting=true;try{const qs=await EPApp.call('getBankCoverageMixedBatch',n,pendingOutboxQuestionIds());launchQuestions(qs,batchId,'Bank Coverage · Mixed Unseen',category)}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Mixed Unseen Practice: '+(e.message||e))}finally{mixedStarting=false}}
  async function startPrimary(){if(!currentDetail||!currentCat)return;const selected=counts[currentCat]||10,left=Number(currentDetail.left??currentDetail.unseen??0),seen=Number(currentDetail.exposed||0),n=left>0?Math.min(selected,left):Math.min(selected,seen),kind=left>0?'new':'seen',batchId=`${localDateKey()}-${currentCat}-${kind}-${n}`;if(!n||!prepareStart('bankCoverage',batchId,left>0?'Starting Bank Coverage…':'Starting Seen Bank Practice…'))return;try{const qs=left>0?await EPApp.call('getBankCoverageBatch',currentCat,n):await EPApp.call('getBankCoverageSeenBatch',currentCat,n);launchQuestions(qs,batchId,`Bank Coverage · ${currentName}${left>0?'':' · Seen Practice'}`)}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Bank Coverage: '+(e.message||e))}}
  async function startReview(kind){if(!currentCat)return;const k=String(kind||'all'),batchId=`${localDateKey()}-${currentCat}-today-${k}`;if(!prepareStart('bankCoverage',batchId,'Starting Today’s Review…'))return;try{const qs=await EPApp.call('getBankCoverageTodayBatch',currentCat,k,100);launchQuestions(qs,batchId,`Bank Coverage · ${currentName} · Today Review`)}catch(e){EPApp.hidePracticeLoading?.();EPApp.toast('Could not load Today’s Review: '+(e.message||e))}}
  function backToHub(){currentCat='';currentDetail=null;showPage('bankCoverageView');const snap=readSnap(HUB_KEY);if(snap?.data)renderHub(snap.data);setTimeout(refreshHub,0)}
  function backHome(){$('bankCoverageCategoryView')?.classList.add('hidden');$('bankCoverageView')?.classList.add('hidden');EPApp.showTab('home')}
  function installOpenOverride(){if(!window.EPBankCoverage)return;try{Object.defineProperty(window.EPBankCoverage,'open',{value:openHub,writable:false,configurable:true})}catch(e){window.EPBankCoverage.open=openHub}window.EPBankCoverage.back=backHome}
  document.addEventListener('click',e=>{const bank=e.target.closest?.('#bankCoverageQuick');if(bank){e.preventDefault();e.stopImmediatePropagation();openHub()}},true);
  document.addEventListener('DOMContentLoaded',()=>{ensureStyles();ensureViews();setTimeout(installOpenOverride,60)});
  window.EPBankCoverageUX={open:openHub,openCategory,backToHub,setCount,toggleFold,openTodayReview,startMixed,startPrimary,startReview,refreshHub,refreshDetail};
})();
</script>
