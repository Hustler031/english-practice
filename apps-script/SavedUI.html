<script>
const EPSaved=(()=>{
  let loading=false,captureContext={},hubCache=null,wordsCache=[];
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function ensureShell(){
    if(!$('savedView')){const section=document.createElement('section');section.id='savedView';section.className='app-page content hidden';section.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPApp.showTab(\'revision\')">← Back</button><div><h2>My Saved</h2><p class="muted">Your deliberately starred questions and personally captured words.</p></div></div><div id="savedHub" class="list"></div>'; $('main').appendChild(section)}
    if(!$('wordCaptureSheet')){const wrap=document.createElement('div');wrap.id='wordCaptureSheet';wrap.className='sheet-backdrop hidden';wrap.onclick=e=>{if(e.target===wrap)closeCapture()};wrap.innerHTML='<div class="sheet saved-word-sheet" onclick="event.stopPropagation()"><h3>📝 Add Word</h3><p class="muted">Paste only the word. Its meaning is filled automatically when available; you can edit it later.</p><label>Word</label><input id="captureWord" class="saved-input" autocomplete="off" placeholder="e.g. obviate"><div id="captureOrigin" class="capture-origin muted"></div><div class="saved-sheet-actions"><button class="btn ghost" onclick="EPSaved.closeCapture()">Cancel</button><button class="btn primary" onclick="EPSaved.saveCapture()">Save</button></div></div>';document.body.appendChild(wrap)}
    if(!$('savedModeSheet')){const w=document.createElement('div');w.id='savedModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeCount()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="savedModeTitle">Choose questions</h3><div id="savedModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPSaved.closeCount()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('savedUiStyles')){const st=document.createElement('style');st.id='savedUiStyles';st.textContent='.saved-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.saved-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.saved-actions .btn{font-size:11px;min-height:38px;padding:7px 4px}.saved-word-list{display:grid;gap:8px;margin-top:10px}.saved-word{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.saved-word summary{cursor:pointer;list-style:none;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.saved-word summary::-webkit-details-marker{display:none}.saved-word-body{border-top:1px solid var(--line);padding:12px;display:grid;gap:8px}.saved-input{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);padding:10px 11px}.saved-word-status{font-size:11px;border-radius:999px;padding:4px 8px;background:var(--primary2);white-space:nowrap}.saved-word-status.added{background:var(--okbg);color:var(--ok)}.saved-sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.capture-origin{font-size:11px;margin-top:8px}.quiz-tools{grid-template-columns:repeat(4,minmax(0,1fr))!important}.quiz-tools .btn{font-size:12px!important}@media(max-width:420px){.saved-actions .btn{font-size:10px}}';document.head.appendChild(st)}
  }
  function showOwn(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$('savedView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  async function openSaved(){ensureShell();showOwn();await loadSaved()}
  function renderSaved(hub,words){hubCache=hub;wordsCache=words||[];const el=$('savedHub'),starred=Number(hub.starred||0),weak=Number(hub.starredWeak||0);el.innerHTML=`<section class="saved-section"><div><b>⭐ Starred Questions</b><div class="muted">${starred} currently starred${weak?` · ${weak} weak`:''}</div></div><div class="saved-actions"><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.viewStarred()">View All</button><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.startStarred('all',0)">Practice All</button><button class="btn soft mini" ${weak?'':'disabled'} onclick="EPSaved.chooseCount('weak',${weak})">Weak</button><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.chooseCount('random',${starred})">Random</button></div></section><section class="saved-section"><div><b>📌 My Words</b><div class="muted">${Number(hub.words||0)} captured · ${Number(hub.wordsAdded||0)} added to practice</div></div>${words.length?`<div class="saved-word-list">${words.map(wordCard).join('')}</div>`:'<div class="muted" style="margin-top:10px">No words saved yet. Use 📝 Add Word while practising.</div>'}</section>`}
  async function loadSaved(){if(loading)return;loading=true;const hc=window.EPFast&&EPFast.get('saved:hub'),wc=window.EPFast&&EPFast.get('saved:words');if(hc&&wc)renderSaved(hc,wc);else $('savedHub').innerHTML='<div class="list-card"><div class="muted">Preparing saved items…</div></div>';
    try{const [hub,words]=await Promise.all([EPApp.call('getMySavedHub'),EPApp.call('getMyWords')]);if(window.EPFast){EPFast.set('saved:hub',hub);EPFast.set('saved:words',words)}renderSaved(hub,words)}catch(e){if(!(hc&&wc))$('savedHub').innerHTML=`<div class="empty card">${esc(e.message)}</div>`}finally{loading=false}}
  function wordCard(w){const added=!!w.practiceQuestionId||String(w.status||'').toLowerCase()==='added';return `<details class="saved-word"><summary><div><b>${esc(w.word)}</b><div class="muted" style="font-size:11px">${esc(w.module||w.source||'Saved during practice')}${w.created?` · ${esc(w.created)}`:''}</div></div><span class="saved-word-status ${added?'added':''}">${added?'✓ In Practice':w.meaning?'Ready':'Review'}</span></summary><div class="saved-word-body"><label>Meaning / explanation</label><textarea id="mw_meaning_${esc(w.id)}" class="saved-input" rows="3" placeholder="Meaning could not be found automatically; add it here if needed">${esc(w.meaning)}</textarea><label>Context / your note</label><textarea id="mw_context_${esc(w.id)}" class="saved-input" rows="3">${esc(w.context)}</textarea>${w.questionId?`<div class="muted" style="font-size:11px">From question: ${esc(w.questionId)}</div>`:''}<div class="row" style="gap:8px"><button class="btn ghost mini" onclick="EPSaved.saveReview('${esc(w.id)}','${esc(w.word)}')">Save Edit</button><button class="btn ${added?'state-ok':'primary'} mini" ${added?'disabled':''} onclick="EPSaved.addToPractice('${esc(w.id)}','${esc(w.word)}')">${added?'✓ Added':'✓ Add to Practice'}</button></div></div></details>`}
  function chooseCount(kind,available){$('savedModeTitle').textContent=`Starred · ${kind==='weak'?'Weak':'Random'}`;$('savedModeBody').innerHTML=`<div class="muted">${available} available · choose questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button onclick="EPSaved.startStarred('${kind}',${n})">${n}</button>`).join('')}</div>`;$('savedModeSheet').classList.remove('hidden')}
  function closeCount(){$('savedModeSheet')?.classList.add('hidden')}
  async function viewStarred(){const key='saved:starred',cached=window.EPFast&&EPFast.get(key),el=$('savedHub');if(cached)renderStarredList(cached);else el.innerHTML='<div class="list-card"><div class="muted">Preparing starred list…</div></div>';try{const rows=await EPApp.call('getStarredQuestionList');if(window.EPFast)EPFast.set(key,rows);renderStarredList(rows)}catch(e){if(!cached)el.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderStarredList(rows){$('savedHub').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPSaved.loadSaved()">← My Saved</button><h2 style="margin:14px 0 4px">Starred Questions · View All</h2><div class="muted">${rows.length} questions</div></div><div class="browse-list">${rows.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.weak?'Weak · ':''}${x.attempts?x.attempts+' attempts':'Not attempted'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}
  async function startStarred(kind,count){closeCount();showLoad('Loading Starred Questions…');try{const qs=await EPApp.call('getStarredPracticeBatch',kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible starred questions.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'savedStarred',title:'Starred Questions',batchId:kind+(count?'-'+count:''),returnTab:'saved'})}catch(e){hideLoad();EPApp.toast('Could not load starred questions: '+e.message)}}
  function reviewPayload(id,word){return{id,word,meaning:$('mw_meaning_'+id)?.value||'',context:$('mw_context_'+id)?.value||''}}
  async function saveReview(id,word){try{await EPApp.call('updateMyWord',reviewPayload(id,word));if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub')}EPApp.toast('Saved');loadSaved()}catch(e){EPApp.toast(e.message)}}
  async function addToPractice(id,word){try{await EPApp.call('updateMyWord',reviewPayload(id,word));const r=await EPApp.call('promoteMyWordToPractice',id);if(window.EPFast){['saved:words','saved:hub','new:hub'].forEach(k=>EPFast.drop(k))}EPApp.toast(r&&r.linked?'Linked to existing vocabulary':'Added to New Practice');await loadSaved()}catch(e){EPApp.toast(e.message)}}
  function openCapture(){ensureShell();captureContext={questionId:String($('qId')?.textContent||'').trim(),module:String($('quizMode')?.textContent||'').trim(),context:String($('qText')?.textContent||'').trim(),source:String($('qCategory')?.textContent||'').trim()};$('captureWord').value='';$('captureOrigin').textContent=captureContext.questionId?`From ${captureContext.module||'practice'} · ${captureContext.questionId}`:'Captured during practice';$('wordCaptureSheet').classList.remove('hidden');setTimeout(()=>$('captureWord')?.focus(),60)}
  function closeCapture(){$('wordCaptureSheet')?.classList.add('hidden')}
  function saveCapture(){const word=String($('captureWord')?.value||'').trim();if(!word){EPApp.toast('Enter a word first.');return}const payload={word,meaning:'',context:captureContext.context||'',questionId:captureContext.questionId||'',module:captureContext.module||'',source:captureContext.source||''};closeCapture();EPApp.toast('Word saved');EPApp.call('captureMyWord',payload).then(()=>{if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub')}}).catch(e=>EPApp.toast('Could not save word: '+e.message))}
  function showLoad(t){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=t;v.classList.remove('hidden')}
  function hideLoad(){$('compactQuizLoading')?.classList.add('hidden')}
  function init(){ensureShell();if(typeof EPApp!=='undefined'&&!EPApp.__savedUiWired){EPApp.__savedUiWired=true;const originalShow=EPApp.showTab;EPApp.showTab=function(name){if(name==='saved'){openSaved();return}if($('savedView'))$('savedView').classList.add('hidden');return originalShow.apply(this,arguments)};EPApp.openSaved=openSaved}}
  document.addEventListener('DOMContentLoaded',init);
  return{openSaved,loadSaved,startStarred,chooseCount,closeCount,viewStarred,saveReview,addToPractice,openCapture,closeCapture,saveCapture};
})();
</script>
