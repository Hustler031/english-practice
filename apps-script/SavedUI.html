<script>
const EPSaved=(()=>{
  let loading=false,captureContext={},hubCache=null,wordsCache=[],reviewId='';
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function ensureShell(){
    if(!$('savedView')){const s=document.createElement('section');s.id='savedView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPApp.showTab(\'revision\')">← Back</button><div><h2>My Saved</h2><p class="muted">Starred questions and words captured during practice.</p></div></div><div id="savedHub" class="list"></div>';$('main').appendChild(s)}
    if(!$('wordReviewView')){const s=document.createElement('section');s.id='wordReviewView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPSaved.closeReview()">← My Words</button><div><h2 id="wordReviewTitle">Word Review</h2><p class="muted">Review GPT-prepared content before adding it to practice.</p></div></div><div id="wordReviewBody"></div>';$('main').appendChild(s)}
    if(!$('wordCaptureSheet')){const w=document.createElement('div');w.id='wordCaptureSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeCapture()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3>📝 Add Word</h3><p class="muted">Paste only the word. ChatGPT will prepare the SSC-style explanation and quiz options separately.</p><input id="captureWord" class="saved-input" autocomplete="off" placeholder="e.g. obviate"><div id="captureOrigin" class="capture-origin muted"></div><div class="saved-sheet-actions"><button class="btn ghost" onclick="EPSaved.closeCapture()">Cancel</button><button class="btn primary" onclick="EPSaved.saveCapture()">Save</button></div></div>';document.body.appendChild(w)}
    if(!$('savedModeSheet')){const w=document.createElement('div');w.id='savedModeSheet';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeCount()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><h3 id="savedModeTitle">Choose questions</h3><div id="savedModeBody"></div><button class="btn ghost full" style="margin-top:12px" onclick="EPSaved.closeCount()">Cancel</button></div>';document.body.appendChild(w)}
    if(!$('savedUiStyles')){const st=document.createElement('style');st.id='savedUiStyles';st.textContent='.saved-section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.saved-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.saved-actions .btn{font-size:11px;min-height:38px;padding:7px 4px}.saved-word-list{display:grid;gap:8px;margin-top:10px}.saved-word-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:7px;border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--card)}.saved-word-name{cursor:pointer;min-width:0}.saved-word-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-word-row .btn{min-height:34px;padding:6px 8px;font-size:11px}.saved-input{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);padding:11px}.saved-sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.capture-origin{font-size:11px;margin-top:8px}.word-status{font-size:10px;color:var(--muted)}.word-review-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.word-review-word{font-size:28px;font-weight:900;margin-bottom:4px}.word-review-question{font-size:18px;font-weight:800;line-height:1.45;margin:14px 0}.word-review-options{display:grid;gap:8px}.word-review-option{border:1px solid var(--line);border-radius:12px;padding:11px}.word-review-option.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.word-review-details{display:grid;gap:9px}.word-review-block{border-top:1px solid var(--line);padding-top:9px}.word-review-block small{display:block;color:var(--muted);font-weight:800;margin-bottom:3px}.word-review-actions{position:sticky;bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);padding:8px 0}.word-edit-grid{display:grid;gap:9px}.word-edit-grid label{font-size:11px;font-weight:800;color:var(--muted)}.word-edit-grid textarea{min-height:70px;resize:vertical}.quiz-tools{grid-template-columns:repeat(4,minmax(0,1fr))!important}.quiz-tools .btn{font-size:12px!important}@media(max-width:420px){.saved-actions .btn{font-size:10px}.saved-word-row .btn{font-size:10px;padding:5px 6px}}';document.head.appendChild(st)}
  }
  function showOwn(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');$('savedView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>window.EPPerformanceUI?.ensure(),0)}
  async function openSaved(){ensureShell();showOwn();loadSaved()}
  function renderSaved(hub,words){hubCache=hub||{};wordsCache=words||[];const el=$('savedHub'),starred=Number(hubCache.starred||0),weak=Number(hubCache.starredWeak||0);el.innerHTML=`<section class="saved-section"><div><b>⭐ Starred Questions</b><div class="muted">${starred} currently starred${weak?` · ${weak} weak`:''}</div></div><div class="saved-actions"><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.viewStarred()">View All</button><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.startStarred('all',0)">Practice All</button><button class="btn soft mini" ${weak?'':'disabled'} onclick="EPSaved.chooseCount('weak',${weak})">Weak</button><button class="btn soft mini" ${starred?'':'disabled'} onclick="EPSaved.chooseCount('random',${starred})">Random</button></div></section><section class="saved-section"><div><b>📌 My Words</b><div class="muted">${wordsCache.length} captured · ${Number(hubCache.wordsReady||0)} ready · ${Number(hubCache.wordsAdded||0)} in practice</div></div>${wordsCache.length?`<div class="saved-word-list">${wordsCache.map(wordRow).join('')}</div>`:'<div class="muted" style="margin-top:10px">No saved words yet.</div>'}</section>`}
  function wordRow(w){const added=!!w.practiceQuestionId||String(w.status||'').toLowerCase()==='added',ready=String(w.gptStatus||'').toLowerCase()==='ready';return `<div class="saved-word-row"><div class="saved-word-name" onclick="EPSaved.reviewWord('${esc(w.id)}')"><b>${esc(w.word)}</b><div class="word-status">${added?'✓ In Practice':ready?'Ready':'Pending GPT'}</div></div><button class="btn ghost mini" onclick="EPSaved.reviewWord('${esc(w.id)}')">Review</button><button class="btn ${added?'state-ok':'primary'} mini" ${(added||!ready)?'disabled':''} onclick="EPSaved.addToPractice('${esc(w.id)}')">${added?'✓ Added':'Add'}</button></div>`}
  async function loadSaved(){if(loading)return;loading=true;const hc=window.EPFast&&EPFast.get('saved:hub'),wc=window.EPFast&&EPFast.get('saved:words');if(hc&&wc)renderSaved(hc,wc);else if(!hubCache)$('savedHub').innerHTML='<div class="list-card"><div class="muted">Preparing saved items…</div></div>';try{const [hub,words]=await Promise.all([EPApp.call('getMySavedHub'),EPApp.call('getMyWords')]);if(window.EPFast){EPFast.set('saved:hub',hub);EPFast.set('saved:words',words)}renderSaved(hub,words)}catch(e){if(!(hc&&wc)&&!hubCache)$('savedHub').innerHTML=`<div class="empty card">${esc(e.message)}</div>`}finally{loading=false}}
  function reviewWord(id){ensureShell();const w=wordsCache.find(x=>String(x.id)===String(id));if(!w)return;reviewId=id;document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('wordReviewView').classList.remove('hidden');$('bottomNav')?.classList.add('hidden');$('wordReviewTitle').textContent=w.word;renderReview(w,false);window.scrollTo({top:0,behavior:'smooth'})}
  function renderReview(w,editing){const ready=String(w.gptStatus||'').toLowerCase()==='ready',added=!!w.practiceQuestionId||String(w.status||'').toLowerCase()==='added';if(!ready){$('wordReviewBody').innerHTML='<div class="empty card">ChatGPT enrichment is pending. The word is already saved and will become reviewable after the scheduled enrichment task runs.</div>';return}if(editing){const fields=[['Meaning','meaning'],['Part of speech / type','partOfSpeech'],['Synonyms','synonyms'],['Antonyms','antonyms'],['Example','example'],['Explanation','explanation'],['Question','question'],['Option A','optionA'],['Option B','optionB'],['Option C','optionC'],['Option D','optionD'],['Correct option (A/B/C/D)','correctOption']];$('wordReviewBody').innerHTML=`<div class="word-review-card"><div class="word-edit-grid">${fields.map(([l,k])=>`<label>${esc(l)}<textarea class="saved-input" data-word-field="${k}">${esc(w[k]||'')}</textarea></label>`).join('')}</div></div><div class="word-review-actions"><button class="btn ghost" onclick="EPSaved.reviewWord('${esc(w.id)}')">Cancel</button><button class="btn primary" onclick="EPSaved.saveReviewEdit()">Save Changes</button></div>`;return}const keys=['A','B','C','D'],opts=[w.optionA,w.optionB,w.optionC,w.optionD];$('wordReviewBody').innerHTML=`<div class="word-review-card"><div class="word-review-word">${esc(w.word)}</div>${w.partOfSpeech?`<div class="muted">${esc(w.partOfSpeech)}</div>`:''}<div class="word-review-question">${esc(w.question||('Choose the closest meaning of '+w.word+'.'))}</div><div class="word-review-options">${opts.map((o,i)=>`<div class="word-review-option ${String(w.correctOption).toUpperCase()===keys[i]?'correct':''}"><b>${keys[i]}.</b> ${esc(o)}</div>`).join('')}</div></div><div class="word-review-card word-review-details">${block('Meaning',w.meaning)}${block('Explanation',w.explanation)}${block('Example',w.example)}${block('Synonyms',w.synonyms)}${block('Antonyms',w.antonyms)}${w.context?block('Where you found it',w.context):''}</div><div class="word-review-actions"><button class="btn ghost" onclick="EPSaved.editReview()">Edit</button><button class="btn primary" ${added?'disabled':''} onclick="EPSaved.addToPractice('${esc(w.id)}')">${added?'✓ Added to Practice':'Add to Practice'}</button></div>`}
  function block(label,value){if(!String(value||'').trim())return'';return `<div class="word-review-block"><small>${esc(label)}</small><div style="white-space:pre-wrap">${esc(value)}</div></div>`}
  function editReview(){const w=wordsCache.find(x=>String(x.id)===String(reviewId));if(w)renderReview(w,true)}
  async function saveReviewEdit(){const w=wordsCache.find(x=>String(x.id)===String(reviewId));if(!w)return;const payload={id:reviewId};document.querySelectorAll('[data-word-field]').forEach(el=>payload[el.dataset.wordField]=el.value);try{await EPApp.call('updateMyWord',payload);Object.assign(w,payload);if(window.EPFast)EPFast.drop('saved:words');EPApp.toast('Saved');renderReview(w,false)}catch(e){EPApp.toast(e.message)}}
  function closeReview(){$('wordReviewView')?.classList.add('hidden');showOwn()}
  function chooseCount(kind,available){$('savedModeTitle').textContent=`Starred · ${kind==='weak'?'Weak':'Random'}`;$('savedModeBody').innerHTML=`<div class="muted">${available} available · choose questions</div><div class="count-buttons" style="margin-top:12px">${[10,20,50,100].map(n=>`<button onclick="EPSaved.startStarred('${kind}',${n})">${n}</button>`).join('')}</div>`;$('savedModeSheet').classList.remove('hidden')}
  function closeCount(){$('savedModeSheet')?.classList.add('hidden')}
  async function viewStarred(){const key='saved:starred',cached=window.EPFast&&EPFast.get(key),el=$('savedHub');if(cached)renderStarredList(cached);else el.innerHTML='<div class="list-card"><div class="muted">Preparing starred list…</div></div>';try{const rows=await EPApp.call('getStarredQuestionList');if(window.EPFast)EPFast.set(key,rows);renderStarredList(rows)}catch(e){if(!cached)el.innerHTML=`<div class="empty card">${esc(e.message)}</div>`}}
  function renderStarredList(rows){$('savedHub').innerHTML=`<div class="card"><button class="btn ghost mini" onclick="EPSaved.loadSaved()">← My Saved</button><h2 style="margin:14px 0 4px">Starred Questions · View All</h2><div class="muted">${rows.length} questions</div></div><div class="browse-list">${rows.map((x,i)=>`<div class="browse-item"><b>${i+1}. ${esc(x.word||x.question||x.id)}</b>${x.word&&x.question?`<div class="muted">${esc(x.question)}</div>`:''}<div class="muted" style="font-size:11px">${x.weak?'Weak · ':''}${x.attempts?x.attempts+' attempts':'Not attempted'}${x.source?` · ${esc(x.source)}`:''}</div></div>`).join('')}</div>`}
  async function startStarred(kind,count){closeCount();showLoad('Loading Starred Questions…');try{const qs=await EPApp.call('getStarredPracticeBatch',kind,count||0);hideLoad();if(!qs.length){EPApp.toast('No eligible starred questions.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'savedStarred',title:'Starred Questions',batchId:kind+(count?'-'+count:''),returnTab:'saved'})}catch(e){hideLoad();EPApp.toast('Could not load starred questions: '+e.message)}}
  async function addToPractice(id){try{const r=await EPApp.call('promoteMyWordToPractice',id);if(window.EPFast){['saved:words','saved:hub','new:hub','topic:hub','progress'].forEach(k=>EPFast.drop(k))}EPApp.toast(r&&r.linked?'Linked to existing vocabulary':'Added to New Practice → My Saved Words');if(String(reviewId)===String(id)){const w=wordsCache.find(x=>String(x.id)===String(id));if(w){w.practiceQuestionId=r.questionId;w.status='Added';renderReview(w,false)}}else await loadSaved()}catch(e){EPApp.toast(e.message)}}
  function openCapture(){ensureShell();captureContext={questionId:String($('qId')?.textContent||'').trim(),module:String($('quizMode')?.textContent||'').trim(),context:String($('qText')?.textContent||'').trim(),source:String($('qCategory')?.textContent||'').trim()};$('captureWord').value='';$('captureOrigin').textContent=captureContext.questionId?`From ${captureContext.module||'practice'} · ${captureContext.questionId}`:'Captured during practice';$('wordCaptureSheet').classList.remove('hidden');setTimeout(()=>$('captureWord')?.focus(),50)}
  function closeCapture(){$('wordCaptureSheet')?.classList.add('hidden')}
  function saveCapture(){const word=String($('captureWord')?.value||'').trim();if(!word){EPApp.toast('Enter a word first.');return}const payload={word,context:captureContext.context||'',questionId:captureContext.questionId||'',module:captureContext.module||'',source:captureContext.source||''};closeCapture();EPApp.toast('Word saved · GPT pending');EPApp.call('captureMyWord',payload).then(()=>{if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub')}}).catch(e=>EPApp.toast('Could not save word: '+e.message))}
  function showLoad(t){let v=$('compactQuizLoading');if(!v){v=document.createElement('div');v.id='compactQuizLoading';v.style.cssText='position:fixed;inset:0;z-index:110;background:var(--bg);display:flex;align-items:center;justify-content:center';v.innerHTML='<div style="text-align:center"><div style="width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:auto;animation:epLoadSpin .75s linear infinite"></div><b id="compactQuizLoadingText" style="display:block;margin-top:14px">Loading Quiz…</b></div>';document.body.appendChild(v)}$('compactQuizLoadingText').textContent=t;v.classList.remove('hidden')}
  function hideLoad(){$('compactQuizLoading')?.classList.add('hidden')}
  function init(){ensureShell();if(typeof EPApp!=='undefined'&&!EPApp.__savedUiWired){EPApp.__savedUiWired=true;const os=EPApp.showTab;EPApp.showTab=function(name){if(name==='saved'){openSaved();return}if($('savedView'))$('savedView').classList.add('hidden');if($('wordReviewView'))$('wordReviewView').classList.add('hidden');return os.apply(this,arguments)};EPApp.openSaved=openSaved}}
  document.addEventListener('DOMContentLoaded',init);
  return{openSaved,loadSaved,startStarred,chooseCount,closeCount,viewStarred,reviewWord,closeReview,editReview,saveReviewEdit,addToPractice,openCapture,closeCapture,saveCapture};
})();
</script>
