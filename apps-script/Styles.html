<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#687386;--primary:#3157d5;--primary2:#eaf0ff;--ok:#16803a;--okbg:#eaf8ef;--bad:#c63737;--badbg:#fdecec;--warn:#a96b00;--warnbg:#fff5dc;--line:#e3e8ef;--shadow:0 10px 28px rgba(31,42,68,.08)}
