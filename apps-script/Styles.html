<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f0f3f8;--text:#172033;--muted:#687386;--line:#e2e7ef;--accent:#4f46e5;--accent2:#eef2ff;--good:#16824b;--bad:#c53b3b;--shadow:0 10px 28px rgba(31,42,68,.08)}
html[data-theme="dark"]{--bg:#0d1117;--surface:#151b24;--surface2:#1c2430;--text:#eef2f7;--muted:#9aa8ba;--line:#2b3543;--accent:#8b87ff;--accent2:#242545;--good:#54c985;--bad:#ff7474;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* GK app foundation: 900px app width + 16px mobile content padding */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
.topbar>*{max-width:900px;margin:0 auto}
.brand{border:0;background:none;font-weight:850;font-size:18px;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.shell{max-width:900px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}

.hero,.page-head{padding:4px 0 16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800;margin:0}
.compact-hero h1,.page-head h1{font-size:32px;line-height:1.08;margin:6px 0 8px}
.hero p,.page-head p{color:var(--muted);margin:0;font-size:15px;line-height:1.45}

.progress-card,.question-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.progress-card>div:first-child{display:flex;justify-content:space-between;align-items:end;gap:10px}
.progress-card strong{font-size:22px}
.muted{color:var(--muted);font-size:13px}
.progress-track{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:12px 0 16px}
.progress-track.slim{height:8px;margin:12px 0 16px}
.progress-bar{height:100%;background:var(--accent);border-radius:999px}

.section-block{margin-top:22px}
.section-block h2{font-size:16px;margin:0 0 10px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:800;cursor:pointer}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.feature-card,.random-card,.mini-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.feature-card{min-height:118px;padding:14px;display:grid;gap:6px}
.feature-card.compact-card{min-height:112px}
.feature-card>span{font-size:20px}
.feature-card b{font-size:15px}
.feature-card small,.random-card small,.mini-card span{color:var(--muted);font-size:12px;line-height:1.35}
.feature-card.accent{background:var(--accent2);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.random-card{width:100%;padding:15px;display:flex;gap:12px;align-items:center;min-height:58px}
.random-card>span:first-child{font-size:20px}
.random-card>div{display:grid;gap:2px;flex:1}
.mini-card{padding:14px;display:flex;flex-direction:column;gap:4px}

.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:750;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);color:#fff}
.btn.secondary{background:var(--surface);border:1px solid var(--line)}
.btn.soft{background:var(--surface2);border:1px solid var(--line)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.full{width:100%}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bottom-tab{border:0;background:transparent;padding:8px 4px;color:var(--muted);font-size:11px;display:grid;justify-items:center;gap:2px}
.bottom-tab span{display:block;font-size:19px;margin-bottom:2px;line-height:1}
.bottom-tab b{font-size:11px}
.bottom-tab.active{color:var(--accent);font-weight:800}

.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.quiz-count{text-align:center;display:grid}
.quiz-count span{color:var(--muted);font-size:12px}
.quiz-count b{font-size:14px}
.question-card{min-height:0}
.meta{display:flex;gap:7px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:12px}
.word{font-size:24px;font-weight:900;margin-top:12px}
.question-card h2{font-size:20px;line-height:1.45;margin:10px 0 16px}
.options{display:grid;gap:10px}
.option{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:14px;min-height:56px;cursor:pointer}
.option .letter{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800}
.option.correct{border-color:#8fd5a5;background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.option.wrong{border-color:#f2a8a8;background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:800}
.feedback.good{background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--good)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.explanation{margin-top:14px;border-left:4px solid var(--accent);padding:14px;background:var(--surface2);border-radius:12px;line-height:1.5}
.explanation h3{font-size:15px;margin:8px 0 4px}
.explanation p{margin:0 0 10px;font-size:15px;line-height:1.5}
.explanation .tip{border-left:0;padding-left:0}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sticky-nav{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}

.sheet-backdrop{position:fixed;inset:0;background:rgba(10,18,35,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.bottom-sheet{background:var(--surface);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
.count-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.count-buttons button{min-height:52px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;font-weight:850}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:12px;z-index:100;max-width:90%;box-shadow:var(--shadow)}
.quiz-active .shell{padding-bottom:28px}

@media(min-width:700px){
  .shell{padding:24px 24px 96px}
  .bottom-nav{max-width:900px;left:50%;right:auto;width:100%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .question-card h2{font-size:24px}
}

@media(max-width:420px){
  .shell{padding:16px 12px 96px}
  .compact-hero h1,.page-head h1{font-size:30px}
  .grid.two{grid-template-columns:1fr 1fr}
  .feature-card{min-height:112px;padding:13px}
}

@media(max-width:350px){
  .grid.two{grid-template-columns:1fr}
}
</style>
