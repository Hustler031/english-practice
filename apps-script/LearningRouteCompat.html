<script>
(()=>{
  function applyAdaptiveNote(b){const d=b&&b.dailyInfo,n=document.getElementById('dailyNote');if(!n||!d||!d.adaptive)return;n.textContent=`Adaptive mix: ${Number(d.persistentWeakCount||0)} persistent weak · ${Number(d.weakCount||0)} weak · ${Number(d.fragileCount||0)} fragile · ${Number(d.dueCount||0)} due · ${Number(d.freshCount||0)} controlled new.`}
  function wire(){
    if(typeof EPApp==='undefined'||EPApp.__learningRouteCompat)return;EPApp.__learningRouteCompat=true;
    EPApp.startHinduQuiz=async function(){
      EPQuiz.replaceSavedFor('hindu');
      try{const qs=await EPApp.call('getHinduQuizV2');if(!qs.length){EPApp.toast('Today’s Hindu-word batch is not available.');return}document.body.classList.add('quiz-active');document.getElementById('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'hindu',returnTab:'hindu',serverSynced:true})}catch(e){EPApp.toast(e.message||String(e))}
    };
    setTimeout(()=>EPApp.call('getBootstrapV3').then(b=>{window.EPLearningBootstrap=b;applyAdaptiveNote(b)}).catch(()=>{}),250);
  }
  document.addEventListener('DOMContentLoaded',wire);
})();
</script>
