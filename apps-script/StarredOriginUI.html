<script>
(()=>{
  const CACHE_MIGRATION='ep:starred-origin-ui:v4';
  function wire(){
    if(typeof EPApp==='undefined'||!EPApp.call||EPApp.__starredOriginV4)return;EPApp.__starredOriginV4=true;
    const raw=EPApp.call.bind(EPApp),map={getStarredRevisionHub:'getStarredRevisionHubStableV4',getStarredRevisionGroup:'getStarredRevisionGroupStableV4',getStarredRevisionItems:'getStarredRevisionItemsStableV4',getStarredRevisionBatch:'getStarredRevisionBatchStableV4'};
    EPApp.call=function(fn,...args){return raw(map[fn]||fn,...args)};
    try{if(localStorage.getItem(CACHE_MIGRATION)!=='1'){localStorage.setItem(CACHE_MIGRATION,'1');if(window.EPFast&&EPFast.drop)EPFast.drop('starred:hub')}}catch(e){}
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(wire,40));
})();
</script>
