<script>
const EPQuiz=(()=>{
  const KEY='ep-quiz-session-v3';
  const state={questions:[],index:0,answers:{},marked:{},startedAt:0,meta:{},returnTab:'home'};
  const $=id=>document.getElementById(id),letters=['A','B','C','D'];
  function start(questions,meta){state.questions=questions;state.index=0;state.answers={};state.marked={};state.meta=meta||{};state.returnTab=state.meta.returnTab||inferReturnTab(state.meta.mode);openQuiz();persist()}
  function openQuiz(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView').classList.remove('hidden');$('bottomNav').classList.add('hidden');render();window.scrollTo({top:0})}
  function current(){return state.questions[state.index]}
  function render(){const q=current();if(!q)return;state.startedAt=Date.now();$('quizMode').textContent=labelMode(state.meta,q);$('quizCounter').textContent=`${state.index+1} / ${state.questions.length}`;$('quizBar').style.width=`${((state.index+1)/state.questions.length)*100}%`;$('qCategory').textContent=q.topic||q.category||'English';$('qId').textContent=q.id;$('qText').textContent=q.question||'';if(q.word){$('qWord').textContent=q.word;$('qWord').classList.remove('hidden')}else $('qWord').classList.add('hidden');$('prevBtn').disabled=state.index===0;$('nextBtn').textContent=state.index===state.questions.length-1?'Finish':'Next →';$('markBtn').textContent=state.marked[q.id]?'★ Marked':'☆ Mark';$('masteredBtn').classList.toggle('hidden',state.meta.mode==='hindu');const list=$('optionList');list.innerHTML='';const a=state.answers[q.id];q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.disabled=!!a;b.innerHTML=`<span class="letter">${letters[i]}</span><span class="option-text"></span>`;b.querySelector('.option-text').textContent=opt.text;if(a){if(opt.key===a.correctKey)b.classList.add('correct');if(opt.key===a.selectedKey&&!a.correct)b.classList.add('wrong')}b.onclick=()=>choose(opt.key);list.appendChild(b)});renderExplanation(q,a);persist()}
  function choose(key){const q=current();if(state.answers[q.id])return;const secs=(Date.now()-state.startedAt)/1000,correctKey=String(q.correctKey||'').toUpperCase(),correct=key===correctKey;state.answers[q.id]={selectedKey:key,correctKey,correct,saving:state.meta.mode!=='hindu'};render();if(state.meta.mode==='hindu')return;EPApp.call('submitAnswer',{questionId:q.id,selectedKey:key,timeSeconds:secs,marked:!!state.marked[q.id]}).then(res=>{const a=state.answers[q.id];if(!a)return;a.saving=false;if(res&&res.correctKey&&String(res.correctKey).toUpperCase()!==a.correctKey){a.correctKey=String(res.correctKey).toUpperCase();a.correct=key===a.correctKey;if(current()&&current().id===q.id)render()}persist()}).catch(e=>{const a=state.answers[q.id];if(a)a.saving=false;persist();EPApp.toast('Answer shown, but save failed: '+e.message)})}
  function renderExplanation(q,a){const fb=$('feedback'),ex=$('explanation');if(!a){fb.classList.add('hidden');ex.classList.add('hidden');return}fb.textContent=a.correct?'✓ Correct':'✕ Incorrect';fb.className='feedback '+(a.correct?'good':'bad');const p=[];if(q.explanation)p.push(`<h3>Explanation</h3><p>${esc(q.explanation)}</p>`);if(q.example)p.push(`<h3>Example</h3><p>${esc(q.example)}</p>`);if(q.usageNote)p.push(`<h3>Usage</h3><p>${esc(q.usageNote)}</p>`);if(q.tip)p.push(`<div class="tipbox"><h3>Tip</h3><p>${esc(q.tip)}</p></div>`);if(q.memoryAid)p.push(`<h3>Remember</h3><p>${esc(q.memoryAid)}</p>`);if(q.related)p.push(`<h3>Related</h3><p>${esc(q.related)}</p>`);ex.innerHTML=p.join('')||'<p>Detailed explanation will be enhanced during content review.</p>';ex.classList.remove('hidden')}
  function previous(){if(state.index>0){state.index--;render();window.scrollTo({top:0,behavior:'smooth'})}}
  function next(){if(state.index<state.questions.length-1){state.index++;render();window.scrollTo({top:0,behavior:'smooth'})}else{clearSaved();EPApp.toast('Practice set completed.');EPApp.showTab(state.returnTab||'home')}}
  function back(){if(Object.keys(state.answers).length&&!confirm('Leave this practice set? You can resume it later from Home.'))return;persist();EPApp.showTab(state.returnTab||'home')}
  function pause(){persist();EPApp.toast('Paused. You can resume from Home.');EPApp.showTab('home')}
  function toggleMark(){if(state.meta.mode==='hindu')return;const q=current();state.marked[q.id]=!state.marked[q.id];$('markBtn').textContent=state.marked[q.id]?'★ Marked':'☆ Mark';persist();EPApp.call('setMarked',q.id,state.marked[q.id]).catch(()=>EPApp.toast('Could not update mark'))}
  function mastered(){const q=current();if(!confirm('Mark this as Mastered / Don’t Repeat? You can restore it later.'))return;EPApp.call('markMastered',q.id).then(()=>{EPApp.toast('Moved to Mastered');next()}).catch(e=>EPApp.toast('Could not mark mastered: '+e.message))}
  function persist(){if(!state.questions.length)return;try{localStorage.setItem(KEY,JSON.stringify({questions:state.questions,index:state.index,answers:state.answers,marked:state.marked,meta:state.meta,returnTab:state.returnTab,savedAt:Date.now()}))}catch(e){}}
  function clearSaved(){localStorage.removeItem(KEY);if(EPApp.refreshResumeCard)EPApp.refreshResumeCard()}
  function saved(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x||!Array.isArray(x.questions)||!x.questions.length)return null;return x}catch(e){return null}}
  function hasSavedSession(){return!!saved()}
  function getResumeSummary(){const s=saved();if(!s)return null;return{title:labelMode(s.meta||{},s.questions[s.index]||{}),index:Number(s.index||0),total:s.questions.length}}
  function resumeSaved(){const s=saved();if(!s){EPApp.toast('No paused session found.');return}state.questions=s.questions;state.index=Math.max(0,Math.min(Number(s.index||0),s.questions.length-1));state.answers=s.answers||{};state.marked=s.marked||{};state.meta=s.meta||{};state.returnTab=s.returnTab||inferReturnTab(state.meta.mode);openQuiz()}
  function isSameRequested(mode,opts){const s=saved();if(!s)return false;const m=s.meta||{};return m.mode===mode&&String(m.category||'')===String((opts&&opts.category)||'')&&String(m.source||'')===String((opts&&opts.source)||'')}
  function inferReturnTab(mode){if(mode==='category'||mode==='source')return'practice';if(['due','weak','recall'].includes(mode))return'revision';if(mode==='hindu')return'hindu';return'home'}
  function labelMode(meta,q){if(meta.mode==='daily')return'Daily Practice';if(meta.mode==='category')return q.topic||'Topic Practice';if(meta.mode==='source')return q.source||'Source Practice';if(meta.mode==='new')return'New Practice';if(meta.mode==='random')return'Random Practice';if(meta.mode==='recall')return'Recall Check';if(meta.mode==='weak')return'Weak / Wrong';if(meta.mode==='due')return'Due Revision';if(meta.mode==='hindu')return'The Hindu – Today';return'Practice'}
  function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  return{start,previous,next,back,pause,toggleMark,mastered,hasSavedSession,getResumeSummary,resumeSaved,isSameRequested};
})();
</script>
