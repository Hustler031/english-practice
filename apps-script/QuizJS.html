<script>
const EPQuiz=(()=>{
  const DAILY_KEY='ep-quiz-daily-v5',HINDU_KEY='ep-quiz-hindu-v1',OTHER_KEY='ep-quiz-other-v4',LEGACY_KEY='ep-quiz-session-v3';
  const state={questions:[],index:0,answers:{},marked:{},vocabAdded:{},startedAt:0,meta:{},returnTab:'home'};
  const $=id=>document.getElementById(id),letters=['A','B','C','D'];
  function keyForMode(mode){return mode==='daily'?DAILY_KEY:mode==='hindu'?HINDU_KEY:OTHER_KEY}
  function migrateLegacy(){try{if(localStorage.getItem(DAILY_KEY)||localStorage.getItem(HINDU_KEY)||localStorage.getItem(OTHER_KEY))return;const raw=localStorage.getItem(LEGACY_KEY);if(!raw)return;const x=JSON.parse(raw);if(x&&Array.isArray(x.questions)&&x.questions.length)localStorage.setItem(keyForMode(x.meta&&x.meta.mode),raw);localStorage.removeItem(LEGACY_KEY)}catch(e){}}
  function start(questions,meta){state.questions=questions;state.index=0;state.answers={};state.marked={};state.vocabAdded={};state.meta=meta||{};state.returnTab=state.meta.returnTab||inferReturnTab(state.meta.mode);openQuiz();persist()}
  function openQuiz(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('quizView').classList.remove('hidden');$('bottomNav').classList.add('hidden');render();window.scrollTo({top:0})}
  function current(){return state.questions[state.index]}
  function shouldShowWord(q){const word=String(q&&q.word||'').trim(),question=String(q&&q.question||'').trim();if(!word||!question)return false;return question.toLocaleLowerCase().includes(word.toLocaleLowerCase())}
  function render(){const q=current();if(!q)return;state.startedAt=Date.now();$('quizMode').textContent=labelMode(state.meta,q);$('quizCounter').textContent=`${state.index+1} / ${state.questions.length}`;$('quizBar').style.width=`${((state.index+1)/state.questions.length)*100}%`;$('qCategory').textContent=q.topic||q.category||'English';$('qId').textContent=q.id;$('qText').textContent=q.question||'';if(shouldShowWord(q)){$('qWord').textContent=q.word;$('qWord').classList.remove('hidden')}else{$('qWord').textContent='';$('qWord').classList.add('hidden')}$('prevBtn').disabled=state.index===0;$('nextBtn').textContent=state.index===state.questions.length-1?'Finish':'Next →';$('markBtn').textContent=state.marked[q.id]?'★ Marked':'☆ Mark';$('masteredBtn').classList.toggle('hidden',state.meta.mode==='hindu');const vb=$('vocabBtn');if(vb){vb.classList.toggle('hidden',state.meta.mode!=='hindu');vb.textContent=state.vocabAdded[q.id]?'✓ Saved to Vocab':'＋ Save to Vocab';vb.disabled=!!state.vocabAdded[q.id]}const list=$('optionList');list.innerHTML='';const a=state.answers[q.id];q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.disabled=!!a;b.innerHTML=`<span class="letter">${letters[i]}</span><span class="option-text"></span>`;b.querySelector('.option-text').textContent=opt.text;if(a){if(opt.key===a.correctKey)b.classList.add('correct');if(opt.key===a.selectedKey&&!a.correct)b.classList.add('wrong')}b.onclick=()=>choose(opt.key);list.appendChild(b)});renderExplanation(q,a);persist()}
  function choose(key){const q=current();if(state.answers[q.id])return;const secs=(Date.now()-state.startedAt)/1000,correctKey=String(q.correctKey||'').toUpperCase(),correct=key===correctKey;state.answers[q.id]={selectedKey:key,correctKey,correct,saving:true};render();if(state.meta.mode==='hindu'){EPApp.call('submitHinduAnswer',{questionId:q.id,selectedKey:key,correctKey,localCorrect:correct,timeSeconds:secs}).then(()=>{const a=state.answers[q.id];if(a)a.saving=false;persist()}).catch(e=>{const a=state.answers[q.id];if(a)a.saving=false;persist();EPApp.toast('Answer shown, but Hindu progress save failed: '+e.message)});return}EPApp.call('submitAnswer',{questionId:q.id,selectedKey:key,timeSeconds:secs,marked:!!state.marked[q.id]}).then(res=>{const a=state.answers[q.id];if(!a)return;a.saving=false;if(res&&res.correctKey&&String(res.correctKey).toUpperCase()!==a.correctKey){a.correctKey=String(res.correctKey).toUpperCase();a.correct=key===a.correctKey;if(current()&&current().id===q.id)render()}persist()}).catch(e=>{const a=state.answers[q.id];if(a)a.saving=false;persist();EPApp.toast('Answer shown, but save failed: '+e.message)})}
  function renderExplanation(q,a){const fb=$('feedback'),ex=$('explanation');if(!a){fb.classList.add('hidden');ex.classList.add('hidden');return}fb.textContent=a.correct?'✓ Correct':'✕ Incorrect';fb.className='feedback '+(a.correct?'good':'bad');const p=[];if(q.explanation)p.push(`<h3>Explanation</h3><p>${esc(q.explanation)}</p>`);if(q.example)p.push(`<h3>Example</h3><p>${esc(q.example)}</p>`);if(q.usageNote)p.push(`<h3>Usage</h3><p>${esc(q.usageNote)}</p>`);if(q.tip)p.push(`<div class="tipbox"><h3>Tip</h3><p>${esc(q.tip)}</p></div>`);if(q.memoryAid)p.push(`<h3>Remember</h3><p>${esc(q.memoryAid)}</p>`);if(q.related)p.push(`<h3>Related</h3><p>${esc(q.related)}</p>`);ex.innerHTML=p.join('')||'<p>Detailed explanation will be enhanced during content review.</p>';ex.classList.remove('hidden')}
  function previous(){if(state.index>0){state.index--;render();window.scrollTo({top:0,behavior:'smooth'})}}
  function next(){if(state.index<state.questions.length-1){state.index++;render();window.scrollTo({top:0,behavior:'smooth'})}else{clearCurrentSaved();EPApp.toast('Practice set completed.');EPApp.showTab(state.returnTab||'home');if(EPApp.refreshDashboard)EPApp.refreshDashboard()}}
  function back(){if(Object.keys(state.answers).length&&!confirm('Leave this practice set? You can resume it later.'))return;persist();EPApp.showTab(state.returnTab||'home');if((state.meta.mode==='daily'||state.meta.mode==='hindu')&&EPApp.refreshDashboard)EPApp.refreshDashboard()}
  function pause(){persist();EPApp.toast(state.meta.mode==='daily'?'Daily 120 paused safely.':state.meta.mode==='hindu'?'The Hindu practice paused safely.':'Practice paused safely.');EPApp.showTab('home');if((state.meta.mode==='daily'||state.meta.mode==='hindu')&&EPApp.refreshDashboard)EPApp.refreshDashboard()}
  function toggleMark(){const q=current();state.marked[q.id]=!state.marked[q.id];$('markBtn').textContent=state.marked[q.id]?'★ Marked':'☆ Mark';persist();const fn=state.meta.mode==='hindu'?'setHinduMarked':'setMarked';EPApp.call(fn,q.id,state.marked[q.id]).then(()=>EPApp.toast(state.marked[q.id]?'Marked for revision':'Mark removed')).catch(()=>EPApp.toast('Could not update mark'))}
  function addToVocab(){if(state.meta.mode!=='hindu')return;const q=current();if(!q||state.vocabAdded[q.id])return;EPApp.call('addHinduToVocab',q.id).then(()=>{state.vocabAdded[q.id]=true;persist();render();EPApp.toast('Saved to New Practice → Hindu Words')}).catch(e=>EPApp.toast('Could not save to vocab: '+e.message))}
  function mastered(){const q=current();if(!q)return;if(!confirm('Mark this as Mastered / Don’t Repeat? You can restore it later.'))return;const id=q.id;EPApp.toast('Moved to Mastered');if(state.index<state.questions.length-1){state.index++;render();window.scrollTo({top:0,behavior:'smooth'})}else{clearCurrentSaved();EPApp.showTab(state.returnTab||'home')}EPApp.call('markMastered',id).catch(e=>EPApp.toast('Mastered save failed: '+e.message))}
  function snapshot(){return{questions:state.questions,index:state.index,answers:state.answers,marked:state.marked,vocabAdded:state.vocabAdded,meta:state.meta,returnTab:state.returnTab,savedAt:Date.now()}}
  function persist(){if(!state.questions.length)return;try{localStorage.setItem(keyForMode(state.meta.mode),JSON.stringify(snapshot()))}catch(e){}if(EPApp.refreshResumeCard)EPApp.refreshResumeCard()}
  function clearCurrentSaved(){localStorage.removeItem(keyForMode(state.meta.mode));if(EPApp.refreshResumeCard)EPApp.refreshResumeCard()}
  function savedByKey(key){migrateLegacy();try{const x=JSON.parse(localStorage.getItem(key)||'null');if(!x||!Array.isArray(x.questions)||!x.questions.length)return null;return x}catch(e){return null}}
  function savedForMode(mode){return savedByKey(keyForMode(mode))}
  function summary(s){if(!s)return null;return{title:labelMode(s.meta||{},s.questions[s.index]||{}),index:Number(s.index||0),total:s.questions.length}}
  function getDailySummary(){return summary(savedByKey(DAILY_KEY))}function getOtherSummary(){return summary(savedByKey(OTHER_KEY))}function getHinduSummary(){return summary(savedByKey(HINDU_KEY))}
  function loadSaved(s){if(!s){EPApp.toast('No paused session found.');return}state.questions=s.questions;state.index=Math.max(0,Math.min(Number(s.index||0),s.questions.length-1));state.answers=s.answers||{};state.marked=s.marked||{};state.vocabAdded=s.vocabAdded||{};state.meta=s.meta||{};state.returnTab=s.returnTab||inferReturnTab(state.meta.mode);openQuiz()}
  function resumeDaily(){EPApp.startDirect('daily')}function resumeOther(){loadSaved(savedByKey(OTHER_KEY))}function resumeHindu(){EPApp.startHinduQuiz()}function hasSavedSessionFor(mode){return!!savedForMode(mode)}
  function isSameRequested(mode,opts){const s=savedForMode(mode);if(!s)return false;const m=s.meta||{},o=opts||{};return m.mode===mode&&String(m.category||'')===String(o.category||'')&&String(m.source||'')===String(o.source||'')&&String(m.batchId||'')===String(o.batchId||'')}
  function replaceSavedFor(mode){localStorage.removeItem(keyForMode(mode));if(EPApp.refreshResumeCard)EPApp.refreshResumeCard()}
  function inferReturnTab(mode){if(mode==='category'||mode==='source')return'practice';if(mode==='demand')return'demanded';if(['due','weak','recall'].includes(mode))return'revision';if(mode==='hindu')return'hindu';return'home'}
  function labelMode(meta,q){if(meta.mode==='daily')return'Daily Practice';if(meta.mode==='category')return q.topic||'Topic Practice';if(meta.mode==='source')return q.source||'Source Practice';if(meta.mode==='demand')return meta.title||'Demanded Practice';if(meta.mode==='new'||meta.mode==='newPractice')return'New Practice';if(meta.mode==='random')return'Random Practice';if(meta.mode==='recall')return'Recall Check';if(meta.mode==='weak')return'Weak / Wrong';if(meta.mode==='due')return'Due Revision';if(meta.mode==='hindu')return'The Hindu – Today';return'Practice'}
  function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
  return{start,previous,next,back,pause,toggleMark,addToVocab,mastered,getDailySummary,getOtherSummary,getHinduSummary,resumeDaily,resumeOther,resumeHindu,hasSavedSessionFor,isSameRequested,replaceSavedFor};
})();
</script>
