<script>
const EPBankCoverage=(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let hub=null,loading=false;
  function ensure(){
    if(!$('bankCoverageView')){const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverage.back()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional first-pass exposure. It never blocks Daily Practice.</p></div></div><div id="bankCoverageBody"></div>';document.getElementById('main')?.appendChild(s)}
    if(!$('bankCoverageStyles')){const st=document.createElement('style');st.id='bankCoverageStyles';st.textContent='.bank-hero{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:12px}.bank-hero b{font-size:22px}.bank-grid{display:grid;gap:9px}.bank-row{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--card)}.bank-row .bank-line{display:flex;justify-content:space-between;gap:10px;align-items:center}.bank-row .bank-stats{font-size:11px;color:var(--muted);margin-top:5px}.bank-row .coverage-bar{margin-top:9px}.bank-full{font-weight:900;color:var(--ok)}';document.head.appendChild(st)}
  }
  function show(){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$('bankCoverageView')?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function render(){const el=$('bankCoverageBody');if(!el||!hub)return;el.innerHTML=`<div class="bank-hero"><div class="muted">BANK EXPOSED</div><b>${Number(hub.percent||0).toFixed(1).replace('.0','')}%</b><div class="muted">${Number(hub.exposed||0)} / ${Number(hub.total||0)} unique questions exposed</div>${hub.fullyExposed?'<div class="bank-full" style="margin-top:8px">BANK FULLY EXPOSED ✅</div>':''}</div><div class="bank-grid">${(hub.categories||[]).map(c=>`<div class="bank-row"><div class="bank-line"><div><b>${esc(c.topic)}</b><div class="bank-stats">${Number(c.availableToday||0)} new today · ${Number(c.exposed||0)} / ${Number(c.total||0)} exposed · ${Number(c.coveragePercent||0).toFixed(1).replace('.0','')}%</div></div><button class="btn soft mini" ${Number(c.availableToday||0)?'':'disabled'} onclick='EPBankCoverage.start(${JSON.stringify(String(c.topic||''))})'>${Number(c.availableToday||0)?'Start':'Done'}</button></div><div class="coverage-bar small"><i style="width:${Math.max(0,Math.min(100,Number(c.coveragePercent||0)))}%"></i></div>${!Number(c.unseen||0)?'<div class="bank-full" style="font-size:11px">BANK FULLY EXPOSED ✅</div>':''}</div>`).join('')}</div>`}
  async function open(){ensure();show();const el=$('bankCoverageBody');if(!hub&&el)el.innerHTML='<div class="list-card"><div class="muted">Checking unseen questions…</div></div>';try{hub=await EPApp.call('getBankCoverageHub');render()}catch(e){if(el)el.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`}}
  function back(){$('bankCoverageView')?.classList.add('hidden');EPApp.showTab('home')}
  async function start(topic){if(loading)return;loading=true;try{const qs=await EPApp.call('getBankCoverageBatch',topic);if(!qs.length){EPApp.toast('No unseen Bank Coverage questions left for today.');hub=await EPApp.call('getBankCoverageHub');render();return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'bankCoverage',title:'Bank Coverage · '+topic,batchId:'bank-'+new Date().toISOString().slice(0,10)+'-'+topic,returnTab:'home'})}catch(e){EPApp.toast('Could not load Bank Coverage: '+(e.message||e))}finally{loading=false}}
  document.addEventListener('DOMContentLoaded',ensure);
  return{open,back,start};
})();
</script>
