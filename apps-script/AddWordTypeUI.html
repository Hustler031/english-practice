<script>
(()=>{
  const TYPES=[['V','V','Vocabulary'],['SM','SM','Spelling Mistake'],['OWS','OWS','One Word Substitution'],['PV','PV','Phrasal Verb'],['IP','I/P','Idiom / Phrase']];
  let quickType='V',captureType='V';
  const $=id=>document.getElementById(id);
  function chips(kind){return `<div class="awt-label">Type</div><div class="awt-chips" data-awt-kind="${kind}">${TYPES.map(([value,label,title])=>`<button type="button" class="awt-chip ${value==='V'?'selected':''}" data-type="${value}" title="${title}" onclick="EPAddWordType.choose('${kind}','${value}')">${label}</button>`).join('')}</div><div class="awt-help" id="awtHelp-${kind}">Vocabulary</div>`}
  function ensure(){
    if(!$('addWordTypeStyles')){const st=document.createElement('style');st.id='addWordTypeStyles';st.textContent='.awt-label{font-size:11px;font-weight:800;color:var(--muted);margin:11px 0 6px}.awt-chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.awt-chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;min-height:36px;font-weight:850;font-size:11px;padding:5px 2px}.awt-chip.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--primary)}.awt-help{font-size:10px;color:var(--muted);margin-top:5px}@media(max-width:360px){.awt-chip{font-size:10px}}';document.head.appendChild(st)}
    const q=$('quickWordInput');if(q&&!$('quickWordTypeMount')){const d=document.createElement('div');d.id='quickWordTypeMount';d.innerHTML=chips('quick');q.insertAdjacentElement('afterend',d)}
    const c=$('captureWord');if(c&&!$('captureWordTypeMount')){const d=document.createElement('div');d.id='captureWordTypeMount';d.innerHTML=chips('capture');c.insertAdjacentElement('afterend',d)}
  }
  function label(type){return (TYPES.find(x=>x[0]===type)||TYPES[0])[2]}
  function choose(kind,type){type=TYPES.some(x=>x[0]===type)?type:'V';if(kind==='capture')captureType=type;else quickType=type;document.querySelectorAll(`[data-awt-kind="${kind}"] .awt-chip`).forEach(b=>b.classList.toggle('selected',b.dataset.type===type));const h=$(`awtHelp-${kind}`);if(h)h.textContent=label(type)}
  function reset(kind){choose(kind,'V')}
  function install(){ensure();
    if(window.EPMyWordsUX&&!EPMyWordsUX.__typedCapture){
      const oldQuick=EPMyWordsUX.quickAdd;
      EPMyWordsUX.quickAdd=function(){ensure();reset('quick');return oldQuick.apply(this,arguments)};
      EPMyWordsUX.saveQuick=function(){const word=String($('quickWordInput')?.value||'').trim();if(!word){EPApp.toast('Enter a word first.');return}const btn=$('quickWordSaveBtn');if(btn){btn.disabled=true;btn.textContent='Saved ✓'}EPMyWordsUX.closeQuick();EPApp.toast('Saved ✓');EPApp.call('captureMyWordTyped',{word,context:'',questionId:'',module:'Dashboard Quick Add',source:'Dashboard',captureType:quickType}).then(()=>{if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub');EPFast.drop('new:hub')}if(btn){btn.disabled=false;btn.textContent='Save'}}).catch(e=>{if(btn){btn.disabled=false;btn.textContent='Save'}EPApp.toast('Could not save word: '+e.message)})};
      EPMyWordsUX.__typedCapture=true;
    }
    if(window.EPSaved&&!EPSaved.__typedCapture){
      const oldOpen=EPSaved.openCapture;
      EPSaved.openCapture=function(){ensure();reset('capture');return oldOpen.apply(this,arguments)};
      EPSaved.saveCapture=function(){const word=String($('captureWord')?.value||'').trim();if(!word){EPApp.toast('Enter a word first.');return}const payload={word,context:String($('qText')?.textContent||'').trim(),questionId:String($('qId')?.textContent||'').trim(),module:String($('quizMode')?.textContent||'').trim(),source:String($('qCategory')?.textContent||'').trim(),captureType};EPSaved.closeCapture();EPApp.toast('Saved ✓');EPApp.call('captureMyWordTyped',payload).then(()=>{if(window.EPFast){EPFast.drop('saved:words');EPFast.drop('saved:hub');EPFast.drop('new:hub')}}).catch(e=>EPApp.toast('Could not save word: '+e.message))};
      EPSaved.__typedCapture=true;
    }
  }
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(install,0)});
  window.EPAddWordType={choose,ensure,install};
})();
</script>
<script>
(()=>{
  function hardenFinalLearning(){
    if(typeof EPApp!=='undefined'&&!EPApp.__masteryGuardWired){EPApp.__masteryGuardWired=true;const call=EPApp.call.bind(EPApp);EPApp.call=function(fn,...args){return call(fn==='markMastered'?'markMasteredV2':fn,...args)}}
    if(typeof EPQuiz!=='undefined'&&!EPQuiz.__finalModeWired){EPQuiz.__finalModeWired=true;const start=EPQuiz.start;EPQuiz.start=function(qs,meta){const r=start.apply(this,arguments);const mode=String(meta&&meta.mode||'');document.body.dataset.finalQuizMode=mode;if((mode==='mySavedRevision'||mode==='bankCoverage')&&window.EPStarredRevision)setTimeout(()=>EPStarredRevision.setDifficultQuizContext(qs,true),0);return r}}
    if(!document.getElementById('finalLearningModeStyles')){const st=document.createElement('style');st.id='finalLearningModeStyles';st.textContent='body[data-final-quiz-mode="bankCoverage"] #starredMasteredWrap{display:none!important}';document.head.appendChild(st)}
    try{const p=JSON.parse(localStorage.getItem('ep-progress-snapshot-v1')||'null');if(p&&!Object.prototype.hasOwnProperty.call(p,'firstAttemptAccuracy')){localStorage.removeItem('ep-progress-snapshot-v1');localStorage.removeItem('ep-progress-refresh-ts-v1');if(window.EPFast)EPFast.drop('progress')}}catch(e){}
    setTimeout(()=>window.EPPerformanceUI?.refresh(),1200);
    const note=document.getElementById('dailyNote');if(note){const fix=()=>{if(/Fresh-first:/i.test(note.textContent||''))note.textContent='Adaptive Daily: persistent weak → weak → fragile → due spaced revision → controlled new material.'};fix();new MutationObserver(fix).observe(note,{childList:true,characterData:true,subtree:true})}
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(hardenFinalLearning,0));
})();
</script>
