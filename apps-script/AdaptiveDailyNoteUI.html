<script>
(()=>{
  let last=null,loading=false;
  function apply(b){last=b||last;const di=last&&last.dailyInfo,n=document.getElementById('dailyNote');if(!n||!di||!di.adaptive||di.pendingFromPrevious)return;n.textContent=`Adaptive mix: ${Number(di.persistentWeakCount||0)} persistent weak · ${Number(di.weakCount||0)} weak · ${Number(di.fragileCount||0)} fragile · ${Number(di.dueCount||0)} due · ${Number(di.freshCount||0)} controlled new.`}
  async function refresh(){if(loading||typeof EPApp==='undefined'||!EPApp.call)return;loading=true;try{const b=await EPApp.call('getBootstrapV3');apply(b)}catch(e){}finally{loading=false}}
  function init(){setTimeout(refresh,250);const n=document.getElementById('dailyNote');if(n)new MutationObserver(()=>{if(last)setTimeout(()=>apply(last),0)}).observe(n,{childList:true,characterData:true,subtree:true});if(typeof EPApp!=='undefined'&&!EPApp.__adaptiveDailyNoteWired){EPApp.__adaptiveDailyNoteWired=true;const old=EPApp.refreshDashboard;if(typeof old==='function')EPApp.refreshDashboard=async function(){const r=await old.apply(this,arguments);setTimeout(refresh,0);return r}}}
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
