<script>
(()=>{
  const $=id=>document.getElementById(id);
  const BANK_KEY='ep:bankCoverage:hub:v3',SAVED_KEY='ep:mySavedRevision:hub:v3';
  let starredOrigin='home',bankOrigin='home',savedOrigin='revision',wordsOrigin='revision',hinduOrigin='home',sourceOrigin='practice',organizeTimer=0,wrapped=false;
  const readSnap=k=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v&&v.data?v.data:v}catch(e){return null}};
  const ensureOrder=(parent,items)=>{if(!parent)return;const wanted=(items||[]).filter(Boolean),existing=[...parent.children].filter(x=>wanted.includes(x)),same=existing.length===wanted.length&&existing.every((x,i)=>x===wanted[i]);if(!same)wanted.forEach(x=>parent.appendChild(x))};
  function ensureStyles(){if($('navigationPolishStyles'))return;const s=document.createElement('style');s.id='navigationPolishStyles';s.textContent=`
    .ui-home-quick{display:grid!important;grid-template-columns:30px minmax(0,1fr) auto 16px!important;align-items:center!important;gap:10px!important;border-left-width:3px!important;box-shadow:none!important}.ui-home-quick:after{content:'›';font-size:21px;color:var(--muted);line-height:1}.ui-home-quick>span:first-child{font-size:20px}.ui-home-quick>span:nth-child(2){display:block!important}.ui-home-quick>span:nth-child(2)>small{display:none!important}.ui-home-quick>.ui-quick-status{font-size:10px;font-weight:850;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.ui-accent-hindu{border-left-color:var(--warn)!important}.ui-accent-starred{border-left-color:var(--warn)!important}.ui-accent-bank{border-left-color:var(--primary)!important}.ui-accent-saved{border-left-color:color-mix(in srgb,var(--primary) 65%,#9a63d8)!important}.ui-accent-phrasal{border-left-color:color-mix(in srgb,var(--ok) 70%,var(--primary))!important}.ui-quick-add-mini{min-height:30px!important;padding:5px 9px!important;font-size:10px!important;white-space:nowrap}
    .ui-section{display:grid;gap:9px;margin-top:14px}.ui-section-title{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:8px 2px 1px}.ui-section .list-card,.ui-section .feature-card{position:relative;padding-right:34px}.ui-section>.list-card:after,.ui-section>.feature-card:after{content:'›';position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:21px;color:var(--muted)}
    .nav button.active{background:var(--primary2);border-radius:12px;color:var(--primary);font-weight:900}.progressbar{background:var(--line)!important}html[data-theme="dark"] .hero{background:linear-gradient(135deg,#253b8f,#433f92)}
    @media(max-width:390px){.ui-home-quick{grid-template-columns:28px minmax(0,1fr) auto 14px!important;gap:8px!important}.ui-home-quick>.ui-quick-status{font-size:9px;padding:4px 6px}.ui-quick-add-mini{padding:4px 7px!important;font-size:9px!important}}
  `;document.head.appendChild(s)}
  function makeCard(html,onclick,className='list-card'){const d=document.createElement('div');d.className=className;d.innerHTML=html;d.onclick=onclick;return d}
  function makeQuick(icon,label,status,action,accent,id){const b=document.createElement('button');b.className=`btn ghost quick-btn ui-home-quick ${accent||''}`;if(id)b.id=id;b.innerHTML=`<span>${icon}</span><span><b>${label}</b></span><small class="ui-quick-status">${status}</small>`;b.onclick=action;return b}
  function normalizeQuick(card,accent){if(!card)return null;card.classList.add('ui-home-quick',accent);const content=card.querySelector('span:nth-child(2)');let status=content?.querySelector('small');if(status){status.classList.add('ui-quick-status');card.appendChild(status)}else if(!card.querySelector(':scope > .ui-quick-status')){status=document.createElement('small');status.className='ui-quick-status';status.textContent='Open';card.appendChild(status)}return card}
  function quickStatus(card,text){const s=card?.querySelector(':scope > .ui-quick-status');if(s&&text&&s.textContent!==text)s.textContent=text}
  function updateQuickStatuses(){
    const hindu=$('homeHinduQuick'),star=$('homeStarredQuick'),bank=$('homeBankQuick'),saved=$('homeSavedQuick'),phrasal=$('homePhrasalQuick');
    const hinduText=String($('hinduCount')?.textContent||'').trim();if(hindu&&hinduText&&!/loading/i.test(hinduText))quickStatus(hindu,hinduText);
    const sh=window.EPFast?.get?.('starred:hub');if(star&&sh?.stats){const focus=Number(sh.stats.focus||0),diff=Number(sh.stats.difficult||0);quickStatus(star,`${focus} focus${diff?' · '+diff+' ⚡':''}`)}
    const bh=readSnap(BANK_KEY);if(bank&&bh)quickStatus(bank,`${Number(bh.coverage||0).toFixed(0)}% exposed`);
    const mh=readSnap(SAVED_KEY);if(saved&&mh?.stats)quickStatus(saved,`${Number(mh.stats.focus ?? mh.stats.saved ?? 0)} active`);
    if(phrasal&&window.EPPhrasalMastery)quickStatus(phrasal,'Smart + Today’s 15');
  }
  function decorateStarredStats(){const summary=$('starredRevisionBody')?.querySelector('.sr-summary .sr-stats'),hub=window.EPFast?.get?.('starred:hub');if(!summary||!hub?.stats)return;let chip=summary.querySelector('[data-ui-difficult-count]');if(!chip){chip=document.createElement('span');chip.dataset.uiDifficultCount='1';summary.appendChild(chip)}const html=`<b>${Number(hub.stats.difficult||0)}</b> Difficult`;if(chip.innerHTML!==html)chip.innerHTML=html}
  function organizeHome(){
    const home=$('homeView');if(!home)return;const head=[...home.querySelectorAll('.row.between')].find(x=>String(x.textContent||'').includes('Quick Start')),grid=head?.nextElementSibling;if(!head||!grid)return;
    let addMini=head.querySelector('button');if(!addMini){addMini=document.createElement('button');head.appendChild(addMini)}addMini.id='homeAddWordMini';addMini.className='btn soft mini ui-quick-add-mini';addMini.textContent='＋ Add Word';addMini.onclick=()=>window.EPMyWordsUX?.quickAdd?.();
    let hindu=[...grid.querySelectorAll('.quick-btn')].find(x=>String(x.textContent||'').includes('The Hindu'));
    let starred=[...grid.querySelectorAll('.quick-btn')].find(x=>String(x.textContent||'').includes('Starred Revision'));
    let bank=[...grid.querySelectorAll('.quick-btn')].find(x=>String(x.textContent||'').includes('Bank Coverage'));
    [...grid.querySelectorAll('.quick-btn')].filter(x=>/Random Practice|Recall Check|New Practice|^\s*＋\s*Add Word/.test(String(x.textContent||''))).forEach(x=>x.remove());
    if(hindu){hindu.id='homeHinduQuick';hindu.onclick=()=>openHindu('home');normalizeQuick(hindu,'ui-accent-hindu')}
    if(starred){starred.id='homeStarredQuick';starred.onclick=()=>openStarred('home');normalizeQuick(starred,'ui-accent-starred')}
    if(bank){bank.id='homeBankQuick';bank.onclick=()=>openBank('home');normalizeQuick(bank,'ui-accent-bank')}
    if(!hindu)hindu=makeQuick('📰','The Hindu – Today','Today',()=>openHindu('home'),'ui-accent-hindu','homeHinduQuick');
    if(!starred)starred=makeQuick('⭐','Starred Revision','Open',()=>openStarred('home'),'ui-accent-starred','homeStarredQuick');
    if(!bank)bank=makeQuick('◫','Bank Coverage','Open',()=>openBank('home'),'ui-accent-bank','homeBankQuick');
    let saved=$('homeSavedQuick');if(!saved)saved=makeQuick('🔖','My Saved Words','Open',()=>openSaved('home'),'ui-accent-saved','homeSavedQuick');
    let phrasal=$('homePhrasalQuick');if(!phrasal)phrasal=makeQuick('↗','Phrasal Verb','Smart + Today’s 15',()=>openPhrasal('home'),'ui-accent-phrasal','homePhrasalQuick');
    ensureOrder(grid,[hindu,saved,phrasal,starred,bank]);updateQuickStatuses();
  }
  function organizePractice(){
    const v=$('practiceView');if(!v)return;const intro=v.querySelector(':scope > p.muted');let explore=$('uiPracticeExplore'),focused=$('uiPracticeFocused');
    if(!explore){explore=document.createElement('div');explore.id='uiPracticeExplore';explore.className='ui-section';explore.innerHTML='<div class="ui-section-title">Explore</div>';explore.appendChild(makeCard('<b>✨ New Practice</b><div class="muted">Recently added content by category</div>',()=>EPApp.openNewPractice()));explore.appendChild(makeCard('<b>◫ Bank Coverage</b><div class="muted">Explore unseen genuine-bank questions</div>',()=>openBank('practice')));intro?.insertAdjacentElement('afterend',explore)}
    if(!focused){focused=document.createElement('div');focused.id='uiPracticeFocused';focused.className='ui-section';focused.innerHTML='<div class="ui-section-title">Focused Practice</div>';v.appendChild(focused)}
    const topic=v.querySelector('#topicGrid'),topicHead=[...v.querySelectorAll('h3')].find(x=>String(x.textContent||'').includes('Topic Practice')),source=[...v.querySelectorAll('.list-card')].find(x=>String(x.textContent||'').includes('Source / PDF')),demand=[...v.querySelectorAll('.list-card')].find(x=>String(x.textContent||'').includes('Demanded Practice'));
    if(source)source.onclick=()=>openSources('practice');ensureOrder(focused,[topicHead,topic,source,demand]);
  }
  function organizeRevision(){
    const v=$('revisionView'),list=v?.querySelector('.list');if(!list)return;let needs=$('uiRevisionNeeds'),personal=$('uiRevisionPersonal');
    const cards=[...v.querySelectorAll('.list-card')],find=t=>cards.find(x=>String(x.textContent||'').includes(t));
    const due=find('Due Today'),weak=find('Weak / Wrong'),difficult=cards.find(x=>x.id==='centralDifficultCard'||/^\s*⚡\s*Difficult/i.test(String(x.textContent||'').trim())),recall=find('Seen Before'),saved=find('My Saved'),mastered=find('Mastered');let starred=find('Starred Revision');
    if(!starred)starred=makeCard('<b>⭐ Starred Revision</b><div class="muted">Day-wise central starred review</div>',()=>openStarred('revision'));
    if(!needs){needs=document.createElement('div');needs.id='uiRevisionNeeds';needs.className='ui-section';needs.innerHTML='<div class="ui-section-title">Needs Attention</div>';list.prepend(needs)}
    if(!personal){personal=document.createElement('div');personal.id='uiRevisionPersonal';personal.className='ui-section';personal.innerHTML='<div class="ui-section-title">Personal Revision</div>';list.appendChild(personal)}
    ensureOrder(needs,[due,weak,starred,difficult,recall]);ensureOrder(personal,[saved,mastered]);
  }
  function organizeLibrary(){
    const v=$('libraryView'),list=v?.querySelector('.list');if(!list)return;const intro=v.querySelector(':scope > p.muted');if(intro&&intro.textContent!=='Your saved words and study sources.')intro.textContent='Your saved words and study sources.';
    const cards=[...list.querySelectorAll('.list-card')],find=t=>cards.find(x=>String(x.textContent||'').includes(t)),hindu=find('The Hindu Vocabulary'),source=find('Sources / PDFs');cards.filter(x=>/Demanded Practice|Recall Check|Mastered/.test(String(x.textContent||''))).forEach(x=>x.remove());
    let words=$('libraryMyWordsCard');if(!words){words=makeCard('<b>📝 My Words</b><div class="muted">View and manage every word you captured</div>',()=>openWords('library'));words.id='libraryMyWordsCard'}
    let phrasal=$('libraryPhrasalCard');if(!phrasal){phrasal=makeCard('<b>↗ Phrasal Verb</b><div class="muted">Today’s 15 · Smart Revision · permanent concept history</div>',()=>openPhrasal('library'));phrasal.id='libraryPhrasalCard'}
    if(source)source.onclick=()=>openSources('library');if(hindu)hindu.onclick=()=>openHindu('library');ensureOrder(list,[words,phrasal,source,hindu]);
  }
  function fixBackButtons(){const nb=$('newView')?.querySelector('.subhead button');if(nb)nb.onclick=()=>EPApp.showTab('practice')}
  function wrapBacks(){if(wrapped)return;wrapped=true;
    if(window.EPStarredRevision?.back){const old=window.EPStarredRevision.back.bind(window.EPStarredRevision);window.EPStarredRevision.back=function(){const o=starredOrigin;starredOrigin='home';if(o==='revision'){$('starredRevisionView')?.classList.add('hidden');EPApp.showTab('revision');return}return old()}}
    if(window.EPBankCoverage?.back){const old=window.EPBankCoverage.back.bind(window.EPBankCoverage);window.EPBankCoverage.back=function(){const o=bankOrigin;bankOrigin='home';if(o==='practice'){$('bankCoverageCategoryView')?.classList.add('hidden');$('bankCoverageView')?.classList.add('hidden');EPApp.showTab('practice');return}return old()}}
    if(window.EPMySavedRevision?.back){const old=window.EPMySavedRevision.back.bind(window.EPMySavedRevision);window.EPMySavedRevision.back=function(){const o=savedOrigin;savedOrigin='revision';if(o==='home'){$('mySavedRevisionView')?.classList.add('hidden');EPApp.showTab('home');return}return old()}}
    if(window.EPMyWordsUX?.back){const old=window.EPMyWordsUX.back.bind(window.EPMyWordsUX);window.EPMyWordsUX.back=function(){const o=wordsOrigin;wordsOrigin='revision';if(o==='library'){$('myWordsListView')?.classList.add('hidden');EPApp.showTab('library');return}return old()}}
  }
  function openStarred(origin){starredOrigin=origin||'home';window.EPStarredRevision?.open?.()}
  function openBank(origin){bankOrigin=origin||'home';const api=window.EPBankCoverageUX?.open?window.EPBankCoverageUX:window.EPBankCoverage;api?.open?.()}
  function openSaved(origin){savedOrigin=origin||'revision';window.EPMySavedRevision?.open?.()}
  function openWords(origin){wordsOrigin=origin||'revision';window.EPMyWordsUX?.open?.()}
  function openPhrasal(origin){window.EPPhrasalMastery?.open?.(origin||'home')}
  function openHindu(origin){hinduOrigin=origin||'home';EPApp.openHindu();setTimeout(()=>{const b=$('hinduView')?.querySelector('.subhead button');if(b)b.onclick=()=>EPApp.showTab(hinduOrigin==='library'?'library':'home')},0)}
  function openSources(origin){sourceOrigin=origin||'practice';EPApp.openSources();setTimeout(()=>{const b=$('sourcesView')?.querySelector('.subhead button');if(b)b.onclick=()=>EPApp.showTab(sourceOrigin==='library'?'library':'practice')},0)}
  function organizeAll(){ensureStyles();organizeHome();organizePractice();organizeRevision();organizeLibrary();fixBackButtons();wrapBacks();updateQuickStatuses();decorateStarredStats()}
  function schedule(){clearTimeout(organizeTimer);organizeTimer=setTimeout(organizeAll,80)}
  function init(){organizeAll();setTimeout(organizeAll,180);const mo=new MutationObserver(schedule);mo.observe(document.body,{childList:true,subtree:true});const h=$('homeView');if(h)new MutationObserver(()=>{if(!h.classList.contains('hidden'))setTimeout(updateQuickStatuses,0)}).observe(h,{attributes:true,attributeFilter:['class']});const hc=$('hinduCount');if(hc)new MutationObserver(updateQuickStatuses).observe(hc,{childList:true,subtree:true,characterData:true})}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(init,120));
  window.EPUIPolish={openStarred,openBank,openSaved,openWords,openPhrasal,openHindu,openSources,refresh:updateQuickStatuses};
})();
</script>
