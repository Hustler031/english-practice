<script>
const EPStarredIntelligence=window.EPStarredIntelligence=(()=>{
  const $=id=>document.getElementById(id),OTHER_KEY='ep-quiz-other-v4';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let hub=null,scope={all:true,fromDay:1,toDay:999999,label:'All Starred'},batchSize=20,requestSeq=0,refreshTimer=0,summaryRefreshTimer=0,snapshotDirty=true;
  const snapshots=new Map(),openSections=new Set();

  function ensure(){
    if(!$('starredIntelligenceView')){const s=document.createElement('section');s.id='starredIntelligenceView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPStarredIntelligence.back()">← Back</button><div><h2>⭐ Starred Intelligence</h2><p class="muted">Adaptive revision inside your current Central Starred bank only.</p></div></div><div id="starredIntelligenceBody"></div>';$('main')?.appendChild(s)}
    if(!$('starredIntelligenceSummaryView')){const s=document.createElement('section');s.id='starredIntelligenceSummaryView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPStarredIntelligence.open()">← Intelligence</button><div><h2>Session Complete</h2><p class="muted">Starred Revision session summary</p></div></div><div id="starredIntelligenceSummaryBody"></div>';$('main')?.appendChild(s)}
    if(!$('starredIntelligenceInfo')){const w=document.createElement('div');w.id='starredIntelligenceInfo';w.className='sheet-backdrop hidden';w.onclick=e=>{if(e.target===w)closeInfo()};w.innerHTML='<div class="sheet" onclick="event.stopPropagation()"><div class="row between"><h3 id="starredIntelligenceInfoTitle" style="margin:0">About</h3><button class="btn ghost mini" onclick="EPStarredIntelligence.closeInfo()">Close</button></div><div id="starredIntelligenceInfoBody" class="muted" style="margin-top:10px;line-height:1.55"></div></div>';document.body.appendChild(w)}
    if(!$('starredIntelligenceStyles')){const st=document.createElement('style');st.id='starredIntelligenceStyles';st.textContent=`
      .si-entry{margin-top:9px}.si-recommended{padding:15px;border:1px solid color-mix(in srgb,var(--primary) 24%,var(--line));border-radius:17px;background:color-mix(in srgb,var(--primary) 5%,var(--card))}.si-title-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:start}.si-title-row h3{margin:0}.si-info-btn{width:30px;height:30px;min-height:30px;padding:0;border-radius:999px;font-weight:900}.si-counts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.si-chip{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:11px;font-weight:800;background:var(--card)}.si-size-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.si-size-row button{min-height:36px}.si-size-row button.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--text)}.si-fold{border:1px solid var(--line);border-radius:15px;background:var(--card);margin-top:10px;overflow:hidden}.si-fold>summary{list-style:none;cursor:pointer;padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}.si-fold>summary::-webkit-details-marker{display:none}.si-fold>summary .si-chev{font-size:18px;color:var(--muted)}.si-fold[open]>summary .si-chev{transform:rotate(90deg)}.si-fold-body{padding:0 12px 12px;border-top:1px solid var(--line)}.si-meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:9px 0}.si-meter i{display:block;height:100%;background:var(--primary)}.si-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.si-mini{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}.si-mini b{display:block;font-size:15px}.si-mini small{display:block;color:var(--muted);margin-top:3px}.si-mode{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.si-mode:last-child{border-bottom:0}.si-mode .muted{font-size:11px;margin-top:3px}.si-scope select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);padding:8px 10px;font:inherit}.si-reason-badge{margin-left:auto;font-size:10px;font-weight:850;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:var(--card);white-space:nowrap}.si-sync{padding:18px;text-align:center}.si-summary-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.si-summary-stat>div{text-align:center;border:1px solid var(--line);border-radius:13px;padding:12px 6px;background:var(--card)}.si-summary-stat b{display:block;font-size:20px}.si-summary-stat span{font-size:10px;color:var(--muted)}@media(max-width:380px){.si-grid{grid-template-columns:1fr}.si-mode{grid-template-columns:1fr}.si-mode .btn{width:100%}.si-reason-badge{max-width:46%;overflow:hidden;text-overflow:ellipsis}.si-fold>summary{grid-template-columns:minmax(0,1fr) auto auto}.si-title-row{grid-template-columns:minmax(0,1fr) auto}}
    `;document.head.appendChild(st)}
  }

  function show(id){ensure();document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$(id)?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function starPending(){try{return Number(window.EPStarReliability?.pending?.()||0)}catch(e){return 0}}
  function wait(ms){return new Promise(r=>setTimeout(r,ms))}
  async function ensureStarsSynced(){let n=starPending();if(!n)return true;window.EPStarReliability?.flush?.();const started=Date.now();while(n&&Date.now()-started<6000){await wait(300);n=starPending()}return n===0}
  function pendingMessage(){const body=$('starredIntelligenceBody');if(body)body.innerHTML='<div class="card si-sync"><b>Syncing pending Star changes…</b><div class="muted" style="margin-top:6px">Smart Revision waits for Central Star state so an unstarred question can never enter a new recommendation.</div></div>'}
  function scopeKey(s){s=s||scope;return s.all?'all':`${Number(s.fromDay||1)}-${Number(s.toDay||1)}`}
  function rememberSnapshot(fresh){if(!fresh)return;scope=Object.assign({},fresh.scope||scope);hub=fresh;snapshots.set(scopeKey(scope),fresh);snapshotDirty=false}
  function invalidateSnapshot(){snapshotDirty=true;snapshots.clear()}
  function currentPlan(){return hub?.smartBySize?.[batchSize]||hub?.smartBySize?.[String(batchSize)]||{count:0,composition:{},items:[]}}

  function compositionChips(c){const x=[['Persistent Weak',c?.persistentWeak],['Weak / Fragile',c?.weakFragile],['Due',c?.due],['Difficult',c?.difficult],['Learning',c?.learning],['Rotation',c?.coverageRotation]].filter(a=>Number(a[1]||0)>0);return x.map(a=>`<span class="si-chip">${Number(a[1])} ${esc(a[0])}</span>`).join('')||'<span class="si-chip">No eligible questions</span>'}
  function sizeButtons(){return [10,20,30,50].map(n=>`<button class="btn ghost mini ${batchSize===n?'active':''}" onclick="EPStarredIntelligence.setSize(${n})">${n}</button>`).join('')}
  function modeRow(icon,title,desc,mode,available){return `<div class="si-mode"><div><b>${icon} ${esc(title)}</b><div class="muted">${esc(desc)} · ${Number(available||0)} eligible</div></div><button class="btn soft mini" ${available?'':'disabled'} onclick="EPStarredIntelligence.start('${mode}')">Start ${Math.min(batchSize,Number(available||0))||''}</button></div>`}
  function scopeOptionsHtml(){return (hub?.scopeOptions||[]).map(x=>{const s=x.scope||{},key=scopeKey(s);return `<option value="${esc(key)}" ${key===scopeKey(scope)?'selected':''}>${esc(x.label)}</option>`}).join('')}
  function sectionOpen(name){return openSections.has(name)?' open':''}
  function sectionToggle(name,isOpen){if(isOpen)openSections.add(name);else openSections.delete(name)}
  function infoButton(kind,label){return `<button class="btn ghost mini si-info-btn" aria-label="${esc(label||'More information')}" onclick="event.preventDefault();event.stopPropagation();EPStarredIntelligence.info('${kind}')">ⓘ</button>`}

  function render(){
    const body=$('starredIntelligenceBody');if(!body||!hub)return;const c=hub.coverage||{},h=hub.health||{},r=hub.rotation||{},a=hub.available||{},plan=currentPlan(),pct=Math.max(0,Math.min(100,Number(c.percent||0)));
    body.innerHTML=`
      <div class="si-recommended"><div class="si-title-row"><div><h3>Recommended Now — ${Number(plan.count||0)}</h3><div class="muted" style="margin-top:4px"><b>Focus:</b> ${esc(hub.focus||'Balanced retention + rotation')}</div></div><span class="tag">${esc(hub.scope?.label||'All Starred')}</span>${infoButton('recommended','Why this Smart set?')}</div><div class="si-counts">${compositionChips(plan.composition)}</div><div class="si-size-row">${sizeButtons()}</div><button class="btn primary full" ${plan.count?'':'disabled'} onclick="EPStarredIntelligence.start('smart')">Start Recommended ${Number(plan.count||0)}</button></div>

      <details class="si-fold" data-si-section="coverage"${sectionOpen('coverage')} ontoggle="EPStarredIntelligence.sectionToggle('coverage',this.open)"><summary><div><b>Starred Coverage ›</b><div class="muted">${Number(c.revised||0)} / ${Number(c.activeStarred||0)} · ${pct.toFixed(1)}%</div></div>${infoButton('coverage','About Starred Coverage')}<span class="si-chev">›</span></summary><div class="si-fold-body"><div class="si-meter"><i style="width:${pct}%"></i></div><div class="si-grid"><div class="si-mini"><b>${Number(c.activeStarred||0)}</b><small>Active Starred</small></div><div class="si-mini"><b>${Number(c.revised||0)}</b><small>Revised</small></div><div class="si-mini"><b>${Number(c.neverRevised||0)}</b><small>Never Revised</small></div><div class="si-mini"><b>${Number(c.revisedOnce||0)}</b><small>Revised Once</small></div><div class="si-mini"><b>${Number(c.revisedMultiple||0)}</b><small>Revised Multiple</small></div><div class="si-mini"><b>${Number(c.longOverdue||0)}</b><small>Long Overdue</small></div></div></div></details>

      <details class="si-fold" data-si-section="health"${sectionOpen('health')} ontoggle="EPStarredIntelligence.sectionToggle('health',this.open)"><summary><div><b>Learning Health ›</b><div class="muted">${Number(h.persistentWeak||0)} PW · ${Number(h.weak||0)} Weak · ${Number(h.fragile||0)} Fragile · ${Number(h.due||0)} Due</div></div>${infoButton('health','About Learning Health')}<span class="si-chev">›</span></summary><div class="si-fold-body"><div class="si-grid"><div class="si-mini"><b>${Number(h.persistentWeak||0)}</b><small>🔴 Persistent Weak</small></div><div class="si-mini"><b>${Number(h.weak||0)}</b><small>🟠 Weak</small></div><div class="si-mini"><b>${Number(h.fragile||0)}</b><small>🟡 Fragile</small></div><div class="si-mini"><b>${Number(h.due||0)}</b><small>⏰ Due</small></div><div class="si-mini"><b>${Number(h.difficult||0)}</b><small>⚡ Difficult</small></div><div class="si-mini"><b>${Number(h.strong||0)}</b><small>🟢 Strong</small></div><div class="si-mini"><b>${Number(h.learning||0)+Number(h.newCount||0)}</b><small>Learning / New</small></div></div></div></details>

      <details class="si-fold" data-si-section="practice"${sectionOpen('practice')} ontoggle="EPStarredIntelligence.sectionToggle('practice',this.open)"><summary><div><b>Smart Practice ›</b><div class="muted">6 intelligent modes</div></div>${infoButton('practice','About Smart Practice modes')}<span class="si-chev">›</span></summary><div class="si-fold-body">${modeRow('🧠','Smart Mix','Learning priority + coverage rotation','smart',a.smart)}${modeRow('🆕','Not Revised','Zero genuine Starred Revision attempts','notRevised',a.notRevised)}${modeRow('⏰','Due Now','Central spaced-review clock is due','due',a.due)}${modeRow('🔴','Weak Focus','Persistent Weak → Weak → Fragile','weak',a.weak)}${modeRow('⚡','Difficult','Manual Central Difficult only','difficult',a.difficult)}${modeRow('🔄','Longest Not Revised','Never revised first, then oldest Starred attempt','longest',a.longest)}</div></details>

      <details class="si-fold" data-si-section="rotation"${sectionOpen('rotation')} ontoggle="EPStarredIntelligence.sectionToggle('rotation',this.open)"><summary><div><b>Rotation Health ›</b><div class="muted">${Number(r.neverRevised||0)} Never Revised · Priority ${esc(r.priority||'Healthy')}</div></div>${infoButton('rotation','About rotation and cooldown')}<span class="si-chev">›</span></summary><div class="si-fold-body"><div class="si-grid"><div class="si-mini"><b>${Number(r.neverRevised||0)}</b><small>Never Revised</small></div><div class="si-mini"><b>${Number(r.days7Plus||0)}</b><small>Not revised 7+ days</small></div><div class="si-mini"><b>${Number(r.days14Plus||0)}</b><small>Not revised 14+ days</small></div><div class="si-mini"><b>${Number(hub.cooldown?.recent||0)}</b><small>Recent 24h Smart cooldown</small></div></div></div></details>

      <details class="si-fold si-scope" data-si-section="scope"${sectionOpen('scope')} ontoggle="EPStarredIntelligence.sectionToggle('scope',this.open)"><summary><div><b>Day-wise Intelligence ›</b><div class="muted">${esc(hub.scope?.label||'All Starred')}</div></div>${infoButton('scope','About Starred scope filtering')}<span class="si-chev">›</span></summary><div class="si-fold-body"><select id="starredIntelligenceScope" onchange="EPStarredIntelligence.changeScope(this.value)">${scopeOptionsHtml()}</select></div></details>`;
  }

  function info(kind){ensure();const title=$('starredIntelligenceInfoTitle'),body=$('starredIntelligenceInfoBody');const texts={recommended:['Recommended Now',`Smart Mix balances central learning risk with coverage rotation. Questions attempted through Starred Revision within the last 24 hours are normally held back when enough alternatives exist. Current rationale: ${hub?.recommendation||'Balanced revision.'}`],coverage:['Starred Coverage','Revised means at least one genuine Performance attempt with Module = starredRevision. It is separate from Bank Coverage and central New status.'],health:['Learning Health','These are the existing central learning states. Starred Intelligence reads them; it does not create separate Weak, Fragile, Persistent Weak, Strong or Mastered definitions.'],practice:['Smart Practice','Smart Mix balances urgency and rotation. Not Revised means zero Starred Revision attempts. Due uses the central review clock. Weak Focus uses central Persistent Weak / Weak / Fragile. Difficult remains manual. Longest Not Revised is the anti-starvation queue.'],rotation:['Rotation Health','Never Revised and oldest Starred Revision attempts receive rotation priority. A soft 24-hour cooldown prevents immediate Smart repeats when enough alternatives exist; it is not a stored learning state and can be used as fallback when needed to fill a set.'],scope:['Day-wise Intelligence','Current Starred, Active and non-Mastered eligibility is restricted to the selected Starred Day / Block / Month scope before ranking.']};const x=texts[kind]||['Starred Intelligence',''];if(title)title.textContent=x[0];if(body)body.textContent=x[1];$('starredIntelligenceInfo')?.classList.remove('hidden')}
  function closeInfo(){$('starredIntelligenceInfo')?.classList.add('hidden')}

  async function load(force=false){
    const key=scopeKey(scope),cached=!snapshotDirty?snapshots.get(key):null;if(!force&&cached){hub=cached;render();return cached}
    const seq=++requestSeq,body=$('starredIntelligenceBody');if(body&&!hub)body.innerHTML='<div class="list-card"><div class="muted">Preparing Starred Intelligence…</div></div>';
    try{const fresh=await EPApp.call('getStarredIntelligenceSnapshotV2',scope);if(seq!==requestSeq)return null;rememberSnapshot(fresh);render();return fresh}catch(e){if(seq!==requestSeq)return null;if(body)body.innerHTML=`<div class="empty card">${esc(e.message||e)}</div>`;return null}
  }

  async function open(){ensure();show('starredIntelligenceView');if(starPending()){pendingMessage();const ok=await ensureStarsSynced();if(!ok){const body=$('starredIntelligenceBody');if(body)body.innerHTML='<div class="card si-sync"><b>Star sync is still pending</b><div class="muted" style="margin:6px 0 12px">Reconnect or retry after Central Star changes finish syncing. Smart Revision will not use a stale Star eligibility set.</div><button class="btn primary" onclick="EPStarredIntelligence.retryOpen()">Retry</button></div>';return}}const cached=!snapshotDirty?snapshots.get(scopeKey(scope)):null;if(cached){hub=cached;render();return}await load(true)}
  function retryOpen(){open()}
  function back(){requestSeq++;openSections.clear();$('starredIntelligenceView')?.classList.add('hidden');EPStarredRevision.open()}
  function setSize(n){batchSize=[10,20,30,50].includes(Number(n))?Number(n):20;render()}
  function changeScope(value){const hit=(hub?.scopeOptions||[]).find(x=>scopeKey(x.scope)===String(value));if(!hit)return;requestSeq++;scope=Object.assign({},hit.scope||{});const cached=!snapshotDirty?snapshots.get(scopeKey(scope)):null;if(cached){hub=cached;render();return}hub=null;load(true)}

  function smartBatchId(mode){return `si-${scopeKey(scope)}-${String(mode||'smart')}-${batchSize}`}
  function candidateList(mode){if(!hub)return[];const m=String(mode||'smart'),pool=(hub.modePools?.[m]||[]).slice();if(m!=='smart')return pool;const selected=(currentPlan().items||[]).slice(),ids=new Set(selected.map(x=>String(x.id||'')));return selected.concat(pool.filter(x=>!ids.has(String(x.id||''))))}
  async function ensureFreshSnapshot(){if(!hub||snapshotDirty||scopeKey(hub.scope)!==scopeKey(scope))return await load(true);return hub}
  async function preparedQuestions(mode,retry){
    const candidates=candidateList(mode);const res=await EPApp.call('getStarredIntelligencePreparedBatchV2',scope,mode,batchSize,candidates,hub?.generatedAt||'');if(res?.needsRefresh&&retry){invalidateSnapshot();await load(true);if(!hub)return[];return preparedQuestions(mode,false)}return res?.questions||[];
  }
  async function start(mode){
    if(!(await ensureStarsSynced())){EPApp.toast?.('Pending Star changes must sync before Smart Revision starts.');return}if(!(await ensureFreshSnapshot()))return;
    const batchId=smartBatchId(mode),opts={batchId};if(EPQuiz.hasSavedSessionFor('starredRevision')){if(EPQuiz.isSameRequested('starredRevision',opts)){EPQuiz.resumeOther();return}if(!confirm('A paused extra practice set exists. Start this Smart Starred set and replace it?'))return;EPQuiz.replaceSavedFor('starredRevision')}
    window.EPFast?.showQuizLoading?.('Verifying Starred eligibility…');
    try{const qs=await preparedQuestions(mode,true);if(!qs?.length){EPApp.toast?.('No eligible Starred questions in this mode and scope.');return}document.body.classList.add('quiz-active');$('bottomNav')?.classList.add('hidden');EPQuiz.start(qs,{mode:'starredRevision',title:'Starred Intelligence',batchId,returnTab:'home',smartStarred:true,smartMode:String(mode||'smart'),smartScope:scope,smartCoverageBefore:hub?.coverage||null,smartHealthBefore:hub?.health||null,smartRotationBefore:hub?.rotation||null})}catch(e){EPApp.toast?.('Could not load Starred Intelligence: '+String(e&&e.message||e))}finally{window.EPFast?.hideQuizLoading?.()}
  }

  function readSmartSession(){try{const s=JSON.parse(localStorage.getItem(OTHER_KEY)||'null');return s&&s.meta?.mode==='starredRevision'&&s.meta?.smartStarred===true?s:null}catch(e){return null}}
  function currentSmartQuestion(){const s=readSmartSession(),id=String($('qId')?.textContent||'').trim();if(!s||!id)return null;return (s.questions||[]).find(q=>String(q?.id||'')===id)||null}
  function syncReasonBadge(){const meta=document.querySelector('#quizView .meta');if(!meta)return;let b=$('starredIntelligenceReason');const q=currentSmartQuestion();if(!q){b?.remove();return}if(!b){b=document.createElement('span');b.id='starredIntelligenceReason';b.className='si-reason-badge';meta.appendChild(b)}b.textContent=String(q.smartStarredReason||'Smart Revision')}

  function buildSessionSummary(s){const answers=s?.answers||{},questions=s?.questions||[],answered=questions.filter(q=>Object.prototype.hasOwnProperty.call(answers,String(q.id||''))),correct=answered.filter(q=>answers[q.id]?.correct).length,wrong=answered.length-correct,rotation=answered.filter(q=>q.smartStarredLane==='rotation').length,never=answered.filter(q=>q.smartStarredNeverRevised).length,weakCorrect=answered.filter(q=>['Persistent Weak','Weak','Fragile'].includes(String(q.smartStarredBaselineState||''))&&answers[q.id]?.correct).length,retentionFailures=answered.filter(q=>(q.smartStarredSignals||[]).includes('Due Recall')&&!answers[q.id]?.correct).length;return {attempted:answered.length,correct,wrong,rotation,never,weakCorrect,retentionFailures,meta:s.meta||{}}}
  function showSummary(sum){show('starredIntelligenceSummaryView');const body=$('starredIntelligenceSummaryBody'),before=sum.meta?.smartCoverageBefore||{};if(!body)return;body.innerHTML=`<div class="si-summary-stat"><div><b>${sum.attempted}</b><span>Attempted</span></div><div><b>${sum.correct}</b><span>Correct</span></div><div><b>${sum.wrong}</b><span>Wrong</span></div></div><div class="si-fold-body si-card" style="border:1px solid var(--line);border-radius:15px;margin-top:10px"><b>What this session covered</b><div class="si-grid"><div class="si-mini"><b>${sum.weakCorrect}</b><small>Weak / Fragile items correct</small></div><div class="si-mini"><b>${sum.retentionFailures}</b><small>Due-retention failures</small></div><div class="si-mini"><b>${sum.rotation}</b><small>Coverage-rotation questions</small></div><div class="si-mini"><b>${sum.never}</b><small>Previously Never Revised</small></div></div></div><div id="starredIntelligenceCoverageAfter" class="si-fold-body si-card" style="border:1px solid var(--line);border-radius:15px;margin-top:10px"><b>Starred Coverage</b><div class="muted" style="margin-top:5px">Before this session: ${Number(before.percent||0).toFixed(1)}%. Waiting for durable saves…</div></div><div id="starredIntelligenceNextAction" class="si-fold-body si-card" style="border:1px solid var(--line);border-radius:15px;margin-top:10px"><b>Next Smart Set</b><div class="muted" style="margin-top:5px">Preparing the confirmed next recommendation after saves finish.</div></div><button class="btn primary full" style="margin-top:10px" onclick="EPStarredIntelligence.open()">Back to Starred Intelligence</button>`;refreshSummaryAfterDurable(sum,0)}
  function refreshSummaryAfterDurable(sum,tries){clearTimeout(summaryRefreshTimer);if(!$('starredIntelligenceSummaryView')||$('starredIntelligenceSummaryView').classList.contains('hidden'))return;const pending=Number(window.EPSaveReliability?.pending?.()||0);if(pending&&tries<50){window.EPSaveReliability?.flush?.();summaryRefreshTimer=setTimeout(()=>refreshSummaryAfterDurable(sum,tries+1),600);return}if(pending)return;EPApp.call('getStarredIntelligenceSnapshotV2',sum.meta?.smartScope||{all:true}).then(fresh=>{rememberSnapshot(fresh);const before=sum.meta?.smartCoverageBefore||{},after=fresh?.coverage||{},plan=fresh?.smartBySize?.[batchSize]||fresh?.smartBySize?.[String(batchSize)]||{},c=$('starredIntelligenceCoverageAfter'),n=$('starredIntelligenceNextAction');if(c)c.innerHTML=`<b>Starred Coverage</b><div class="muted" style="margin-top:5px">${Number(before.percent||0).toFixed(1)}% → ${Number(after.percent||0).toFixed(1)}% · ${Number(after.revised||0)} / ${Number(after.activeStarred||0)} revised</div>`;if(n)n.innerHTML=`<b>Next Smart Set Ready</b><div class="muted" style="margin-top:5px">Next Recommended: ${Number(plan.count||0)} Questions</div><div class="si-counts">${compositionChips(plan.composition)}</div>`}).catch(()=>{summaryRefreshTimer=setTimeout(()=>refreshSummaryAfterDurable(sum,tries+1),1200)})}

  function wireFinish(){if(typeof EPQuiz==='undefined'||EPQuiz.__starredIntelligenceFinishV1)return;EPQuiz.__starredIntelligenceFinishV1=true;const raw=EPQuiz.next;EPQuiz.next=function(){const s=readSmartSession(),last=String($('nextBtn')?.textContent||'').trim()==='Finish';if(s&&last){const sum=buildSessionSummary(s),r=raw.apply(this,arguments);setTimeout(()=>showSummary(sum),40);return r}return raw.apply(this,arguments)}}
  function injectEntry(){const summary=document.querySelector('#starredRevisionBody > .sr-summary');if(!summary||$('starredIntelligenceEntry'))return;const b=document.createElement('button');b.id='starredIntelligenceEntry';b.className='btn primary full si-entry';b.type='button';b.textContent='🧠 Smart Revision';b.onclick=e=>{e.preventDefault();e.stopPropagation();open()};summary.appendChild(b)}
