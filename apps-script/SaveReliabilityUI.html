<script>
(()=>{
  const OUTBOX_KEY='ep-answer-outbox-v3',BANK_DIRTY='ep:bankCoverage:dirty:v1',SAVED_DIRTY='ep:mySavedRevision:dirty:v1',STAR_ORIGIN_CACHE='ep:starred-origin-ui:v4';
  let running=false,wakeTimer=0,currentQ='',activeMs=0,visibleAt=0;
  const $=id=>document.getElementById(id);
  const direct=(fn,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message||err||'Save failed')))[fn](...args));
  function readQueue(){try{const q=JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]');return Array.isArray(q)?q:[]}catch(e){return[]}}
  function writeQueue(q){try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(q||[]));return true}catch(e){return false}}
  function resetTimer(){currentQ=String($('qId')?.textContent||'').trim();activeMs=0;visibleAt=document.hidden?0:Date.now()}
  function stopTimer(){if(visibleAt){activeMs+=Math.max(0,Date.now()-visibleAt);visibleAt=0}}
  function activeSeconds(id,fallback){if(String(id||'')!==currentQ)return Math.min(180,Math.max(0,Number(fallback||0)));const ms=activeMs+(visibleAt?Math.max(0,Date.now()-visibleAt):0);return Math.min(180,Math.max(0,ms/1000))}
  function sessionForQuestion(id){for(const key of ['ep-quiz-daily-v5','ep-quiz-hindu-v1','ep-quiz-other-v4']){try{const s=JSON.parse(localStorage.getItem(key)||'null'),q=s&&Array.isArray(s.questions)?s.questions[Number(s.index||0)]:null;if(q&&String(q.id||'')===String(id||''))return s}catch(e){}}return null}
  function moduleForQuestion(id){const s=sessionForQuestion(id),m=String(s&&s.meta&&s.meta.mode||'').trim();if(m)return m;const title=String($('quizMode')?.textContent||'').toLowerCase();if(title.includes('bank coverage'))return'bankCoverage';if(title.includes('my saved'))return'mySavedRevision';if(title.includes('starred'))return'starredRevision';if(title.includes('hindu'))return'hindu';if(title.includes('daily'))return'daily';if(title.includes('difficult'))return'difficult';return'practice'}
  function makeAttemptId(id){return String(id||'Q').trim()+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
  function invalidateLearningCaches(){try{localStorage.setItem(BANK_DIRTY,'1');localStorage.setItem(SAVED_DIRTY,'1')}catch(e){}if(window.EPFast&&EPFast.drop){['new:hub','topic:hub','source:hub','demand:hub','demand:stats','starred:hub','progress'].forEach(k=>EPFast.drop(k))}}
  function enqueue(fn,payload){
    const p=Object.assign({},payload||{}),id=String(p.questionId||'').trim();if(!id)return null;p.module=fn.indexOf('Hindu')>=0?'hindu':moduleForQuestion(id);p.timeSeconds=activeSeconds(id,p.timeSeconds);p.attemptId=String(p.attemptId||'').trim()||makeAttemptId(id);p.answeredAt=p.answeredAt||new Date().toISOString();
    const endpoint=fn.indexOf('Hindu')>=0?'submitHinduAnswerV3':'submitAnswerV3',q=readQueue();if(!q.some(x=>x&&x.attemptId===p.attemptId))q.push({attemptId:p.attemptId,endpoint,payload:p,tries:0,nextAt:0,queuedAt:Date.now()});if(!writeQueue(q))return null;invalidateLearningCaches();flushSoon(0);return Promise.resolve({ok:true,queued:true,attemptId:p.attemptId,correctKey:String(p.correctKey||'')});
  }
  function backoff(tries){const steps=[1000,2500,5000,15000,30000,60000];return steps[Math.min(steps.length-1,Math.max(0,Number(tries||1)-1))]}
  function flushSoon(ms){clearTimeout(wakeTimer);wakeTimer=setTimeout(flush,Math.max(0,Number(ms||0)))}
  async function flush(){
    if(running)return;running=true;
    try{
      const q=readQueue();if(!q.length){setTimeout(()=>direct('repairPendingLearningDerivationsV3',5).catch(()=>{}),0);return}
      const item=q[0],wait=Math.max(0,Number(item.nextAt||0)-Date.now());if(wait>0){flushSoon(Math.min(wait,60000));return}
      try{
        const res=await direct(item.endpoint,item.payload);if(!res||res.durable!==true)throw new Error('Server did not confirm durable save');const latest=readQueue().filter(x=>x&&x.attemptId!==item.attemptId);writeQueue(latest);invalidateLearningCaches();flushSoon(0);
      }catch(e){
        const latest=readQueue(),i=latest.findIndex(x=>x&&x.attemptId===item.attemptId);if(i>=0){latest[i].tries=Number(latest[i].tries||0)+1;latest[i].lastError=String(e&&e.message||e);latest[i].nextAt=Date.now()+backoff(latest[i].tries);writeQueue(latest);flushSoon(backoff(latest[i].tries))}
      }
    }finally{running=false}
  }
  function wire(){
    if(typeof EPApp==='undefined'||!EPApp.call||EPApp.__saveReliabilityV3)return;EPApp.__saveReliabilityV3=true;const raw=EPApp.call.bind(EPApp),centralReads={getMySavedHub:'getMySavedHubCentralV3',getStarredQuestionList:'getStarredQuestionListCentralV3',getStarredPracticeBatch:'getStarredPracticeBatchCentralV3',getStarredRevisionHub:'getStarredRevisionHubStableV4',getStarredRevisionGroup:'getStarredRevisionGroupStableV4',getStarredRevisionItems:'getStarredRevisionItemsStableV4',getStarredRevisionBatch:'getStarredRevisionBatchStableV4'};
    EPApp.call=function(fn,...args){
      if(fn==='logStarredRevisionFromUi')return Promise.resolve({ok:true,skippedLegacyDuplicate:true});
      if(['submitAnswer','submitAnswerV2','submitHinduAnswer','submitHinduAnswerV2'].includes(fn)){const queued=enqueue(fn,args[0]);if(queued)return queued;return raw(fn,...args)}
      if(centralReads[fn])return raw(centralReads[fn],...args);
      return raw(fn,...args);
    };
    try{if(localStorage.getItem(STAR_ORIGIN_CACHE)!=='1'){localStorage.setItem(STAR_ORIGIN_CACHE,'1');if(window.EPFast&&EPFast.drop)EPFast.drop('starred:hub')}}catch(e){}
    const q=$('qId');if(q)new MutationObserver(()=>resetTimer()).observe(q,{childList:true,subtree:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimer();else{visibleAt=Date.now();flushSoon(0)}});window.addEventListener('online',()=>flushSoon(0));setInterval(()=>{if(readQueue().length)flushSoon(0)},30000);resetTimer();flushSoon(0);setTimeout(()=>direct('repairPendingLearningDerivationsV3',5).catch(()=>{}),2500);
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(wire,20));
  window.EPSaveReliability={flush:()=>flushSoon(0),pending:()=>readQueue().length,inspect:()=>readQueue().map(x=>({attemptId:x.attemptId,endpoint:x.endpoint,tries:x.tries,nextAt:x.nextAt,queuedAt:x.queuedAt}))};
})();
</script>
