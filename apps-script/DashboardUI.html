<script>
(()=>{
  let refreshing=false,progressLoading=false,lastProgress=null,progressRefreshTimer=null;
  const DAILY_SESSION_KEY='ep-quiz-daily-v5',DAILY_BASE_KEY='ep-daily-ui-base-v1';
  const PROGRESS_SNAPSHOT_KEY='ep-progress-snapshot-v1',PROGRESS_TS_KEY='ep-progress-refresh-ts-v1';
  const PROGRESS_REFRESH_MS=60*60*1000;
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
  const pct=v=>Math.max(0,Math.min(100,Number(v||0)));
  const fmt=v=>Number(v||0).toFixed(Number(v||0)%1?1:0);
  async function refreshTodayBadge(){if(refreshing||typeof EPApp==='undefined'||!EPApp.call)return;const badge=document.getElementById('todayDoneBadge');if(!badge)return;refreshing=true;try{const x=await EPApp.call('getTodayActivityCount');badge.textContent=`✓ ${Number(x&&x.count||0)} today`;badge.classList.remove('hidden')}catch(e){}finally{refreshing=false}}
  function revealDailyControls(){const hero=document.querySelector('#homeView .hero'),title=hero&&hero.querySelector('h2');if(hero&&title&&/^Day\s+\d+/.test(title.textContent||''))hero.classList.add('daily-ready')}
  function parseDailyProgress(){const txt=String(document.getElementById('dailyProgress')?.textContent||''),m=txt.match(/(\d+)\s*\/\s*(\d+)/);return m?{done:Number(m[1]),total:Number(m[2])}:null}
  function rememberDailyBase(){const p=parseDailyProgress();if(p)try{sessionStorage.setItem(DAILY_BASE_KEY,JSON.stringify(p))}catch(e){}}
  function optimisticDailyProgress(){let base=null,saved=null;try{base=JSON.parse(sessionStorage.getItem(DAILY_BASE_KEY)||'null');saved=JSON.parse(localStorage.getItem(DAILY_SESSION_KEY)||'null')}catch(e){}if(!base||!saved||saved.meta?.mode!=='daily')return;const answered=Object.keys(saved.answers||{}).length,total=Math.max(1,Number(base.total||0)),done=Math.min(total,Number(base.done||0)+answered),text=document.getElementById('dailyProgress'),bar=document.getElementById('dailyBar');if(text)text.textContent=`${done} / ${total}`;if(bar)bar.style.width=`${Math.min(100,done*100/total)}%`}
  function stripHtml(p){return `<div class="mastery-strip"><span>Coverage ${fmt(p?.percent)}%</span><i>·</i><span>✓ ${fmt(p?.correctPercent)}%</span><i>·</i><span>🟢 ${fmt(p?.confidentPercent)}%</span><i>·</i><span>? ${fmt(p?.doubtPercent)}%</span></div>`}
  const moduleMap={practiceView:'practice',newView:'new',hinduView:'hindu',demandedView:'demanded',sourcesView:'sources',savedView:'saved'};
  function moduleMetric(p,key){return p&&p.modules&&p.modules[key]?p.modules[key]:null}
  function placeStrip(view,metric){if(!view||!metric)return;let el=view.querySelector(':scope > .mastery-strip');if(!el){el=document.createElement('div');el.className='mastery-strip';view.prepend(el)}el.outerHTML=stripHtml(metric)}
  function ensureModuleStrips(p){if(!p||p.pending)return;lastProgress=p;Object.entries(moduleMap).forEach(([id,key])=>{const v=document.getElementById(id),metric=moduleMetric(p,key);if(v&&metric)placeStrip(v,metric)});const topic=document.getElementById('topicPracticeView');if(topic)placeStrip(topic,moduleMetric(p,'practice')||p)}
  function ensureProgressShell(){if(document.getElementById('progressView'))return;const main=document.getElementById('main');if(!main)return;const section=document.createElement('section');section.id='progressView';section.className='app-page content hidden';section.innerHTML='<h2>Progress</h2><p class="muted">Coverage = seen at least once. ✓ Correct = first-time correct, or recovered after an initial wrong with 3 consecutive correct answers. 🟢 Confident excludes currently starred questions. ? Doubt is the qualified-correct portion you still keep starred.</p><div id="progressSummary" class="card progress-summary"></div><h3 class="section-title">Category Progress</h3><div id="progressList" class="progress-list"></div>';main.appendChild(section);const nav=document.getElementById('bottomNav');if(nav&&!nav.querySelector('[data-tab="progress"]')){const b=document.createElement('button');b.className='bottom-tab';b.dataset.tab='progress';b.innerHTML='<b>◔</b>Progress';b.onclick=()=>EPApp.showTab('progress');nav.appendChild(b)}const style=document.createElement('style');style.textContent='.nav{grid-template-columns:repeat(5,1fr)!important}.mastery-strip{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:11px;font-weight:800;color:var(--muted);padding:7px 8px;margin:0 0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}.mastery-strip i{font-style:normal;opacity:.55}.progress-summary{display:grid;gap:10px}.progress-overall{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.progress-overall>div{display:grid;gap:3px;text-align:center}.progress-overall span,.progress-meta,.progress-today{font-size:11px;color:var(--muted)}.progress-overall b{font-size:17px}.coverage-bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.coverage-bar i{display:block;height:100%;background:var(--ok);border-radius:999px}.coverage-bar.small{height:7px;margin:9px 0 6px}.progress-list{display:grid;gap:10px}.progress-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.progress-card strong{font-size:13px}.progress-today{text-align:center}.category-metrics{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom-tab[data-tab="progress"] b{font-size:19px}@media(max-width:370px){.mastery-strip{font-size:10px;gap:3px;padding-left:5px;padding-right:5px}.progress-overall b{font-size:15px}}';document.head.appendChild(style)}
  function getProgressSnapshot(){try{const p=JSON.parse(localStorage.getItem(PROGRESS_SNAPSHOT_KEY)||'null');return p&&p.pending?null:p}catch(e){return null}}
  function saveProgressSnapshot(p){if(!p||p.pending)return;try{localStorage.setItem(PROGRESS_SNAPSHOT_KEY,JSON.stringify(p));localStorage.setItem(PROGRESS_TS_KEY,String(Date.now()))}catch(e){}}
  function progressAge(){try{return Date.now()-Number(localStorage.getItem(PROGRESS_TS_KEY)||0)}catch(e){return Infinity}}
  function renderProgress(p){const list=document.getElementById('progressList'),summary=document.getElementById('progressSummary');if(!list||!summary||!p||p.pending)return;lastProgress=p;ensureModuleStrips(p);summary.innerHTML=`<div class="progress-overall"><div><span>Coverage</span><b>${fmt(p.percent)}%</b></div><div><span>✓ Correct</span><b>${fmt(p.correctPercent)}%</b></div><div><span>🟢 Confident</span><b>${fmt(p.confidentPercent)}%</b></div><div><span>? Doubt</span><b>${fmt(p.doubtPercent)}%</b></div></div><div class="coverage-bar"><i style="width:${pct(p.percent)}%"></i></div><div class="progress-today">${Number(p.encountered||0)} / ${Number(p.total||0)} encountered · ${Number(p.left||0)} left · accuracy snapshot refreshes hourly</div>`;const rows=p.categories||[];list.innerHTML=rows.length?rows.map(c=>`<article class="progress-card"><div class="row between"><b>${esc(c.name)}</b><strong>${Number(c.encountered||0)} / ${Number(c.total||0)}</strong></div><div class="coverage-bar small"><i style="width:${pct(c.percent)}%"></i></div><div class="category-metrics">Coverage ${fmt(c.percent)}% · ✓ ${fmt(c.correctPercent)}% · 🟢 ${fmt(c.confidentPercent)}% · ? ${fmt(c.doubtPercent)}%</div></article>`).join(''):'<div class="empty card">No active questions available yet.</div>'}
  function cachedProgress(){const p=(window.EPFast&&EPFast.get('progress'))||lastProgress||getProgressSnapshot();return p&&p.pending?null:p}
  async function fetchProgressFresh(){if(progressLoading||typeof EPApp==='undefined'||!EPApp.call)return cachedProgress();progressLoading=true;try{const p=await EPApp.call('getEncounterProgress');if(p&&p.pending){const summary=document.getElementById('progressSummary');if(summary&&!cachedProgress())summary.innerHTML='<div class="muted">Preparing the first shared progress snapshot in the background… You can keep using the app.</div>';clearTimeout(progressRefreshTimer);progressRefreshTimer=setTimeout(()=>fetchProgressFresh(),15000);return cachedProgress()}if(p){if(window.EPFast)EPFast.set('progress',p);saveProgressSnapshot(p);renderProgress(p);return p}return cachedProgress()}catch(e){clearTimeout(progressRefreshTimer);progressRefreshTimer=setTimeout(()=>fetchProgressFresh(),30000);return cachedProgress()}finally{progressLoading=false}}
  function scheduleProgressRefresh(delay=1800,force=false){clearTimeout(progressRefreshTimer);const cached=cachedProgress();if(cached){renderProgress(cached);ensureModuleStrips(cached)}if(!force&&cached&&progressAge()<PROGRESS_REFRESH_MS)return;progressRefreshTimer=setTimeout(()=>fetchProgressFresh(),delay)}
  function loadProgress(){const cached=cachedProgress();if(cached){renderProgress(cached);scheduleProgressRefresh(2500,false);return}const summary=document.getElementById('progressSummary');if(summary)summary.innerHTML='<div class="muted">Checking the latest shared progress snapshot…</div>';fetchProgressFresh()}
  function refreshStrips(){const cached=cachedProgress();if(cached)ensureModuleStrips(cached)}
  function markProgressDirty(){/* Accuracy is intentionally not recalculated after every quiz. The hourly server snapshot keeps navigation instant. */}
  function init(){ensureProgressShell();const snap=cachedProgress();if(snap){renderProgress(snap);ensureModuleStrips(snap)}refreshTodayBadge();revealDailyControls();setTimeout(refreshStrips,100);const hero=document.querySelector('#homeView .hero');if(hero)new MutationObserver(revealDailyControls).observe(hero,{subtree:true,childList:true,characterData:true});if(typeof EPApp!=='undefined'&&!EPApp.__dashboardUiWired){EPApp.__dashboardUiWired=true;const originalShow=EPApp.showTab;EPApp.showTab=function(name){const progress=document.getElementById('progressView');if(name==='progress'){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));document.getElementById('quizView')?.classList.add('hidden');document.body.classList.remove('quiz-active');progress?.classList.remove('hidden');document.getElementById('bottomNav')?.classList.remove('hidden');document.querySelectorAll('.bottom-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='progress'));window.scrollTo({top:0,behavior:'smooth'});loadProgress();return}if(progress)progress.classList.add('hidden');const r=originalShow.apply(this,arguments);if(name==='home')setTimeout(refreshTodayBadge,80);else setTimeout(refreshStrips,20);return r};const originalRefresh=EPApp.refreshDashboard;EPApp.refreshDashboard=async function(){const r=await originalRefresh.apply(this,arguments);revealDailyControls();refreshTodayBadge();return r};const originalStartDirect=EPApp.startDirect;EPApp.startDirect=function(mode){if(mode==='daily')rememberDailyBase();return originalStartDirect.apply(this,arguments)};EPApp.loadProgress=loadProgress}if(typeof EPQuiz!=='undefined'&&!EPQuiz.__dailyOptimisticWired){EPQuiz.__dailyOptimisticWired=true;const originalPause=EPQuiz.pause;EPQuiz.pause=function(){optimisticDailyProgress();markProgressDirty();return originalPause.apply(this,arguments)};if(EPQuiz.finish&&!EPQuiz.__progressFinishWired){EPQuiz.__progressFinishWired=true;const originalFinish=EPQuiz.finish;EPQuiz.finish=function(){markProgressDirty();return originalFinish.apply(this,arguments)}}}window.EPPerformanceUI={refresh:()=>scheduleProgressRefresh(300,true),load:loadProgress,ensure:()=>ensureModuleStrips(cachedProgress()),dirty:markProgressDirty} }
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
