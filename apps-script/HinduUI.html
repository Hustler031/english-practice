<script>
(()=>{
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function wireAccordion(){const list=document.getElementById('hinduList');if(!list||list.dataset.accordionWired)return;list.dataset.accordionWired='1';list.addEventListener('click',e=>{const card=e.target.closest('.word-card');if(card&&list.contains(card))card.classList.toggle('expanded')})}
  function renderWords(words){const list=document.getElementById('hinduList'),actions=document.getElementById('hinduActions');if(!list)return;actions?.classList.toggle('hidden',!words.length);if(!words.length){list.innerHTML='<div class="empty card">Today’s 10-word batch has not been added yet.</div>';return}list.innerHTML=words.map((w,i)=>`<article class="word-card"><div class="row between"><div><span class="word-no">${i+1}</span><b class="word-title">${esc(w.word)}</b></div><span class="tag">${esc(w.pos||'')}</span></div><p class="meaning">${esc(w.meaning||'')}</p>${w.synonyms?`<p><b>Synonyms:</b> ${esc(w.synonyms)}</p>`:''}${w.antonyms?`<p><b>Antonyms:</b> ${esc(w.antonyms)}</p>`:''}${w.example?`<p><b>Example:</b> ${esc(w.example)}</p>`:''}${w.usage?`<p><b>Usage:</b> ${esc(w.usage)}</p>`:''}${w.tip?`<p class="tipbox"><b>Tip:</b> ${esc(w.tip)}</p>`:''}${w.memory?`<p><b>Remember:</b> ${esc(w.memory)}</p>`:''}<div class="muted source-line">${esc(w.sourceName||'The Hindu')} ${w.date?'· '+esc(w.date):''}</div></article>`).join('');wireAccordion()}
  async function ensureRoundButton(){const cached=window.EPFast&&EPFast.get('hindu:progress');if(cached){applyRound(cached);return}try{const p=await EPApp.call('getHinduPracticeProgress');if(window.EPFast)EPFast.set('hindu:progress',p);applyRound(p)}catch(e){}}
  function applyRound(p){const btn=document.getElementById('hinduActions')?.querySelector('button');if(!btn||!p||!Number(p.total||0))return;const completed=Math.max(0,Number(p.roundsCompleted||0)),next=Math.max(1,Number(p.nextRound||completed+1));btn.textContent=completed>0?`Practice Again · Round ${next}`:'Start Practice · Round 1';btn.dataset.round=String(next)}
  function wireOverrides(){if(typeof EPApp==='undefined'||EPApp.__hinduRoundWired)return;EPApp.__hinduRoundWired=true;EPApp.openHindu=async function(){EPApp.showTab('hindu');const cached=window.EPFast&&EPFast.get('hindu:today');if(cached){renderWords(cached);ensureRoundButton();return}document.getElementById('hinduList').innerHTML='<div class="list-card"><div class="muted">Preparing today’s words…</div></div>';ensureRoundButton();try{const words=await EPApp.call('getHinduToday');if(window.EPFast)EPFast.set('hindu:today',words);renderWords(words)}catch(e){document.getElementById('hinduList').innerHTML='<div class="empty card">Could not load today’s words.</div>'}}}
  function init(){wireAccordion();wireOverrides();const cached=window.EPFast&&EPFast.get('hindu:progress');if(cached)applyRound(cached)}
  document.addEventListener('DOMContentLoaded',init);
})();
</script>
