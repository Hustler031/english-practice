<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const BANK_KEY='ep:bankCoverage:hub:v2',SAVED_KEY='ep:mySavedRevision:hub:v2';
  const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  function ensureStyles(){if($('learningCacheUxStyles'))return;const s=document.createElement('style');s.id='learningCacheUxStyles';s.textContent='.lc-fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:9px;overflow:hidden}.lc-fold-head{padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer}.lc-fold-body{padding:0 12px 12px;border-top:1px solid var(--line)}.lc-fold-body.hidden{display:none}.lc-cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.lc-cat-row:last-child{border-bottom:0}.lc-cat-row small{display:block;color:var(--muted);margin-top:2px}.lc-chevron{font-size:18px;color:var(--muted)}.lc-cache-note{font-size:10px;color:var(--muted);margin-top:7px}.lc-day-inner{margin-top:8px}.lc-day-inner .msr-actions{margin-top:7px}';document.head.appendChild(s)}
  function showPage(id){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$(id)?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function ensureBank(){if($('bankCoverageView'))return;const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverage.back()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional first-pass exposure. Up to 10 genuinely unseen questions per category each day.</p></div></div><div id="bankCoverageBody"></div>';$('main')?.appendChild(s)}
  function renderBank(h){if(!h)return;const body=$('bankCoverageBody');if(!body)return;body.innerHTML=`<div class="card"><div class="row between"><b>BANK EXPOSED</b><strong>${Number(h.coverage||0).toFixed(1)}%</strong></div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(h.coverage||0))}%"></i></div><div class="muted" style="margin-top:7px">${h.exposed} / ${h.total} unique questions exposed${h.complete?' · BANK FULLY EXPOSED ✅':''}</div><div class="lc-cache-note">Updates silently in background</div></div>${(h.categories||[]).map(c=>`<div class="bank-row"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${c.exposed} / ${c.total} exposed · ${Number(c.coverage||0).toFixed(1)}% coverage</div></div><span class="tag">${c.complete?'DONE':c.available+' new'}</span></div><div class="bank-actions"><button class="btn soft mini" ${c.available?'':'disabled'} onclick='EPBankCoverage.start(${JSON.stringify(c.id)},${JSON.stringify(c.name)},${JSON.stringify(h.date)})'>${c.complete?'Fully Exposed':'Start '+c.available}</button><div class="mini-meter"><i style="width:${Math.min(100,Number(c.coverage||0))}%"></i></div></div></div>`).join('')}`}
  async function refreshBank(){try{const h=await EPApp.call('getBankCoverageHub');write(BANK_KEY,h);if($('bankCoverageView')&&!$('bankCoverageView').classList.contains('hidden'))renderBank(h)}catch(e){}}
  function openBank(){ensureStyles();ensureBank();showPage('bankCoverageView');const h=read(BANK_KEY);if(h)renderBank(h);else $('bankCoverageBody').innerHTML='<div class="list-card"><div class="muted">Preparing Bank Coverage…</div></div>';setTimeout(refreshBank,0)}

  function ensureSaved(){if(!$('mySavedRevisionView')){const s=document.createElement('section');s.id='mySavedRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision, organised like Starred Revision.</p></div></div><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost mini" onclick="EPMyWordsUX.open()">Manage Saved Words</button></div><div id="mySavedRevisionBody"></div>';$('main')?.appendChild(s)}if(!$('mySavedRevisionPicker')){const w=document.createElement('div');w.id='mySavedRevisionPicker';w.className='sheet-backdrop hidden';w.innerHTML='<div class="sheet"><h3 id="mySavedRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPMySavedRevision.runCount(10)">10</button><button onclick="EPMySavedRevision.runCount(20)">20</button><button onclick="EPMySavedRevision.runCount(50)">50</button><button onclick="EPMySavedRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPMySavedRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}}
  function statText(st){return `${Number(st?.focus||0)} active · ${Number(st?.newCount||0)} new · ${Number(st?.weak||0)} weak · ${Number(st?.difficult||0)} difficult`}
  function savedActions(scope,st){const j=JSON.stringify(scope);return `<div class="msr-actions"><button class="btn soft mini" ${st?.saved?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.view(${j},"all")'>View All</button><button class="btn soft mini" ${st?.focus?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.start(${j},"all",0)'>Practice All</button><button class="btn soft mini" ${st?.newCount?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.pick(${j},"new")'>Practice New</button><button class="btn soft mini" ${st?.weak?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.pick(${j},"weak")'>Weak</button><button class="btn soft mini" ${st?.difficult?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.start(${j},"difficult",0)'>Difficult</button><button class="btn soft mini" ${st?.mastered?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.view(${j},"mastered")'>Mastered</button></div>`}
  function categoryFold(h){return `<div class="lc-fold"><div class="lc-fold-head" onclick="EPMySavedCacheUX.toggle(this)"><div><b>Category Coverage</b><div class="muted">${Number(h.stats?.seen||0)} seen · ${Number(h.stats?.left||0)} left</div></div><span class="lc-chevron">›</span></div><div class="lc-fold-body hidden">${(h.categories||[]).map(c=>`<div class="lc-cat-row"><div><b>${esc(c.name)}</b><small>${c.seen} / ${c.total} seen · ${Number(c.coverage||0).toFixed(1)}%</small></div><strong>${c.left} left</strong></div>`).join('')||'<div class="muted" style="padding:10px 0">No category data yet.</div>'}</div></div>`}
  function groupCard(g){const scope={fromDay:g.fromDay,toDay:g.toDay};return `<div class="lc-fold"><div class="lc-fold-head" onclick="EPMySavedCacheUX.toggle(this)"><div><b>${esc(g.label)}</b><div class="muted">${statText(g.stats)}</div></div><span class="lc-chevron">›</span></div><div class="lc-fold-body hidden">${savedActions(scope,g.stats)}</div></div>`}
  function renderSaved(h){if(!h)return;const body=$('mySavedRevisionBody');if(!body)return;const all={fromDay:1,toDay:999999};body.innerHTML=`<div class="card"><b>All My Saved Words</b><div class="muted" style="margin-top:4px">${Number(h.stats?.saved||0)} saved · ${Number(h.stats?.seen||0)} seen · ${Number(h.stats?.left||0)} left</div>${savedActions(all,h.stats)}<div class="lc-cache-note">Updates silently in background</div></div>${categoryFold(h)}<h3 class="section-title">Day-wise Focus</h3>${(h.groups||[]).map(groupCard).join('')||'<div class="empty card">No enriched saved words are in practice yet.</div>'}`}
  async function refreshSaved(){try{const h=await EPApp.call('getMySavedRevisionHub');write(SAVED_KEY,h);if($('mySavedRevisionView')&&!$('mySavedRevisionView').classList.contains('hidden'))renderSaved(h)}catch(e){}}
  function openSaved(){ensureStyles();ensureSaved();showPage('mySavedRevisionView');const h=read(SAVED_KEY);if(h)renderSaved(h);else $('mySavedRevisionBody').innerHTML='<div class="list-card"><div class="muted">Preparing saved-word revision…</div></div>';setTimeout(refreshSaved,0)}
  function toggle(head){const body=head.nextElementSibling,ch=head.querySelector('.lc-chevron');if(!body)return;const opening=body.classList.contains('hidden');body.classList.toggle('hidden',!opening);if(ch)ch.textContent=opening?'⌄':'›'}
  window.EPMySavedCacheUX={toggle,refresh:refreshSaved};

  function wire(){ensureStyles();if(window.EPBankCoverage)EPBankCoverage.open=openBank;if(window.EPMySavedRevision){EPMySavedRevision.open=openSaved;if(window.EPApp)EPApp.openSaved=openSaved}const raw=EPApp?.call?.bind(EPApp);if(raw&&!EPApp.__learningCacheUxWired){EPApp.__learningCacheUxWired=true;EPApp.call=function(fn,...args){const p=raw(fn,...args);if(['submitAnswer','submitAnswerV2','submitHinduAnswer','submitHinduAnswerV2','setMarked','setMarkedV2','setHinduMarked','setHinduMarkedV2','setStarredRevisionDifficult','setCentralDifficult','markMastered','markMasteredV2'].includes(fn)){Promise.resolve(p).finally(()=>{setTimeout(refreshBank,0);setTimeout(refreshSaved,0)})}return p}}}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(wire,0));
})();
</script>
