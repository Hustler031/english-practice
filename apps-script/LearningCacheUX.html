<script>
(()=>{
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const BANK_KEY='ep:bankCoverage:hub:v3',SAVED_KEY='ep:mySavedRevision:hub:v3',BANK_DIRTY='ep:bankCoverage:dirty:v1',SAVED_DIRTY='ep:mySavedRevision:dirty:v1',TTL=60000;
  const openSavedFolds=new Set();let bankRefreshing=false,savedRefreshing=false,rebindTimer=0;
  const readRaw=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},writeRaw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const readSnap=k=>{const v=readRaw(k);if(!v)return null;return v&&v.data?{data:v.data,ts:Number(v.ts||0)}:{data:v,ts:0}};
  const writeSnap=(k,data)=>writeRaw(k,{data,ts:Date.now()});
  const dirty=k=>localStorage.getItem(k)==='1',markDirty=k=>{try{localStorage.setItem(k,'1')}catch(e){}},clearDirty=k=>{try{localStorage.removeItem(k)}catch(e){}};
  function localDateKey(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
  function ensureStyles(){if($('learningCacheUxStyles'))return;const s=document.createElement('style');s.id='learningCacheUxStyles';s.textContent='.lc-fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:9px;overflow:hidden}.lc-fold-head{padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;cursor:pointer}.lc-fold-body{padding:0 12px 12px;border-top:1px solid var(--line)}.lc-fold-body.hidden{display:none}.lc-cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.lc-cat-row:last-child{border-bottom:0}.lc-cat-row small{display:block;color:var(--muted);margin-top:2px}.lc-chevron{font-size:18px;color:var(--muted)}.lc-cache-note{font-size:10px;color:var(--muted);margin-top:7px}.lc-subdays{display:grid;gap:7px;margin-top:10px}.lc-day-inner{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}.lc-day-inner .lc-fold-head{padding:10px 11px}.lc-day-inner .lc-fold-body{padding:0 10px 10px}.lc-day-inner .msr-actions{margin-top:8px}.lc-stale{opacity:.72}';document.head.appendChild(s)}
  function showPage(id){document.querySelectorAll('.app-page').forEach(v=>v.classList.add('hidden'));$(id)?.classList.remove('hidden');$('bottomNav')?.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function ensureBank(){if($('bankCoverageView'))return;const s=document.createElement('section');s.id='bankCoverageView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPBankCoverage.back()">← Back</button><div><h2>Bank Coverage</h2><p class="muted">Optional first-pass exposure. Up to 10 genuinely unseen questions per category each day.</p></div></div><div id="bankCoverageBody"></div>';$('main')?.appendChild(s)}
  function renderBank(h){if(!h)return;const body=$('bankCoverageBody');if(!body)return;const stale=String(h.date||'')!==localDateKey();body.innerHTML=`<div class="card ${stale?'lc-stale':''}"><div class="row between"><b>BANK EXPOSED</b><strong>${Number(h.coverage||0).toFixed(1)}%</strong></div><div class="mini-meter" style="margin-top:9px"><i style="width:${Math.min(100,Number(h.coverage||0))}%"></i></div><div class="muted" style="margin-top:7px">${h.exposed} / ${h.total} unique questions exposed${h.complete?' · BANK FULLY EXPOSED ✅':''}</div><div class="lc-cache-note">${stale?'Showing last snapshot · updating today silently':'Cached · updates silently in background'}</div></div>${(h.categories||[]).map(c=>`<div class="bank-row ${stale?'lc-stale':''}"><div class="row between"><div><b>${esc(c.name)}</b><div class="muted">${c.exposed} / ${c.total} exposed · ${Number(c.coverage||0).toFixed(1)}% coverage</div></div><span class="tag">${c.complete?'DONE':c.available+' new'}</span></div><div class="bank-actions"><button class="btn soft mini" ${c.available&&!stale?'':'disabled'} onclick='EPBankCoverage.start(${JSON.stringify(c.id)},${JSON.stringify(c.name)},${JSON.stringify(h.date)})'>${c.complete?'Fully Exposed':'Start '+c.available}</button><div class="mini-meter"><i style="width:${Math.min(100,Number(c.coverage||0))}%"></i></div></div></div>`).join('')}`}
  async function refreshBank(force=false){const snap=readSnap(BANK_KEY);if(bankRefreshing||(!force&&!dirty(BANK_DIRTY)&&snap&&Date.now()-snap.ts<TTL&&String(snap.data?.date||'')===localDateKey()))return;bankRefreshing=true;try{const h=await EPApp.call('getBankCoverageHub');writeSnap(BANK_KEY,h);clearDirty(BANK_DIRTY);if($('bankCoverageView')&&!$('bankCoverageView').classList.contains('hidden'))renderBank(h)}catch(e){}finally{bankRefreshing=false}}
  function openBank(){ensureStyles();ensureBank();showPage('bankCoverageView');const snap=readSnap(BANK_KEY);if(snap?.data)renderBank(snap.data);else $('bankCoverageBody').innerHTML='<div class="list-card"><div class="muted">Preparing Bank Coverage for first use…</div></div>';setTimeout(()=>refreshBank(true),0)}

  function ensureSaved(){if(!$('mySavedRevisionView')){const s=document.createElement('section');s.id='mySavedRevisionView';s.className='app-page content hidden';s.innerHTML='<div class="subhead"><button class="btn ghost" onclick="EPMySavedRevision.back()">← Back</button><div><h2>My Saved Words</h2><p class="muted">Personal revision, organised like Starred Revision.</p></div></div><div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost mini" onclick="EPMyWordsUX.open()">Manage Saved Words</button></div><div id="mySavedRevisionBody"></div>';$('main')?.appendChild(s)}if(!$('mySavedRevisionPicker')){const w=document.createElement('div');w.id='mySavedRevisionPicker';w.className='sheet-backdrop hidden';w.innerHTML='<div class="sheet"><h3 id="mySavedRevisionPickerTitle">Choose questions</h3><div class="count-buttons"><button onclick="EPMySavedRevision.runCount(10)">10</button><button onclick="EPMySavedRevision.runCount(20)">20</button><button onclick="EPMySavedRevision.runCount(50)">50</button><button onclick="EPMySavedRevision.runCount(100)">100</button></div><button class="btn ghost full" onclick="EPMySavedRevision.closePicker()">Cancel</button></div>';document.body.appendChild(w)}}
  function statText(st){return `${Number(st?.focus||0)} active · ${Number(st?.newCount||0)} new · ${Number(st?.weak||0)} weak · ${Number(st?.difficult||0)} difficult`}
  function savedActions(scope,st){const j=JSON.stringify(scope);return `<div class="msr-actions"><button class="btn soft mini" ${st?.saved?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.view(${j},"all")'>View All</button><button class="btn soft mini" ${st?.focus?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.start(${j},"all",0)'>Practice All</button><button class="btn soft mini" ${st?.newCount?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.pick(${j},"new")'>Practice New</button><button class="btn soft mini" ${st?.weak?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.pick(${j},"weak")'>Weak</button><button class="btn soft mini" ${st?.difficult?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.start(${j},"difficult",0)'>Difficult</button><button class="btn soft mini" ${st?.mastered?'':'disabled'} onclick='event.stopPropagation();EPMySavedRevision.view(${j},"mastered")'>Mastered</button></div>`}
  function foldOpen(key){return openSavedFolds.has(key)}
  function categoryFold(h){const key='category',open=foldOpen(key);return `<div class="lc-fold" data-key="${key}"><div class="lc-fold-head" onclick="EPMySavedCacheUX.toggle(this)"><div><b>Category Coverage</b><div class="muted">${Number(h.stats?.seen||0)} seen · ${Number(h.stats?.left||0)} left</div></div><span class="lc-chevron">${open?'⌄':'›'}</span></div><div class="lc-fold-body ${open?'':'hidden'}">${(h.categories||[]).map(c=>`<div class="lc-cat-row"><div><b>${esc(c.name)}</b><small>${c.seen} / ${c.total} seen · ${Number(c.coverage||0).toFixed(1)}%</small></div><strong>${c.left} left</strong></div>`).join('')||'<div class="muted" style="padding:10px 0">No category data yet.</div>'}</div></div>`}
  function dayCard(d,parentKey){const key=`${parentKey}:day:${d.day}`,open=foldOpen(key),scope={fromDay:d.day,toDay:d.day};return `<div class="lc-day-inner" data-key="${key}"><div class="lc-fold-head" onclick="EPMySavedCacheUX.toggle(this)"><div><b>${esc(d.label)}</b><div class="muted">${statText(d.stats)}</div></div><span class="lc-chevron">${open?'⌄':'›'}</span></div><div class="lc-fold-body ${open?'':'hidden'}">${savedActions(scope,d.stats)}</div></div>`}
  function groupCard(g){const key=`group:${g.type}:${g.fromDay}-${g.toDay}`,open=foldOpen(key),scope={fromDay:g.fromDay,toDay:g.toDay},nested=(g.days||[]).map(d=>dayCard(d,key)).join('');return `<div class="lc-fold" data-key="${key}"><div class="lc-fold-head" onclick="EPMySavedCacheUX.toggle(this)"><div><b>${esc(g.label)}</b><div class="muted">${statText(g.stats)}</div></div><span class="lc-chevron">${open?'⌄':'›'}</span></div><div class="lc-fold-body ${open?'':'hidden'}">${savedActions(scope,g.stats)}${nested?`<div class="lc-subdays">${nested}</div>`:''}</div></div>`}
  function renderSaved(h){if(!h)return;const body=$('mySavedRevisionBody');if(!body)return;const all={fromDay:1,toDay:999999};body.innerHTML=`<div class="card"><b>All My Saved Words</b><div class="muted" style="margin-top:4px">${Number(h.stats?.saved||0)} saved · ${Number(h.stats?.seen||0)} seen · ${Number(h.stats?.left||0)} left</div>${savedActions(all,h.stats)}<div class="lc-cache-note">Cached · updates silently in background</div></div>${categoryFold(h)}<h3 class="section-title">Day-wise Focus</h3>${(h.groups||[]).map(groupCard).join('')||'<div class="empty card">No enriched saved words are in practice yet.</div>'}`}
  async function refreshSaved(force=false){const snap=readSnap(SAVED_KEY);if(savedRefreshing||(!force&&!dirty(SAVED_DIRTY)&&snap&&Date.now()-snap.ts<TTL))return;savedRefreshing=true;try{const h=await EPApp.call('getMySavedRevisionHub');writeSnap(SAVED_KEY,h);clearDirty(SAVED_DIRTY);if($('mySavedRevisionView')&&!$('mySavedRevisionView').classList.contains('hidden'))renderSaved(h)}catch(e){}finally{savedRefreshing=false}}
  function openSaved(){ensureStyles();ensureSaved();showPage('mySavedRevisionView');const snap=readSnap(SAVED_KEY);if(snap?.data)renderSaved(snap.data);else $('mySavedRevisionBody').innerHTML='<div class="list-card"><div class="muted">Preparing My Saved Words for first use…</div></div>';setTimeout(()=>refreshSaved(true),0)}
  function toggle(head){const fold=head.closest('[data-key]'),body=head.nextElementSibling,ch=head.querySelector('.lc-chevron');if(!fold||!body)return;const key=fold.dataset.key,opening=body.classList.contains('hidden');body.classList.toggle('hidden',!opening);if(opening)openSavedFolds.add(key);else openSavedFolds.delete(key);if(ch)ch.textContent=opening?'⌄':'›'}
  window.EPMySavedCacheUX={toggle,refresh:()=>refreshSaved(true)};

  function markLearningCachesDirty(){markDirty(BANK_DIRTY);markDirty(SAVED_DIRTY)}
  function rebindEntryPoints(){
    if(window.EPBankCoverage)EPBankCoverage.open=openBank;
    if(window.EPMySavedRevision){EPMySavedRevision.open=openSaved;if(window.EPApp)EPApp.openSaved=openSaved}
    const bank=$('bankCoverageQuick');if(bank&&bank.__cacheOpen!==true){bank.__cacheOpen=true;bank.onclick=e=>{e?.preventDefault?.();openBank()}}
    const cards=[...document.querySelectorAll('#revisionView .list-card')],saved=cards.find(x=>/^\s*🔖?\s*My Saved/i.test(String(x.textContent||'').trim())||String(x.textContent||'').includes('My Saved Words'));if(saved&&saved.__cacheOpen!==true){saved.__cacheOpen=true;saved.onclick=e=>{e?.preventDefault?.();openSaved()}}
  }
  function scheduleRebind(){clearTimeout(rebindTimer);rebindTimer=setTimeout(rebindEntryPoints,0)}
  function wire(){
    ensureStyles();rebindEntryPoints();
    document.addEventListener('click',e=>{const bank=e.target.closest?.('#bankCoverageQuick');if(bank){e.preventDefault();e.stopImmediatePropagation();openBank();return}const card=e.target.closest?.('#revisionView .list-card');if(card&&String(card.textContent||'').includes('My Saved')){e.preventDefault();e.stopImmediatePropagation();openSaved()}},true);
    const mo=new MutationObserver(scheduleRebind);mo.observe(document.body,{childList:true,subtree:true});
    const raw=EPApp?.call?.bind(EPApp);if(raw&&!EPApp.__learningCacheUxWired){EPApp.__learningCacheUxWired=true;EPApp.call=function(fn,...args){const p=raw(fn,...args);if(['submitAnswer','submitAnswerV2','submitHinduAnswer','submitHinduAnswerV2','setMarked','setMarkedV2','setMarkedCentralV3','setHinduMarked','setHinduMarkedV2','setHinduMarkedCentralV3','setStarredRevisionDifficult','setCentralDifficult','markMastered','markMasteredV2'].includes(fn))Promise.resolve(p).finally(markLearningCachesDirty);return p}}
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(wire,0));
})();
</script>
