<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6c7584;--primary:#3558d6;--primary2:#edf1ff;--ok:#16803a;--okbg:#eaf8ef;--bad:#c13b3b;--badbg:#fdeeee;--warn:#8b6500;--warnbg:#fff4d6;--line:#e4e8ef;--shadow:0 8px 24px rgba(30,42,70,.06);--nav:rgba(255,255,255,.97)}
    body.dark{--bg:#10131a;--card:#171c26;--text:#edf1f7;--muted:#9ba5b5;--primary:#86a0ff;--primary2:#202943;--ok:#72d994;--okbg:#173322;--bad:#ff8a8a;--badbg:#3a1d20;--warn:#f0bd57;--warnbg:#342b17;--line:#2a3140;--shadow:0 10px 28px rgba(0,0,0,.22);--nav:rgba(23,28,38,.97)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:84px}.topbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:9px 12px;border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:22px;margin:0;line-height:1.15}.brand small{display:block;color:var(--muted);font-size:14px;margin-top:2px}.top-actions{display:flex;gap:6px}.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}.content{padding:12px}.hidden{display:none!important}.grid{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#3153d2,#6e83e2);color:#fff;border:0}.hero .muted{color:rgba(255,255,255,.82)}.hero h2{font-size:24px;margin:4px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}.hero .eyebrow{color:#dfe6ff}.section-title{font-size:14px;font-weight:850;margin:18px 0 8px}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;min-height:42px}.btn.primary{background:var(--primary);color:#fff}.hero .btn.primary{background:#fff;color:#2949c1}.btn.soft{background:var(--primary2);color:var(--primary)}.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}.btn.warn{background:var(--warnbg);color:var(--warn)}.btn.ok{background:var(--okbg);color:var(--ok)}.btn.small{min-height:50px;padding:10px 6px;font-size:14px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tag{display:inline-flex;border-radius:999px;padding:6px 11px;font-size:13px;background:var(--card);color:var(--muted);border:1px solid var(--line)}.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.action-card{min-height:92px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.action-icon{font-size:22px}.action-title{font-size:14px;font-weight:850}.metric{font-size:25px;font-weight:900}.list{display:grid;gap:9px}.list-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);z-index:40;background:var(--nav);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;padding:5px 2px;color:var(--muted);font-size:9px}.nav button.active{color:var(--primary);font-weight:850}.nav b{display:block;font-size:17px;margin-bottom:1px}.quiz-wrap{padding:14px 18px 126px}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.quiz-title{font-size:20px;font-weight:900;line-height:1.2}.progressbar{height:8px;background:#dfe4ee;border-radius:999px;overflow:hidden;margin:8px 0 9px}.progressbar>div{height:100%;background:var(--primary)}.meta{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}.meta .tag{flex:0 0 auto}.question-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:var(--shadow);margin-top:8px}.question{font-size:clamp(27px,7vw,38px);line-height:1.35;margin:12px 0 22px;font-weight:850;white-space:pre-wrap}.options{display:grid;gap:12px}.option{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:16px 14px;min-height:72px;font-size:22px;line-height:1.25}.option .letter{width:42px;height:42px;flex:0 0 42px;border-radius:12px;font-size:22px;background:var(--primary2);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:900}.option.correct{border-color:#78c992;background:var(--okbg)}.option.wrong{border-color:#e49a9a;background:var(--badbg)}.answer-block{margin-top:12px;border:1px solid var(--line);border-radius:13px;overflow:hidden}.answer-head{padding:10px 11px;font-weight:850;border-bottom:1px solid var(--line);color:var(--ok)}.answer-body{padding:15px;line-height:1.62;font-size:18px}.answer-body h4{font-size:15px;margin:12px 0 5px}.formula-answer{font-size:23px;font-weight:900;color:var(--ok);white-space:pre-wrap}.explanation{white-space:pre-wrap}.memory{padding:8px 10px;border-left:3px solid var(--primary);background:var(--primary2);border-radius:9px;white-space:pre-wrap}.feedback-result{font-weight:850;margin-bottom:9px}.feedback-result.ok{color:var(--ok)}.feedback-result.bad{color:var(--bad)}.quiz-dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);z-index:50;background:var(--nav);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}.dock-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dock-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.dock-nav .btn{min-height:36px;padding:7px}.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:100;background:#192033;color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;max-width:88%;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(820px,100%);max-height:85vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px}.notearea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:10px}.loading{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;align-items:center;justify-content:center}.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.content{padding:14px}.grid2{gap:10px}.card{padding:14px}.hero h2{font-size:27px}.action-card{min-height:92px}.quiz-wrap{padding:14px 16px 132px}.topbar{padding:13px 16px}.brand h1{font-size:23px}.brand small{font-size:14px}.quiz-title{font-size:21px}.eyebrow{font-size:12px}.tag{font-size:12px;padding:6px 10px}.question-card{padding:20px 16px;border-radius:20px}.question{font-size:29px;line-height:1.34;margin:12px 0 24px}.option{padding:16px 14px;min-height:74px;font-size:22px;border-radius:18px}.option .letter{width:42px;height:42px;flex-basis:42px;font-size:22px}.dock-tools .btn{font-size:14px;padding:9px 4px;min-height:52px}.dock-nav .btn{font-size:16px;min-height:48px}.answer-body{font-size:18px}.formula-answer{font-size:23px}.meta{gap:7px}.quiz-dock{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
<div id="loading" class="loading"><div class="spinner"></div></div>
<div class="app"><header class="topbar"><div class="brand"><div><h1>Maths Revision</h1><small>SSC formula + method recall</small></div><div class="top-actions"><button class="iconbtn" onclick="toggleTheme()">◐</button><button class="iconbtn" onclick="refreshApp()">↻</button></div></div></header><main id="main"></main></div>
<nav id="nav" class="nav"><button data-view="home" onclick="showView('home')"><b>⌂</b>Home</button><button data-view="chapters" onclick="showView('chapters')"><b>▤</b>Chapters</button><button data-view="library" onclick="showView('library')"><b>▦</b>Library</button><button data-view="ondemand" onclick="showView('ondemand')"><b>◆</b>On Demand</button><button data-view="progress" onclick="showView('progress')"><b>▥</b>Progress</button></nav>
<div id="toast" class="toast hidden"></div><div id="modal" class="hidden"></div>
<script>
const app={bootstrap:null,view:'home',quiz:null,qStart:0};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function server(fn,...args){return new Promise((res,rej)=>{let r=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message:String(e))));if(fn==='getAppBootstrap')r.getAppBootstrap();else if(fn==='startQuiz')r.startQuiz(args[0]);else if(fn==='resumeSession')r.resumeSession(args[0]);else if(fn==='submitRecall')r.submitRecall(args[0]);else if(fn==='setMastered')r.setMastered(args[0],args[1]);else if(fn==='toggleMarked')r.toggleMarked(args[0]);else if(fn==='saveNote')r.saveNote(args[0],args[1]);else if(fn==='finishSession')r.finishSession(args[0]);else rej(new Error('Unknown server function: '+fn));})}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.add('hidden'),1800)}function loading(on){$('#loading').classList.toggle('hidden',!on)}function applyTheme(){document.body.classList.toggle('dark',localStorage.getItem('maths_theme')==='dark')}function toggleTheme(){localStorage.setItem('maths_theme',document.body.classList.contains('dark')?'light':'dark');applyTheme()}
async function init(){applyTheme();try{app.bootstrap=await server('getAppBootstrap');loading(false);showView('home')}catch(e){loading(false);document.querySelector('#main').innerHTML='<div class="content"><div class="card">'+esc(e.message)+'</div></div>'}}async function refreshApp(){loading(true);try{app.bootstrap=await server('getAppBootstrap');loading(false);showView(app.view)}catch(e){loading(false);toast(e.message)}}
function nav(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}function showView(v){app.view=v;$('#nav').classList.remove('hidden');nav(v);if(v==='home')home();if(v==='chapters')chapters();if(v==='library')library();if(v==='ondemand')ondemand();if(v==='progress')progress()}
function home(){const d=app.bootstrap.dashboard,r=app.bootstrap.resume,l=app.bootstrap.library;$('#main').innerHTML=`<div class="content grid">${r?`<div class="card row between"><div><div class="eyebrow">Continue where you left off</div><b>${esc(r.title)}</b><div class="muted" style="font-size:12px">Card ${Number(r.currentIndex)+1} of ${r.total}</div></div><button class="btn soft" onclick="resumeQuiz('${esc(r.sessionId)}')">Resume</button></div>`:''}<div class="card hero"><div class="eyebrow">Today's revision · Day ${d.day}</div><div class="row between"><div><h2>${esc(d.todayChapter)}</h2><div class="muted">${d.chapterTotal} core cards · ${d.chapterRemaining} active · ${d.freshRemaining} unseen</div></div><button class="btn primary" onclick="beginQuiz('daily')">Start</button></div></div><div class="section-title">Study</div><div class="grid2"><div class="card action-card" onclick="showView('chapters')"><div class="action-icon">📚</div><div><div class="action-title">Chapters</div><div class="muted" style="font-size:12px">Complete permanent banks</div></div></div><div class="card action-card" onclick="showView('library')"><div class="action-icon">🧠</div><div><div class="action-title">Library</div><div class="muted" style="font-size:12px">Formula, methods, notes</div></div></div><div class="card action-card" onclick="showView('ondemand')"><div class="action-icon">◆</div><div><div class="action-title">On Demand</div><div class="muted" style="font-size:12px">Custom + chat practice</div></div></div><div class="card action-card" onclick="showView('progress')"><div class="action-icon">📊</div><div><div class="action-title">Progress</div><div class="muted" style="font-size:12px">Chapter + type mastery</div></div></div></div><div class="section-title">Quick revision</div><div class="grid2"><button class="btn warn" onclick="beginQuiz('library',{cluster:'Marked'})">★ Marked · ${l.marked}</button><button class="btn ghost" onclick="beginQuiz('library',{cluster:'Formula'})">Σ Formula · ${l.formulas}</button><button class="btn ghost" onclick="beginQuiz('library',{cluster:'Fractions'})">⅞ Fractions · ${l.fractions}</button><button class="btn ghost" onclick="beginQuiz('library',{cluster:'Triplets'})">△ Triplets · ${l.triplets}</button></div><div class="section-title">Today's chapter</div><div class="card row between"><div><b>Want extra ${esc(d.todayChapter)}?</b><div class="muted" style="font-size:12px">More cards without changing rotation.</div></div><button class="btn soft" onclick="beginQuiz('practice_more',{chapter:${JSON.stringify(d.todayChapter)}})">+ Practice More</button></div><div class="section-title">Snapshot</div><div class="grid2"><div class="card"><div class="metric">${d.mastered}</div><div class="muted">Mastered</div></div><div class="card"><div class="metric">${d.total-d.mastered}</div><div class="muted">Still active</div></div></div></div>`}
function chapters(){const list=app.bootstrap.chapters||[];$('#main').innerHTML=`<div class="content"><div class="section-title">Chapters</div><div class="list">${list.map(c=>`<div class="list-card" onclick="beginQuiz('chapter',{chapter:${JSON.stringify(c.chapter)}})"><div class="row between"><div><b>${esc(c.chapter)}</b><div class="muted" style="font-size:12px">${c.total} total · ${c.mastered} mastered · ${c.remaining} active</div></div><button class="btn soft small">Open Bank</button></div><div class="muted" style="font-size:11px;margin-top:6px">Core ${c.core} · Support ${c.support} · Continuous ${c.continuous}</div></div>`).join('')}</div></div>`}
function library(){const l=app.bootstrap.library,items=[['Formula','Σ',l.formulas],['Methods','⚡',l.methods],['Fractions','⅞',l.fractions],['Triplets','△',l.triplets],['Marked','★',l.marked],['Notes','📝',l.notes],['Recent','＋',l.recent]];$('#main').innerHTML=`<div class="content"><div class="section-title">Library</div><div class="grid2">${items.map(x=>`<div class="card action-card" onclick="beginQuiz('library',{cluster:'${x[0]}'})"><div class="action-icon">${x[1]}</div><div><div class="action-title">${x[0]}</div><div class="muted" style="font-size:12px">${x[2]} cards</div></div></div>`).join('')}</div></div>`}
function ondemand(){
  const ch=(app.bootstrap.chapters||[]).map(x=>x.chapter),sets=app.bootstrap.demandSets||[];
  $('#main').innerHTML=`<div class="content grid">
    <div class="section-title">On Demand</div>

    <div class="card">
      <div class="eyebrow">Quick Practice</div>
      <div class="muted" style="font-size:14px;margin:6px 0 12px">Fresh random practice. Nothing here is preserved as a named set.</div>
      <div class="grid2">
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',topic:'Squares',count:20,title:'Squares · Quick Practice'})">□ Squares</button>
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',topic:'Cubes',count:20,title:'Cubes · Quick Practice'})">▣ Cubes</button>
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',count:20,title:'Squares + Cubes · Mixed'})">⚡ Mixed Memory</button>
        <button class="btn ghost" onclick="document.querySelector('#chapterBox').classList.toggle('hidden')">📚 Chapter Practice</button>
      </div>
      <div id="chapterBox" class="hidden" style="margin-top:12px">
        <select id="odChapter" style="width:100%;margin-bottom:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px">
          <option value="">All chapters</option>${ch.map(x=>`<option>${esc(x)}</option>`).join('')}
        </select>
        <select id="odCount" style="width:100%;margin-bottom:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px">
          <option>10</option><option selected>20</option><option>30</option><option>50</option>
        </select>
        <button class="btn primary" style="width:100%" onclick="runOD()">Start Chapter Practice</button>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">My Demand Sets</div>
      <div class="muted" style="font-size:14px;margin:6px 0 12px">Only sets you explicitly ask me in chat to preserve appear here.</div>
      ${sets.length?`<div class="list">${sets.map(s=>`<div class="list-card"><div class="row between"><div><b>${esc(s.name)}</b><div class="muted" style="font-size:13px">${s.count} questions${s.createdAt?' · '+esc(s.createdAt):''}</div>${s.description?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(s.description)}</div>`:''}</div><button class="btn soft small" onclick="beginQuiz('demand_set',{setId:${JSON.stringify(s.setId)},activeOnly:false})">Practice</button></div></div>`).join('')}</div>`:`<div class="muted" style="font-size:14px">No preserved demand set yet.</div>`}
    </div>
  </div>`
}
function runOD(){beginQuiz('ondemand',{chapter:$('#odChapter').value,count:Number($('#odCount').value),activeOnly:true})}
function progress(){const d=app.bootstrap.dashboard;$('#main').innerHTML=`<div class="content grid"><div class="section-title">Progress</div><div class="grid2"><div class="card"><div class="metric">${d.mastered}</div><div class="muted">Mastered</div></div><div class="card"><div class="metric">${d.attempted}</div><div class="muted">Attempted</div></div><div class="card"><div class="metric">${d.fractions}</div><div class="muted">Fraction cards</div></div><div class="card"><div class="metric">${d.triplets}</div><div class="muted">Triplet cards</div></div></div></div>`}
async function beginQuiz(mode,opts={}){loading(true);try{const x=await server('startQuiz',Object.assign({mode},opts));loading(false);if(!x.ok){toast(x.message);return}openQuiz(x)}catch(e){loading(false);toast(e.message)}}async function resumeQuiz(id){loading(true);try{const x=await server('resumeSession',id);loading(false);if(!x.ok){toast(x.message);return}openQuiz(x)}catch(e){loading(false);toast(e.message)}}
function openQuiz(x){app.quiz={sessionId:x.sessionId,title:x.title,mode:x.mode,questions:x.questions,index:Math.min(Number(x.currentIndex||0),x.questions.length-1)};$('#nav').classList.add('hidden');app.qStart=Date.now();renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){const q=app.quiz.questions[app.quiz.index],i=app.quiz.index,total=app.quiz.questions.length,pct=((i+1)/total)*100,isMcq=q.answerMode==='MCQ';const options=isMcq?`<div class="options">${(q.options||[]).map(o=>`<button id="opt${o.key}" class="option" onclick="chooseOption('${o.key}')"><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`:`<button id="showBtn" class="btn primary" style="width:100%" onclick="revealAnswer()">Show Answer</button>`;$('#main').innerHTML=`<div class="quiz-wrap"><div class="quiz-head"><div><div class="eyebrow">${esc(q.cardType||'Maths')} · ${esc(q.answerMode)}</div><div class="quiz-title">${esc(app.quiz.title)}</div></div><div class="tag">${i+1}/${total}</div></div><div class="progressbar"><div style="width:${pct}%"></div></div><div class="meta">${q.topic?`<span class="tag">${esc(q.topic)}</span>`:''}${q.subtopic?`<span class="tag">${esc(q.subtopic)}</span>`:''}<span class="tag">${esc(q.difficulty)}</span></div><div class="question-card"><div class="question">${esc(q.prompt)}</div>${options}<div id="answerArea" class="hidden">${answerHtml(q)}</div></div></div><div class="quiz-dock"><div class="dock-tools"><button id="masterBtn" class="btn ${q.mastered?'ok':'ghost'} small" onclick="toggleMasteredNow()">${q.mastered?'✓ Mastered':'☆ Master'}</button><button id="markBtn" class="btn ${q.marked?'warn':'ghost'} small" onclick="toggleMarkedNow()">${q.marked?'★ Marked':'☆ Mark'}</button><button class="btn ghost small" onclick="openNote()">📝 Note</button><button class="btn ghost small" onclick="pauseQuiz()">⏸ Pause</button></div><div class="dock-nav"><button class="btn ghost ${i===0?'hidden':''}" onclick="previousQuestion()">← Previous</button><button id="nextBtn" class="btn primary hidden" onclick="nextQuestion()">${i===total-1?'Finish':'Next →'}</button></div></div>`;if(q._revealed){if(isMcq)paintAnsweredOptions(q);showAnswerArea(false)}}
function answerHtml(q){const result=q.answerMode==='MCQ'&&q._answered?`<div class="feedback-result ${q._selected===q.correctOption?'ok':'bad'}">${q._selected===q.correctOption?'✓ Correct':'✕ Correct option: '+esc(q.correctOption)}</div>`:'';return `<div class="answer-block"><div class="answer-head">Answer</div><div class="answer-body">${result}<div class="formula-answer">${esc(q.answer)}</div>${q.explanation?`<h4>How it works</h4><div class="explanation">${esc(q.explanation)}</div>`:''}${q.memoryCue?`<h4>Memory cue</h4><div class="memory">${esc(q.memoryCue)}</div>`:''}${q.note?`<h4>My note</h4><div class="memory">${esc(q.note)}</div>`:''}</div></div>`}
function revealAnswer(){const q=app.quiz.questions[app.quiz.index];if(q.answerMode==='MCQ')return;q._revealed=true;showAnswerArea(true)}function showAnswerArea(scroll=true){const area=$('#answerArea');if(area)area.classList.remove('hidden');const b=$('#showBtn');if(b)b.classList.add('hidden');const n=$('#nextBtn');if(n)n.classList.remove('hidden');if(scroll)setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)}
function chooseOption(k){const q=app.quiz.questions[app.quiz.index];if(q.answerMode!=='MCQ'||q._answered)return;q._answered=true;q._selected=k;q._revealed=true;paintAnsweredOptions(q);showAnswerArea(true);saveAttempt(q,k===q.correctOption?'correct':'wrong')}function paintAnsweredOptions(q){['A','B','C','D'].forEach(k=>{const b=$('#opt'+k);if(!b)return;b.disabled=true;b.classList.remove('correct','wrong');if(k===q.correctOption)b.classList.add('correct');else if(k===q._selected)b.classList.add('wrong')})}
function saveAttempt(q,result){if(q._attemptSaved)return;q._attemptSaved=true;server('submitRecall',{questionId:q.questionId,result,mastered:!!q.mastered,mode:app.quiz.mode,sessionId:app.quiz.sessionId,nextIndex:app.quiz.index+1,responseSec:(Date.now()-app.qStart)/1000,variantType:q.variantType||'',correctOption:q.correctOption||''}).catch(()=>{q._attemptSaved=false;toast('Saving delayed. You can continue.')})}
function previousQuestion(){if(app.quiz.index<=0)return;app.quiz.index--;app.qStart=Date.now();renderQuestion();window.scrollTo(0,0)}function nextQuestion(){const q=app.quiz.questions[app.quiz.index];if(!q._revealed)return;if(q.answerMode!=='MCQ')saveAttempt(q,'seen');if(app.quiz.index>=app.quiz.questions.length-1){completeQuiz();return}app.quiz.index++;app.qStart=Date.now();renderQuestion();window.scrollTo(0,0)}
function toggleMasteredNow(){const q=app.quiz.questions[app.quiz.index];q.mastered=!q.mastered;const b=$('#masterBtn');b.className='btn '+(q.mastered?'ok':'ghost')+' small';b.textContent=q.mastered?'✓ Mastered':'☆ Master';server('setMastered',q.questionId,q.mastered).catch(()=>toast('Mastered status will retry later.'))}function toggleMarkedNow(){const q=app.quiz.questions[app.quiz.index];q.marked=!q.marked;const b=$('#markBtn');b.className='btn '+(q.marked?'warn':'ghost')+' small';b.textContent=q.marked?'★ Marked':'☆ Mark';server('toggleMarked',q.questionId).then(r=>{if(r&&typeof r.marked==='boolean')q.marked=r.marked}).catch(()=>toast('Mark saving delayed.'))}
function openNote(){const q=app.quiz.questions[app.quiz.index];openModal(`<h3>My note</h3><textarea id="noteText" class="notearea">${esc(q.note||'')}</textarea><div style="height:8px"></div><button class="btn primary" style="width:100%" onclick="saveNoteNow()">Save Note</button>`)}async function saveNoteNow(){const q=app.quiz.questions[app.quiz.index],text=$('#noteText').value;try{await server('saveNote',q.questionId,text);q.note=text;closeModal();renderQuestion();if(q._revealed)showAnswerArea(false);toast('Note saved')}catch(e){toast(e.message)}}function pauseQuiz(){openModal(`<div style="text-align:center"><h2>Session paused</h2><p class="muted">${esc(app.quiz.title)} · ${app.quiz.index+1}/${app.quiz.questions.length}</p><button class="btn primary" style="width:100%" onclick="closeModal()">Resume</button><div style="height:8px"></div><button class="btn ghost" style="width:100%" onclick="saveAndHome()">Save & Home</button></div>`)}function saveAndHome(){closeModal();app.bootstrap.resume={sessionId:app.quiz.sessionId,title:app.quiz.title,currentIndex:app.quiz.index,total:app.quiz.questions.length,mode:app.quiz.mode};showView('home')}
function completeQuiz(){const id=app.quiz.sessionId,chapter=app.bootstrap.dashboard.todayChapter,mode=app.quiz.mode;$('#nav').classList.remove('hidden');$('#main').innerHTML=`<div class="content"><div class="card" style="text-align:center"><div style="font-size:36px">✓</div><h2>Session complete</h2>${mode==='daily'?`<button class="btn primary" style="width:100%" onclick="beginQuiz('practice_more',{chapter:${JSON.stringify(chapter)}})">+ Practice More ${esc(chapter)}</button><div style="height:8px"></div>`:''}<button class="btn ghost" style="width:100%" onclick="showView('home')">Back Home</button></div></div>`;server('finishSession',id).then(()=>server('getAppBootstrap')).then(b=>app.bootstrap=b).catch(()=>{})}
function openModal(inner){const m=$('#modal');m.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${inner}</div></div>`;m.classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}init();
</script>
</body>
