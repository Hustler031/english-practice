name: Validate Shared Revision Recency

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*shared_revision_recency*'
      - '.github/scripts/validate-shared-revision-recency.cjs'
      - '.github/workflows/validate-shared-revision-recency.yml'
  push:
    branches:
      - 'english-shared-revision-recency-*'
    paths:
      - 'supabase/migrations/*shared_revision_recency*'
      - '.github/scripts/validate-shared-revision-recency.cjs'
      - '.github/workflows/validate-shared-revision-recency.yml'

permissions:
  contents: read

jobs:
  shared-revision-recency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shared revision recency
        run: node .github/scripts/validate-shared-revision-recency.cjs
