name: One-shot Phrasal recall assembly
on:
  push:
    branches: [english-phrasal-recall-assembly-20260906]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-phrasal-recall-assembly-20260906
      - name: Patch recall assembly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/english-content-task-bridge/phrasal-generation.ts')
          s=p.read_text()
          marker='''function phrasalCodeGate(draft: Json, assignment: Json) {'''
          insert='''function normalizeRecallDraft(draft: Json, assignment: Json) {\n  if (String(assignment?.requestedFamily || "").toLowerCase() !== "recall") return;\n  const targetWord = String(assignment?.targetWord || "").trim();\n  if (!targetWord) return;\n  // Reverse Recall controls are product UI semantics, not writer-owned content.\n  // Antigravity owns the meaning/situation cue and teaching text; code owns the fixed controls.\n  draft.word = targetWord;\n  draft.questionType = "Reverse Recall Card";\n  draft.optionA = "Yaad tha";\n  draft.optionB = "Confused";\n  draft.optionC = "Bhool gaya";\n  draft.optionD = "";\n  draft.correctKey = "A";\n}\n\n'''
          if insert.strip() not in s:
              if marker not in s: raise SystemExit('phrasalCodeGate marker missing')
              s=s.replace(marker,insert+marker,1)
          old='''structuralGate: (draft: Json) => { normalizeContextFillDraft(draft, assignment); return phrasalCodeGate(draft, assignment); },'''
          new='''structuralGate: (draft: Json) => { normalizeContextFillDraft(draft, assignment); normalizeRecallDraft(draft, assignment); return phrasalCodeGate(draft, assignment); },'''
          if old not in s: raise SystemExit('structuralGate marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-phrasal-recall-assembly.yml
          git add supabase/functions/english-content-task-bridge/phrasal-generation.ts
          git commit -m "Make Reverse Recall controls code-owned"
          git push origin HEAD:english-phrasal-recall-assembly-20260906