name: Probe Cloudflare deploy credentials

on:
  push:
    branches: [cloudflare-rerun-6745216]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check configured credential names only
        run: |
          token=missing
          account=missing
          if [ -n "$CLOUDFLARE_API_TOKEN" ] || [ -n "$CF_API_TOKEN" ]; then token=present; fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || [ -n "$CF_ACCOUNT_ID" ]; then account=present; fi
          echo "Cloudflare API token: $token"
          echo "Cloudflare account ID: $account"
          [ "$token" = present ] && [ "$account" = present ]
