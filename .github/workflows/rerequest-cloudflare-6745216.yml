name: Re-request Cloudflare exact SHA

on:
  push:
    branches: [cloudflare-rerun-6745216]

permissions:
  contents: read
  checks: write

jobs:
  rerequest:
    runs-on: ubuntu-latest
    steps:
      - name: Re-request Cloudflare Workers build for 6745216
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/99140222591/rerequest"
