          const keyed=r=>{const k=String(r.correctKey||'').toUpperCase();const h=(r.options||[]).find(x=>String(x.key||'').toUpperCase()===k);return String(h?.text||'').trim()};
          const resolve=(item,ref,cid)=>{const raw=String(ref.word||item.word||'').trim();if(compact(raw))return raw;const m=String(cid||'').match(/^(?:PV_|phrasal_)(.+)$/i);if(m){const x=m[1].replace(/_/g,' ').trim();if(compact(x))return x}const q=String(ref.question||item.question||'');const a=keyed(ref);if(/phrasal verb|which pair|_{2,}|=\s*\?/i.test(q)&&compact(a))return a;return ''};
