name: One-shot Phrasal canonical target hotfix

on:
  push:
    branches:
      - english-phrasal-canonical-target-hotfix-20260906
    paths:
      - '.github/workflows/zz-phrasal-canonical-target-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-phrasal-canonical-target-hotfix-20260906
          fetch-depth: 0
      - name: Apply deterministic target resolver
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/english-content-task-bridge/phrasal-generation.ts')
          s=p.read_text()
