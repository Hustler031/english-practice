name: Validate English Concept Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'web-v2/app/english/revision/ai-intelligence/**'
      - 'supabase/managed-migrations/**english**.sql'
      - '.github/scripts/validate-english-concept-dashboard.sql'
      - '.github/workflows/validate-english-concept-dashboard.yml'
  pull_request:
    paths:
      - 'web-v2/app/english/revision/ai-intelligence/**'
      - 'supabase/managed-migrations/**english**.sql'
      - '.github/scripts/validate-english-concept-dashboard.sql'
      - '.github/workflows/validate-english-concept-dashboard.yml'
  workflow_dispatch:

jobs:
  concept-dashboard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_concept_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_concept_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Execute concept coverage and worker-health contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_concept_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-concept-dashboard.sql
