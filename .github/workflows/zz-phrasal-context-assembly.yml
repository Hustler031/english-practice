name: One-shot Phrasal context assembly
on:
  push:
    branches: [english-phrasal-context-assembly-20260906]
    paths: ['.github/workflows/zz-phrasal-context-assembly.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-phrasal-context-assembly-20260906
          fetch-depth: 0
      - name: Patch deterministic context-fill assembly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/english-content-task-bridge/phrasal-generation.ts')
          s=p.read_text()
          marker='function phrasalCodeGate(draft: Json, assignment: Json) {'
          assert s.count(marker)==1
          helper='''function normalizeContextFillDraft(draft: Json, assignment: Json) {\n  if (String(assignment?.requestedFamily || "").toLowerCase() !== "context_fill") return;\n  const targetWord = String(assignment?.targetWord || "").trim();\n  if (!targetWord) return;\n  draft.word = targetWord;\n  draft.questionType = "Context Fill";\n\n  const keys = ["A", "B", "C", "D"] as const;\n  const key = keys.includes(String(draft?.correctKey || "").toUpperCase() as any)\n    ? String(draft.correctKey).toUpperCase() as "A"|"B"|"C"|"D"\n    : keys[Math.abs(String(assignment?.conceptId || targetWord).split("").reduce((n: number, ch: string) => n + ch.charCodeAt(0), 0)) % 4];\n  const targetNorm = normText(targetWord);\n  const seen = new Set<string>();\n  const distractors: string[] = [];\n  const add = (value: unknown) => {\n    const text = String(value || "").trim();\n    const norm = normText(text);\n    if (!text || !norm || norm === targetNorm || seen.has(norm)) return;\n    seen.add(norm);\n    distractors.push(text);\n  };\n\n  // Keep useful Antigravity distractors first.\n  keys.forEach(k => add(draft?.[`option${k}`]));\n\n  // Canonical bank is a deterministic structural fallback, not a second writer.\n  const reference = assignment?.referenceVariant || {};\n  if (Array.isArray(reference?.options)) reference.options.forEach((x: any) => {\n    const text = String(x?.text || "").trim();\n    if (compactPhrasalTarget(text)) add(text);\n  });\n  keys.forEach(k => {\n    const text = String(reference?.[`option${k}`] || "").trim();\n    if (compactPhrasalTarget(text)) add(text);\n  });\n  String(reference?.related || "").split(/[;,|]/).forEach((text: string) => {\n    if (compactPhrasalTarget(text)) add(text);\n  });\n\n  draft.correctKey = key;\n  let cursor = 0;\n  keys.forEach(k => {\n    if (k === key) draft[`option${k}`] = targetWord;\n    else if (distractors[cursor]) draft[`option${k}`] = distractors[cursor++];\n  });\n}\n\n'''
          s=s.replace(marker,helper+marker,1)
          old='structuralGate: (draft: Json) => phrasalCodeGate(draft, assignment),'
          new='structuralGate: (draft: Json) => { normalizeContextFillDraft(draft, assignment); return phrasalCodeGate(draft, assignment); },'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -F 'normalizeContextFillDraft' supabase/functions/english-content-task-bridge/phrasal-generation.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/english-content-task-bridge/phrasal-generation.ts
          git commit -m 'Assemble context-fill options deterministically'
          git push origin HEAD:english-phrasal-context-assembly-20260906
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/zz-phrasal-context-assembly.yml
          git commit -m 'Remove one-shot Phrasal context assembly workflow'
          git push origin HEAD:english-phrasal-context-assembly-20260906
