name: Validate English Content ChatGPT Bridge

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/english-content-task-bridge/**'
      - 'supabase/managed-migrations/**english_phrasal_hindu_chatgpt_bridge.sql'
      - 'supabase/managed-migrations/**english_phrasal_task_central_mapping.sql'
      - '.github/scripts/validate-english-content-chatgpt-bridge.cjs'
      - '.github/scripts/validate-english-content-chatgpt-bridge.sql'
      - '.github/workflows/validate-english-content-chatgpt-bridge.yml'
  pull_request:
    paths:
      - 'supabase/functions/english-content-task-bridge/**'
      - 'supabase/managed-migrations/**english_phrasal_hindu_chatgpt_bridge.sql'
      - 'supabase/managed-migrations/**english_phrasal_task_central_mapping.sql'
      - '.github/scripts/validate-english-content-chatgpt-bridge.cjs'
      - '.github/scripts/validate-english-content-chatgpt-bridge.sql'
      - '.github/workflows/validate-english-content-chatgpt-bridge.yml'
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/validate-english-content-chatgpt-bridge.cjs

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_bridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_bridge_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Execute bridge migrations and behavior contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_bridge_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-content-chatgpt-bridge.sql
