name: Validate English Content ChatGPT Bridge

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/english-content-task-bridge/**'
      - 'supabase/managed-migrations/**english_phrasal_hindu_chatgpt_bridge.sql'
      - 'supabase/managed-migrations/**english_phrasal_task_central_mapping.sql'
      - 'supabase/migrations/20260909011**'
      - 'supabase/migrations/20260909012**'
      - 'supabase/migrations/20260909013**'
      - 'web-v2/data/grammar-*'
      - '.github/scripts/validate-english-content-chatgpt-bridge.cjs'
      - '.github/scripts/validate-english-content-chatgpt-bridge.sql'
      - '.github/scripts/validate-english-grammar-stage1.sql'
      - '.github/workflows/validate-english-content-chatgpt-bridge.yml'
  pull_request:
    paths:
      - 'supabase/functions/english-content-task-bridge/**'
      - 'supabase/managed-migrations/**english_phrasal_hindu_chatgpt_bridge.sql'
      - 'supabase/managed-migrations/**english_phrasal_task_central_mapping.sql'
      - 'supabase/migrations/20260909011**'
      - 'supabase/migrations/20260909012**'
      - 'supabase/migrations/20260909013**'
      - 'web-v2/data/grammar-*'
      - '.github/scripts/validate-english-content-chatgpt-bridge.cjs'
      - '.github/scripts/validate-english-content-chatgpt-bridge.sql'
      - '.github/scripts/validate-english-grammar-stage1.sql'
      - '.github/workflows/validate-english-content-chatgpt-bridge.yml'
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate shared ChatGPT bridge source contracts
        run: node .github/scripts/validate-english-content-chatgpt-bridge.cjs
      - name: Type-check shared content Edge Function
        run: deno check supabase/functions/english-content-task-bridge/index.ts

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_bridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_bridge_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Execute Phrasal/Hindu bridge migrations and behavior contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_bridge_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-content-chatgpt-bridge.sql

  grammar-postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_grammar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_grammar_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Execute Grammar migrations and exact-20 adaptive behavior contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_grammar_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-grammar-stage1.sql
