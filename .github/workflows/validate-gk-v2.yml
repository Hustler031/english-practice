name: Validate GK V2

on:
  workflow_dispatch:
  push:
    branches: [gk-v2-integration, gk-v2-final-intelligence, gk-v2-lively-cache-freshness-polish]
    paths:
      - 'web-v2/**'
      - 'supabase/managed-migrations/**'
      - 'supabase/recovery-baselines/**'
      - '.github/workflows/validate-gk-v2.yml'
  pull_request:
    paths:
      - 'web-v2/**'
      - 'supabase/managed-migrations/**'
      - 'supabase/recovery-baselines/**'

concurrency:
  group: validate-gk-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gk_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: GK clean-room backend reconstruction
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gk_ci -v ON_ERROR_STOP=1 -f scripts/gk-ci-bootstrap.sql
          psql -h 127.0.0.1 -U postgres -d gk_ci -v ON_ERROR_STOP=1 -f ../supabase/recovery-baselines/gk_v2_reconstructed_pre25704_baseline.sql
          for f in ../supabase/managed-migrations/2026083*_gk*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U postgres -d gk_ci -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h 127.0.0.1 -U postgres -d gk_ci -v ON_ERROR_STOP=1 -f scripts/gk-ci-runtime-assertions.sql
          psql -h 127.0.0.1 -U postgres -d gk_ci -v ON_ERROR_STOP=1 -f scripts/gk-ci-final-intelligence-assertions.sql
      - name: GK behavioral contracts
        run: npm run contracts:gk
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      - name: Final scope secret and cleanliness guard
        run: |
          if [ -n "$(git -C .. status --porcelain --untracked-files=no)" ]; then
            echo "Tracked working tree changed during validation"
            git -C .. status --short --untracked-files=no
            exit 1
          fi
          p1="sb_se""cret_"
          p2="github_""pat_"
          if git -C .. grep -nE "${p1}[A-Za-z0-9_-]{8,}|${p2}[A-Za-z0-9_]+" -- .; then
            echo "Potential committed secret detected"
            exit 1
          fi
          if git -C .. grep -nE 'NEXT_PUBLIC_[A-Za-z0-9_]*SERVICE[_-]?ROLE' -- web-v2; then
            echo "Browser-exposed service-role configuration detected"
            exit 1
          fi
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$branch" == gk-* ]]; then
            git -C .. fetch origin main
            if git -C .. diff --name-only origin/main...HEAD | grep -E '^(web-v2/app/maths/|web-v2/lib/math|maths/|Maths/)'; then
              echo "Maths internals changed on GK integration branch"
              exit 1
            fi
          fi
          echo "Final scope, secret and tracked-tree cleanliness guard passed"
