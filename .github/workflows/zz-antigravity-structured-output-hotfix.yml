name: One-shot Antigravity structured output hotfix

on:
  push:
    branches:
      - english-antigravity-structured-output-hotfix-20260906
    paths:
      - '.github/workflows/zz-antigravity-structured-output-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-antigravity-structured-output-hotfix-20260906
          fetch-depth: 0
      - name: Wire Antigravity JSON schema to Interactions API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/_shared/english-antigravity-luna.ts')
          s=p.read_text()
          replacements=[
            ('export async function antigravityJson<T>(instructions:string,input:unknown,opts:{maxAttempts?:number}={}):Promise<{data:T;provider:"antigravity";model:string}> {',
             'export async function antigravityJson<T>(instructions:string,input:unknown,opts:{maxAttempts?:number;schema?:unknown}={}):Promise<{data:T;provider:"antigravity";model:string}> {'),
            ('          system_instruction:`${instructions}\\n\\nWork carefully with high reasoning effort. This is a self-contained writing task: do not call browser, web, shell, code-execution, or filesystem tools. Use only the supplied assignment as the learning source. Return ONLY one complete valid JSON object and no markdown or commentary.`,\n          environment:"remote",',
             '          system_instruction:`${instructions}\\n\\nWork carefully with high reasoning effort. This is a self-contained writing task: do not call browser, web, shell, code-execution, or filesystem tools. Use only the supplied assignment as the learning source. Return ONLY one complete valid JSON object and no markdown or commentary.`,\n          response_format:opts.schema?{type:"text",mime_type:"application/json",schema:opts.schema}:undefined,\n          environment:"remote",'),
            ('  let first=await antigravityJson<T>(args.instructions,args.input);',
             '  let first=await antigravityJson<T>(args.instructions,args.input,{schema:args.schema});'),
            ('      {maxAttempts:1},\n    );',
             '      {maxAttempts:1,schema:args.schema},\n    );'),
          ]
          # The maxAttempts call pattern appears exactly twice and both must receive the schema.
          old_sig=replacements[0][0]
          old_wire=replacements[1][0]
          old_first=replacements[2][0]
          if s.count(old_sig)!=1: raise SystemExit(f'signature count={s.count(old_sig)}')
          if s.count(old_wire)!=1: raise SystemExit(f'wire count={s.count(old_wire)}')
          if s.count(old_first)!=1: raise SystemExit(f'first call count={s.count(old_first)}')
          for old,new in replacements[:3]: s=s.replace(old,new,1)
          old_call=replacements[3][0]
          if s.count(old_call)!=2: raise SystemExit(f'repair call count={s.count(old_call)}')
          s=s.replace(old_call,replacements[3][1],2)
          p.write_text(s)
          PY
          grep -F 'response_format:opts.schema?{type:"text",mime_type:"application/json",schema:opts.schema}:undefined' supabase/functions/_shared/english-antigravity-luna.ts
          test "$(grep -o 'schema:args.schema' supabase/functions/_shared/english-antigravity-luna.ts | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/english-antigravity-luna.ts
          git commit -m 'Enforce Antigravity structured JSON output'
          git push origin HEAD:english-antigravity-structured-output-hotfix-20260906
      - name: Remove one-shot workflow from final branch diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-antigravity-structured-output-hotfix.yml
          git commit -m 'Remove one-shot structured-output workflow'
          git push origin HEAD:english-antigravity-structured-output-hotfix-20260906
