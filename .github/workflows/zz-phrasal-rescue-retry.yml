name: One-shot rare rescue retry
on:
  push:
    branches: [english-phrasal-rescue-retry-20260906]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-phrasal-rescue-retry-20260906
      - name: Patch Gemini rare rescue retry
        run: python .github/scripts/patch-phrasal-rescue-retry.py
      - name: Commit source-only result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-phrasal-rescue-retry.yml .github/scripts/patch-phrasal-rescue-retry.py
          git add supabase/functions/_shared/english-antigravity-luna.ts
          git commit -m "Retry transient Gemini rare rescue failures"
          git push origin HEAD:english-phrasal-rescue-retry-20260906