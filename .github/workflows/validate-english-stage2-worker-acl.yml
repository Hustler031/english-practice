name: Validate English Stage 2 Worker ACL

on:
  push:
    branches: [main]
    paths:
      - 'supabase/managed-migrations/20260905114000_english_inner_worker_acl_hardening.sql'
      - '.github/scripts/validate-english-stage2-worker-acl.sql'
      - '.github/workflows/validate-english-stage2-worker-acl.yml'
  pull_request:
    paths:
      - 'supabase/managed-migrations/20260905114000_english_inner_worker_acl_hardening.sql'
      - '.github/scripts/validate-english-stage2-worker-acl.sql'
      - '.github/workflows/validate-english-stage2-worker-acl.yml'

jobs:
  worker-acl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_worker_acl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_worker_acl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validate inner worker ACL boundary
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_worker_acl_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-stage2-worker-acl.sql
