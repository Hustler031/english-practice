name: English Grammar Stage 3 Readiness

on:
  push:
    branches:
      - english-grammar-intelligence-stage3-20260909
    paths:
      - 'supabase/migrations/2026090901**'
      - 'supabase/migrations/2026090902**'
      - 'supabase/functions/english-content-task-bridge/**'
      - 'web-v2/app/english/**'
      - 'web-v2/data/grammar-*'
      - 'web-v2/scripts/validate-grammar-stage*.mjs'
      - 'web-v2/package.json'
      - '.github/scripts/validate-english-grammar-stage*.sql'
      - '.github/scripts/validate-english-content-chatgpt-bridge.cjs'
      - '.github/workflows/grammar-stage3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fetch main boundary
        run: git fetch origin main --depth=1
      - name: Validate Grammar Stage 3 readiness
        run: node web-v2/scripts/validate-grammar-stage3.mjs
      - name: Validate shared ChatGPT bridge
        run: node .github/scripts/validate-english-content-chatgpt-bridge.cjs
      - name: Type-check shared content Edge Function
        run: deno check supabase/functions/english-content-task-bridge/index.ts
      - name: Show scoped diff
        run: git diff --name-only origin/main...HEAD

  grammar-postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_grammar_stage3
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_grammar_stage3"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Mirror Supabase extension layout
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_grammar_stage3 -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions; create extension if not exists pgcrypto with schema extensions;'
      - name: Prepare Stage 1 harness follow-up migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/validate-english-grammar-stage1.sql')
          s=p.read_text()
          anchor="\\ir ../../supabase/migrations/20260909013000_english_grammar_daily_pipeline.sql\n"
          follow=("\\ir ../../supabase/migrations/20260909013100_english_grammar_owner_resolution_fix.sql\n" "\\ir ../../supabase/migrations/20260909013200_english_grammar_selector_alias_fix.sql\n")
          if "20260909013200_english_grammar_selector_alias_fix.sql" not in s:
              if anchor not in s: raise SystemExit('Grammar migration anchor missing')
              p.write_text(s.replace(anchor,anchor+follow,1))
          PY
      - name: Execute Grammar World PostgreSQL contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_grammar_stage3 -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-grammar-stage2.sql

  web-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - run: npm ci
      - name: Grammar Stage 3 contract
        run: npm run contracts:grammar-stage3
      - name: TypeScript boundary
        run: npm run typecheck
      - name: Production build boundary
        run: npm run build
