name: Validate Study Project2 Cutover

on:
  push:
    branches:
      - maths-gk-project2-cutover-final-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-v2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hytehindbmjdwcfptsic.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-only-public-key
      NEXT_PUBLIC_STUDY_SUPABASE_URL: https://wylkaljwsrixrvvmtnak.supabase.co
      NEXT_PUBLIC_STUDY_SUPABASE_PUBLISHABLE_KEY: validation-only-public-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Maths contracts
        run: npm run contracts:maths

      - name: GK contracts
        run: npm run contracts:gk
