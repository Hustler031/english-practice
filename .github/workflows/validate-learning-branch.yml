name: Validate Learning Upgrade

on:
  push:
    branches: [feature/final-learning-system-20260822]
    paths:
      - 'apps-script/**'
      - '.github/scripts/validate-english.cjs'
      - '.github/scripts/validate-learning.cjs'
      - '.github/workflows/validate-learning-branch.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate existing English application
        run: node .github/scripts/validate-english.cjs
      - name: Validate final learning system
        run: node .github/scripts/validate-learning.cjs
