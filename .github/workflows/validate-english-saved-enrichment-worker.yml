name: Validate English Saved Enrichment Worker

on:
  push:
    branches: [main, english-saved-enrichment-worker-fix-20260905, fix-saved-enrichment-chatgpt-bridge-20260905, fix-saved-enrichment-private-transport-20260905]
    paths:
      - 'supabase/functions/english-saved-enrichment-worker/**'
      - 'supabase/functions/english-saved-enrichment-bridge/**'
      - 'supabase/managed-migrations/**english_saved_enrichment**.sql'
      - '.github/scripts/validate-english-saved-enrichment-worker.cjs'
      - '.github/workflows/validate-english-saved-enrichment-worker.yml'
  pull_request:
    paths:
      - 'supabase/functions/english-saved-enrichment-worker/**'
      - 'supabase/functions/english-saved-enrichment-bridge/**'
      - 'supabase/managed-migrations/**english_saved_enrichment**.sql'
      - '.github/scripts/validate-english-saved-enrichment-worker.cjs'
      - '.github/workflows/validate-english-saved-enrichment-worker.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/validate-english-saved-enrichment-worker.cjs
