name: Validate English PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/scripts/validate-english.cjs'
      - '.github/workflows/validate-english-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate frontend and backend contracts
        run: node .github/scripts/validate-english.cjs
