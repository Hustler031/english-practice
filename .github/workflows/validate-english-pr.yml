name: Validate English Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/scripts/validate-english.cjs'
      - '.github/scripts/validate-learning.cjs'
      - '.github/scripts/validate-reliability.cjs'
      - '.github/scripts/validate-starred-origin.cjs'
      - '.github/scripts/validate-ui-polish.cjs'
      - '.github/scripts/validate-daily-selection.cjs'
      - '.github/scripts/validate-star-reliability.cjs'
      - '.github/scripts/validate-daily-finish.cjs'
      - '.github/scripts/validate-module-sync.cjs'
      - '.github/scripts/validate-starred-intelligence.cjs'
      - '.github/scripts/validate-smart-saved-phrasal.cjs'
      - '.github/scripts/validate-saved-owner-cache.cjs'
      - '.github/scripts/validate-phrasal-recall.cjs'
      - '.github/scripts/validate-final-hardening.cjs'
      - '.github/workflows/validate-english-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate English application contracts
        run: node .github/scripts/validate-english.cjs
      - name: Validate final learning-system contracts
        run: node .github/scripts/validate-learning.cjs
      - name: Validate answer-save reliability contracts
        run: node .github/scripts/validate-reliability.cjs
      - name: Validate Starred origin-day contracts
        run: node .github/scripts/validate-starred-origin.cjs
      - name: Validate UI navigation polish contracts
        run: node .github/scripts/validate-ui-polish.cjs
      - name: Validate Daily selection transparency contracts
        run: node .github/scripts/validate-daily-selection.cjs
      - name: Validate central Star reliability contracts
        run: node .github/scripts/validate-star-reliability.cjs
      - name: Validate Daily background finish contracts
        run: node .github/scripts/validate-daily-finish.cjs
      - name: Validate module synchronization and Hindu fast path
        run: node .github/scripts/validate-module-sync.cjs
      - name: Validate Starred Intelligence isolation and rotation
        run: node .github/scripts/validate-starred-intelligence.cjs
      - name: Validate Smart My Saved and Phrasal mastery
        run: node .github/scripts/validate-smart-saved-phrasal.cjs
      - name: Validate production-order My Saved ownership and cache
        run: node .github/scripts/validate-saved-owner-cache.cjs
      - name: Validate Phrasal Today’s 20 and Reverse Recall
        run: node .github/scripts/validate-phrasal-recall.cjs
      - name: Validate final production hardening behaviour
        run: node .github/scripts/validate-final-hardening.cjs
      - name: Validate focused boot cleanup behaviour
        run: node .github/scripts/validate-boot-cleanup.cjs
