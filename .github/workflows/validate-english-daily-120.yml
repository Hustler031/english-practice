name: Validate English Daily 120

on:
  push:
    branches: [main]
    paths:
      - 'supabase/managed-migrations/**english**.sql'
      - 'web-v2/components/daily-rollover-sync.tsx'
      - 'web-v2/app/english/layout.tsx'
      - '.github/scripts/validate-english-daily-120.sql'
      - '.github/scripts/validate-english-daily-rollover-client.cjs'
      - '.github/workflows/validate-english-daily-120.yml'
  pull_request:
    paths:
      - 'supabase/managed-migrations/**english**.sql'
      - 'web-v2/components/daily-rollover-sync.tsx'
      - 'web-v2/app/english/layout.tsx'
      - '.github/scripts/validate-english-daily-120.sql'
      - '.github/scripts/validate-english-daily-rollover-client.cjs'
      - '.github/workflows/validate-english-daily-120.yml'
  workflow_dispatch:

jobs:
  daily-120:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_daily_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_daily_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Execute Daily exact-120/non-starvation contracts
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d english_daily_ci -v ON_ERROR_STOP=1 -f .github/scripts/validate-english-daily-120.sql
      - name: Validate client Daily rollover/cache contract
        run: node .github/scripts/validate-english-daily-rollover-client.cjs
