name: Validate English V2 Web

on:
  push:
    branches: [english-v2-supabase, english-v2-30d-mastery-sprint]
    paths:
      - 'web-v2/**'
      - 'supabase/managed-migrations/**english**.sql'
      - 'supabase/functions/english-ssc-sprint/**'
      - 'supabase/functions/english-context-worker/**'
      - '.github/scripts/validate-english-v2-fresh-session.cjs'
      - '.github/scripts/validate-english-v2-interaction-cooldown.cjs'
      - '.github/scripts/validate-english-v2-fresh-session-module-audit.cjs'
      - '.github/scripts/validate-english-v2-mastery-sprint.cjs'
      - '.github/scripts/validate-english-v2-starred-counter.cjs'
      - '.github/scripts/validate-english-v2-search-path.cjs'
      - '.github/scripts/validate-english-question-revision.cjs'
      - '.github/scripts/validate-english-question-revision.sql'
      - '.github/english-v2-fresh-session-module-audit.md'
      - '.github/workflows/validate-english-v2-web.yml'
  pull_request:
    paths:
      - 'web-v2/**'
      - 'supabase/managed-migrations/**english**.sql'
      - 'supabase/functions/english-ssc-sprint/**'
      - 'supabase/functions/english-context-worker/**'
      - '.github/scripts/validate-english-v2-fresh-session.cjs'
      - '.github/scripts/validate-english-v2-interaction-cooldown.cjs'
      - '.github/scripts/validate-english-v2-fresh-session-module-audit.cjs'
      - '.github/scripts/validate-english-v2-mastery-sprint.cjs'
      - '.github/scripts/validate-english-v2-starred-counter.cjs'
      - '.github/scripts/validate-english-v2-search-path.cjs'
      - '.github/scripts/validate-english-question-revision.cjs'
      - '.github/scripts/validate-english-question-revision.sql'
      - '.github/english-v2-fresh-session-module-audit.md'
      - '.github/workflows/validate-english-v2-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d english_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate English fresh-session migration syntax
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create schema english;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../supabase/managed-migrations/20260830180000_english_quiz_session_freshness.sql
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../supabase/managed-migrations/20260830181000_english_source_group_fresh_session.sql
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../supabase/managed-migrations/20260830210000_english_interaction_cooldown.sql
      - name: Execute and behavior-test question revision migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create table if not exists auth.users(id uuid primary key);
          create table if not exists english.questions(
            question_id text primary key,
            question text not null default '',
            option_a text, option_b text, option_c text, option_d text,
            correct text, explanation text, question_type text, difficulty text, word text,
            active boolean not null default true
          );
          create table if not exists english.question_concept_mappings(question_id text primary key,concept_id text);
          create table if not exists english.concepts(concept_id text primary key,name text,skill_family text,description text);
          create or replace function english.question_visible_to_user(uuid,text) returns boolean language sql stable as $$ select true $$;
          create or replace function english.context_worker_authorized(text) returns boolean language sql stable as $$ select true $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../supabase/managed-migrations/20260902150000_english_question_revision_proposals.sql
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../supabase/managed-migrations/20260902151000_english_question_revision_integrity.sql
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('english.question_revision_proposals') is null then raise exception 'proposal table missing'; end if;
            if to_regclass('english.user_question_revisions') is null then raise exception 'active revision table missing'; end if;
            if not exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='english_request_question_revision') then raise exception 'request RPC missing'; end if;
            if not exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='english_use_question_revision') then raise exception 'apply RPC missing'; end if;
          end $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d english_ci -v ON_ERROR_STOP=1 -f ../.github/scripts/validate-english-question-revision.sql
      - name: Validate English V2 fresh-session and mastery contracts
        run: |
          node ../.github/scripts/validate-english-v2-fresh-session.cjs
          node ../.github/scripts/validate-english-v2-interaction-cooldown.cjs
          node ../.github/scripts/validate-english-v2-fresh-session-module-audit.cjs
          node ../.github/scripts/validate-english-v2-mastery-sprint.cjs
          node ../.github/scripts/validate-english-v2-starred-counter.cjs
          node ../.github/scripts/validate-english-v2-search-path.cjs
          node ../.github/scripts/validate-english-question-revision.cjs
      - name: Validate existing English reliability and learning contracts
        run: |
          cd ..
          node .github/scripts/validate-english.cjs
          node .github/scripts/validate-learning.cjs
          node .github/scripts/validate-reliability.cjs
          node .github/scripts/validate-starred-origin.cjs
          node .github/scripts/validate-ui-polish.cjs
          node .github/scripts/validate-daily-selection.cjs
          node .github/scripts/validate-star-reliability.cjs
          node .github/scripts/validate-daily-finish.cjs
          node .github/scripts/validate-module-sync.cjs
          node .github/scripts/validate-starred-intelligence.cjs
          node .github/scripts/validate-smart-saved-phrasal.cjs
          node .github/scripts/validate-saved-owner-cache.cjs
          node .github/scripts/validate-phrasal-recall.cjs
          node .github/scripts/validate-final-hardening.cjs
          node .github/scripts/validate-boot-cleanup.cjs
      - name: Validate shared GK contracts
        run: npm run contracts:gk
      - name: Verify Maths source boundary and contracts
        run: |
          set -euo pipefail
          BASE="$(git -C .. merge-base HEAD origin/main)"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          CHANGED_MATHS="$(git -C .. diff --name-only "$BASE...HEAD" -- 'web-v2/app/maths/**' 'web-v2/components/maths-*' 'web-v2/lib/maths*' 'supabase/managed-migrations/*maths*.sql' || true)"
          if [[ "$BRANCH" != maths-* ]] && [ -n "$CHANGED_MATHS" ]; then
            echo "Unexpected Maths internals changed on English branch:"
            echo "$CHANGED_MATHS"
            exit 1
          fi
          if [[ "$BRANCH" == maths-* ]] && [ -n "$CHANGED_MATHS" ]; then
            echo "Intentional Maths branch detected; validating Maths contracts instead of rejecting scoped Maths changes."
          fi
          MAIN_SHA="$(git -C .. rev-parse refs/remotes/origin/main)"
          trap 'git -C .. update-ref refs/remotes/origin/main "$MAIN_SHA"' EXIT
          git -C .. update-ref refs/remotes/origin/main "$(git -C .. rev-parse HEAD)"
          npm run contracts:maths
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
