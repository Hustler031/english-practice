name: One-shot sparse Phrasal AI hotfix

on:
  push:
    branches:
      - english-phrasal-sparse-ai-hotfix-20260906
    paths:
      - '.github/workflows/zz-phrasal-sparse-ai-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-phrasal-sparse-ai-hotfix-20260906
          fetch-depth: 0
      - name: Apply sparse Phrasal patch
        run: python .github/scripts/zz-phrasal-sparse-ai-hotfix.py
      - name: Validate and commit
        run: |
          node .github/scripts/validate-english-hybrid-ai-content.cjs
          grep -F 'legacyPhrasal(item) || await generatePhrasal(item)' supabase/functions/english-content-task-bridge/phrasal-generation.ts
          grep -F 'expectedContextCount > 6' supabase/functions/english-content-task-bridge/phrasal-generation.ts
          grep -F 'eligible_rank<=6' supabase/managed-migrations/20260906033000_english_phrasal_context_fill_cap_six.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/english-content-task-bridge/phrasal-generation.ts supabase/managed-migrations/20260906033000_english_phrasal_context_fill_cap_six.sql .github/scripts/validate-english-hybrid-ai-content.cjs
          git commit -m 'Restore sparse AI generation for Daily Phrasal'
          git push origin HEAD:english-phrasal-sparse-ai-hotfix-20260906
      - name: Remove one-shot files
        run: |
          git rm .github/workflows/zz-phrasal-sparse-ai-hotfix.yml .github/scripts/zz-phrasal-sparse-ai-hotfix.py
          git commit -m 'Remove one-shot sparse Phrasal patch files'
          git push origin HEAD:english-phrasal-sparse-ai-hotfix-20260906
